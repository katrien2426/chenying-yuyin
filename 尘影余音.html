<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>尘影余音 · 广播剧播放器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f14;--sb:#16161f;--card:#1e1e2a;--acc:#c8a96e;--acc2:#8b6fc4;--text:#e8e4dc;--dim:#8a8799;--ja:#b8d4e8;--bdr:#2a2a38;--hov:#252535}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f14;color:var(--text);font-family:'Noto Serif SC','Hiragino Mincho ProN','Source Han Serif SC',serif;display:flex;height:100vh;overflow:hidden}
#sidebar{width:240px;min-width:200px;background:rgba(12,12,20,0.82);border-right:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;overflow:hidden}
#sb-head{padding:20px 16px 14px;border-bottom:1px solid var(--bdr)}
#sb-head h1{font-size:14px;font-weight:600;color:var(--acc);letter-spacing:.05em}
#sb-head p{font-size:11px;color:var(--dim);margin-top:3px}
#track-list{overflow-y:auto;flex:1;padding:8px 0}
#track-list::-webkit-scrollbar{width:4px}
#track-list::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.ti{padding:10px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s}
.ti:hover{background:var(--hov)}
.ti.active{background:linear-gradient(90deg,rgba(200,169,110,.15),transparent);border-left:3px solid var(--acc);padding-left:13px}
.ti-num{font-size:10px;color:var(--dim);width:22px;flex-shrink:0}
.ti-title{font-size:12px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti.active .ti-title{color:var(--acc)}
.ti-badge{font-size:9px;background:rgba(139,111,196,.25);color:var(--acc2);padding:1px 5px;border-radius:8px;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#now-playing{background:rgba(12,12,20,0.7);border-bottom:1px solid rgba(255,255,255,0.08);padding:14px 24px}
#np-title{font-size:15px;font-weight:600;color:var(--acc)}
#np-sub{font-size:11px;color:var(--dim);margin-top:2px}
#player-wrap{background:rgba(12,12,20,0.7);border-bottom:1px solid rgba(255,255,255,0.08);padding:10px 24px 14px}
#seek-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#seek{flex:1;height:4px;-webkit-appearance:none;background:var(--bdr);border-radius:2px;cursor:pointer;outline:none}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--acc);cursor:pointer}
.tlbl{font-size:11px;color:var(--dim);min-width:36px;font-variant-numeric:tabular-nums}
#ctrl-row{display:flex;align-items:center;gap:8px}
.cbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:6px;transition:color .15s,background .15s;line-height:1}
.cbtn:hover{color:var(--acc);background:rgba(200,169,110,.1)}
#play-btn{font-size:22px;color:var(--acc);background:rgba(200,169,110,.1);padding:6px 10px;border-radius:8px}
#vol-wrap{display:flex;align-items:center;gap:6px;margin-left:auto}
#speed-wrap{margin-left:12px}
#speed-select{background:rgba(255,255,255,0.08);border:1px solid var(--bdr);color:var(--text);border-radius:6px;padding:3px 6px;font-size:12px;cursor:pointer;outline:none}
#speed-select:hover{border-color:var(--acc);color:var(--acc)}
#vol{width:70px;height:4px;-webkit-appearance:none;background:var(--bdr);border-radius:2px;cursor:pointer;outline:none}
#vol::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--dim);cursor:pointer}
#sub-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
#cur-display{background:linear-gradient(135deg,rgba(200,169,110,.08),rgba(139,111,196,.08));border:1px solid rgba(200,169,110,.2);border-bottom:none;border-radius:10px 10px 0 0;padding:12px 16px;margin:0 24px;min-height:76px;display:flex;flex-direction:column;justify-content:center}
#cur-spk{font-size:11px;color:var(--acc2);font-weight:600;margin-bottom:4px}
#cur-ja{font-size:16px;color:var(--ja);line-height:1.6}
#cur-zh{font-size:17px;color:var(--text);line-height:1.6;font-weight:600;margin-top:3px}
#sub-ctrl{padding:10px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(12,12,20,0.55)}
.stog{font-size:11px;color:var(--dim);background:none;border:1px solid var(--bdr);border-radius:12px;padding:3px 10px;cursor:pointer;transition:all .15s}
.stog.on{color:var(--acc);border-color:var(--acc);background:rgba(200,169,110,.1)}
#auto-tog{margin-left:auto}
#sub-scroll{flex:1;overflow-y:auto;padding:12px 24px}
#sub-scroll::-webkit-scrollbar{width:4px}
#sub-scroll::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.se{display:flex;gap:14px;padding:8px 12px;border-radius:8px;transition:background .2s;cursor:pointer;margin-bottom:2px;background:rgba(12,12,20,0.45)}
.se:hover{background:rgba(30,30,50,0.75)}
.se.active{background:rgba(20,16,8,0.85);border-left:3px solid var(--acc);padding-left:9px}
.se-t{font-size:11px;color:var(--dim);min-width:38px;padding-top:2px;flex-shrink:0;font-variant-numeric:tabular-nums}
.se-body{flex:1}
.se-spk{font-size:11px;color:var(--acc2);font-weight:600;margin-bottom:2px}
.se-ja{font-size:15px;color:var(--ja);line-height:1.6}
.se-zh{font-size:15px;color:var(--text);line-height:1.6;margin-top:3px}
.se.active .se-zh{color:#fff5e6;font-weight:600}
#no-sub{display:none;text-align:center;color:var(--dim);font-size:14px;padding:60px 24px;line-height:2}
#footer{background:rgba(10,10,18,0.75);border-top:1px solid rgba(255,255,255,0.07);padding:8px 24px;font-size:11px;color:var(--dim);display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;flex-shrink:0}
#footer span{color:rgba(200,169,110,0.6)}
#footer .sep{opacity:0.3}
#menu-btn{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:0 8px}
@media(max-width:640px){
  #bg-layer{background-position:20% center !important}
  #menu-btn{display:block}
  #sidebar{position:fixed;left:-260px;top:0;height:100%;z-index:100;transition:left .25s;width:260px}
  #sidebar.open{left:0;box-shadow:4px 0 20px rgba(0,0,0,.6)}
  #overlay{display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.4)}
  #overlay.show{display:block}
  #now-playing{display:flex;align-items:center;gap:8px;padding:10px 14px}
  #np-title{font-size:14px}
  #player-wrap{padding:8px 14px 10px}
  #seek-row{gap:6px}
  #cur-display{margin:0 12px;padding:10px 12px;min-height:60px}
  #cur-ja{font-size:14px}
  #cur-zh{font-size:15px}
  #sub-ctrl{padding:8px 12px}
  #sub-scroll{padding:8px 12px}
  .se{padding:6px 8px}
  .se-ja,.se-zh{font-size:14px}
  #vol-wrap{display:none}
}
</style>
</head>
<body>

</div>

": "安丹特", "ja": "医療費も結構気にしてる感じだった……", "zh": "而且他好像也很在意医疗费用……"}, {"time": 60.0, "speaker": "芙蓉", "ja": "そうだったんですね……", "zh": "原来是这样……"}, {"time": 62.0, "speaker": "芙蓉", "ja": "私たちにできることがあればいいんですが……", "zh": "要是有什么我们能帮上忙的就好了……"}, {"time": 66.0, "speaker": "安丹特", "ja": "この街の事務所は、規模が限られているから……", "zh": "这座城市的事务所规模有限……"}, {"time": 70.0, "speaker": "安丹特", "ja": "結果が出次第、他の医療機関に紹介するつもりだよ", "zh": "等结果一出来，我就打算把他们转介绍到其他医疗机构"}, {"time": 74.0, "speaker": "安丹特", "ja": "容体が急変する患者さんも多いから……", "zh": "病情突然恶化的患者也很多……"}, {"time": 77.0, "speaker": "安丹特", "ja": "手が回らなくて……", "zh": "我们实在忙不过来……"}, {"time": 79.0, "speaker": "芙蓉", "ja": "え？急変って？", "zh": "咦？突然恶化？"}, {"time": 81.0, "speaker": "安丹特", "ja": "まあまあ、仕事の話は一旦置いといて。お腹空いたでしょ？", "zh": "好了好了，工作的事先放一边吧。你饿了吧？"}, {"time": 87.0, "speaker": "安丹特", "ja": "おすすめの屋台があるんだ", "zh": "我知道一家很推荐的摊子"}, {"time": 90.0, "speaker": "芙蓉", "ja": "え、でも〜", "zh": "呃，但是～"}, {"time": 91.0, "speaker": "安丹特", "ja": "いいからいいから", "zh": "走啦走啦"}, {"time": 96.0, "speaker": "小摊大叔", "ja": "よっしゃー！美味しいザワークラウト炒めはいかがかな？", "zh": "来喽！美味的炒酸菜，要不要尝尝？"}, {"time": 100.0, "speaker": "安丹特", "ja": "あれあれ、おじちゃん、二つお願い", "zh": "诶呀呀，大叔，麻烦来两份"}, {"time": 105.0, "speaker": "小摊大叔", "ja": "お、アンダンテ", "zh": "哦，安丹特啊"}, {"time": 107.0, "speaker": "小摊大叔", "ja": "いつもご贔屓にありがとうな", "zh": "谢谢你一直照顾我的生意啊"}, {"time": 110.0, "speaker": "小摊大叔", "ja": "この時間に珍しいじゃないか", "zh": "这个时间来还真少见啊"}, {"time": 112.0, "speaker": "小摊大叔", "ja": "あんたもツェルニーさんが目当てかい？", "zh": "你也是冲着车尔尼先生来的？"}, {"time": 114.0, "speaker": "安丹特", "ja": "もちろん", "zh": "当然"}, {"time": 115.0, "speaker": "安丹特", "ja": "今日はロドス本艦から同僚が来ててさ", "zh": "今天有位同事从罗德岛本舰过来了"}, {"time": 119.0, "speaker": "安丹特", "ja": "いつも仕事漬けの子だから", "zh": "她平时总是埋头工作"}, {"time": 121.0, "speaker": "安丹特", "ja": "気晴らしに無理やり引っ張ってきちゃった", "zh": "所以我硬是把她拉出来散散心"}, {"time": 124.0, "speaker": "小摊大叔", "ja": "そういうことなら", "zh": "既然是这样"}, {"time": 125.0, "speaker": "小摊大叔", "ja": "ぜひうちのザワークラウト炒めを", "zh": "那可一定要尝尝我家的炒酸菜"}, {"time": 127.0, "speaker": "小摊大叔", "ja": "食ってってもらわないとな", "zh": "必须让她吃一份再走才行"}, {"time": 12  "speaker": "比格勒", "ja": "デリバリーもできますよ", "zh": "也可以外送哦"}, {"time": 210.0, "speaker": "安丹特", "ja": "事務所に置いてある豆も、ビーグラーさんとこのだよ", "zh": "事务所里放着的咖啡豆，也是比格勒先生家的"}, {"time": 214.0, "speaker": "安丹特", "ja": "すごく美味しいだ", "zh": "非常好喝哦"}, {"time": 216.0, "speaker": "芙蓉", "ja": "そうなんですね", "zh": "原来是这样"}, {"time": 223.0, "speaker": "芙蓉", "ja": "ありがとうございます", "zh": "谢谢"}, {"time": 224.0, "speaker": "安丹特", "ja": "それで、異常回復現象についてですが……", "zh": "那么，关于异常恢复现象……"}, {"time": 229.0, "speaker": "安丹特", "ja": "ははは", "zh": "哈哈哈"}, {"time": 231.0, "speaker": "安丹特", "ja": "このところ、オリパシーの症状が急に好転する感染者が多数見られていて", "zh": "最近，有许多感染者的矿石病症状突然出现好转"}, {"time": 237.0, "speaker": "安丹特", "ja": "原因は不明", "zh": "原因不明"}, {"time": 240.0, "speaker": "安丹特", "ja": "送った報告書以上のことは、何も分かってないよ", "zh": "除了已经发过去的报告，我们也没有掌握更多情况"}, {"time": 243.0, "speaker": "芙蓉", "ja": "うーん", "zh": "嗯……"}, {"time": 245.0, "speaker": "芙蓉", "ja": "実際に訪ねてお話を聞くのが良さそうですね", "zh": "看来最好还是实际去拜访患者，听他们亲口说明情况"}, {"time": 249.0, "speaker": "芙蓉", "ja": "患者さんのリストを確認させていただけませんか？", "zh": "可以让我确认一下患者名单吗？"}, {"time": 252.0, "speaker": "安丹特", "ja": "事務所に戻ったらね", "zh": "等回事务所之后吧"}, {"time": 255.0, "speaker": "安丹特", "ja": "今日の任務はリラックス", "zh": "今天的任务是放松"}, {"time": 258.0, "speaker": "安丹特", "ja": "もうすぐツェルニーさんの演奏があるから", "zh": "车尔尼先生的演奏马上就要开始了"}, {"time": 260.0, "speaker": "安丹特", "ja": "一緒に聴きに行こう", "zh": "我们一起去听吧"}, {"time": 262.0, "speaker": "芙蓉", "ja": "ツェルニーさん……", "zh": "车尔尼先生……"}, {"time": 264.0, "speaker": "芙蓉", "ja": "資料で名前を見た記憶があります", "zh": "我记得在资料里见过这个名字"}, {"time": 266.0, "speaker": "芙蓉", "ja": "音楽家の方ですよね？", "zh": "他是一位音乐家，对吧？"}, {"time": 269.0, "speaker": "安丹特", "ja": "そう", "zh": "没错"}, {"time": 270.0, "speaker": "安丹特", "ja": "今のところリターニアで唯一", "zh": "目前，他是莱塔尼亚唯一一位"}, {"time": 272.0, "speaker": "安丹特", "ja": "みんなに認められている感染者音楽家だよ", "zh": "受到大家认可的感染者音乐家"}, {"time": 276.0, "speaker": "安丹特", "ja": "感染者を取り巻く環境は厳しいのに", "zh": "明明感染者所处的环境十分艰难"}, {"time": 279.0, "speaker": "安丹特", "ja": "各地でツアーも行ったことがあるんだ", "zh": "他却还曾在各地举办过巡演"}, {"time": 282.0, "speaker": "安丹特", "ja": "あっちにあるホール、見える？", "zh": "你看到那边的音乐厅了吗？"}, {"time": 285.0, "speaker": "安丹特", "ja": "あれはアフターグローホールと言うんだ", "zh": "那叫作夕照音乐厅"}, {"time": 289.0, "speaker": "芙蓉", "ja": "あの巨大な楽器のような建物ですか？", "zh": "就是那座像巨大乐器一样的建筑吗？"}, {"time": 293.0, "speaker": "安丹特", "ja": "うん。リターニアはもともと音楽が盛んだけど", "zh": "嗯。莱塔尼亚原本就是音乐盛行的地方"}, {"time": 296.0, "speaker": "安丹特", "ja": "アフターグローホールほどのコンサートホールは滅多にないからさ", "zh": "但像夕照音乐厅这样规模的音乐厅也很少见"}, {"time": 300.0, "speaker": "安丹特", "ja": "今日の演奏はそこで行うんだ", "zh": "今天的演奏就在那里面举行"}, {"time": 302.0, "speaker": "安丹特", "ja": "さあ、早く行こう", "zh": "走吧，我们快点过去"}, {"time": 308.0, "speaker": "安丹特", "ja": "始まるみたいだよ", "zh": "好像要开始了"}, {"time": 313.0, "speaker": "车尔尼", "ja": "皆様、お集まりいただきありがとうございます", "zh": "感谢各位莅临"}, {"time": 318.0, "speaker": "车尔尼", "ja": "ご挨拶代わりに、どうぞお聴きください", "zh": "请允许我以一曲代作问候，请各位聆听"}, {"time": 321.0, "speaker": "格特鲁德的侍从", "ja": "ミスター・ツェルニー、ゲルトルーデ様から", "zh": "车尔尼先生，格特鲁德大人传来口信"}, {"time": 324.0, "speaker": "格特鲁德的侍从", "ja": "直ちに演奏を中止するように", "zh": "要求您立刻停止演奏"}, {"time": 326.0, "speaker": "格特鲁德的侍从", "ja": "との伝言を預かっております", "zh": "我奉命前来转达"}, {"time": 328.0, "speaker": "格特鲁德的侍从", "ja": "お体の状況を考えても", "zh": "考虑到您的身体状况"}, {"time": 330.0, "speaker": "格特鲁德的侍从", "ja": "無理は控えた方がよろしいかと", "zh": "您还是不要勉强自己为好"}, {"time": 333.0, "speaker": "车尔尼", "ja": "それが、だからどうだというのですか", "zh": "那又如何？"}, {"time": 336.0, "speaker": "车尔尼", "ja": "よそならいざ知らず、このアフターグロー区においては", "zh": "在别处或许另当别论，但在这夕照区"}, {"time": 341.0, "speaker": "车尔尼", "ja": "私が皆様のために演奏するのを、止められるなどと思わないでください", "zh": "请不要以为你们能阻止我为大家演奏"}, {"time": 346.0, "speaker": "车尔尼", "ja": "ゲルトルーデさんにお伝えください。あれこれ口を出す暇があったら", "zh": "请转告格特鲁德女士，与其有空对别人指手画脚"}, {"time": 351.0, "speaker": "车尔尼", "ja": "ご自身のするべきことをしなさいと", "zh": "不如先去做她自己该做的事"}, {"time": 354.0, "speaker": "格特鲁德的仆人", "ja": "分かりました", "zh": "明白了"}, {"time": 357.0, "speaker": "芙蓉", "ja": "あの人はどなたですか？", "zh": "那个人是谁？"}, {"time": 360.0, "speaker": "芙蓉", "ja": "皆さん、どうして何も言わないんです？", "zh": "大家为什么都不说话？"}, {"time": 362.0, "speaker": "安丹特", "ja": "あれはゲルトルーデ・ストロッロさんの従者だよ", "zh": "那是格特鲁德·斯特罗洛女士的侍从"}, {"time": 367.0, "speaker": "芙蓉", "ja": "このヴィセハイム市の領主の、ストロッロ伯爵ですか？", "zh": "是这座维谢海姆市的领主，斯特罗洛伯爵吗？"}, {"time": 372.0, "speaker": "安丹特", "ja": "そうだよ", "zh": "没错"}, {"time": 374.0, "speaker": "安丹特", "ja": "でもツェルニーさんに軽く払われちゃってさ", "zh": "不过被车尔尼先生轻描淡写地打发掉了"}, {"time": 377.0, "speaker": "安丹特", "ja": "見ててすっとしたね", "zh": "看着真让人痛快"}, {"time": 380.0, "speaker": "车尔尼", "ja": "紳士淑女の皆様", "zh": "女士们，先生们"}, {"time": 382.0, "speaker": "车尔尼", "ja": "お集まりいただきありがとうございます", "zh": "感谢各位莅临"}, {"time": 386.0, "speaker": "车尔尼", "ja": "本日は一週間後に控える", "zh": "今日，我是为了即将在一周后举行的"}, {"time": 389.0, "speaker": "车尔尼", "ja": "私のフェアウェルコンサートの先駆けとして", "zh": "我的告别音乐会"}, {"time": 392.0, "speaker": "车尔尼", "ja": "場を温めるべく参りました", "zh": "前来为各位预热气氛"}, {"time": 394.0, "speaker": "车尔尼", "ja": "現在、私は来たるコンサートにて", "zh": "现在，我正在为即将到来的音乐会"}, {"time": 398.0, "speaker": "车尔尼", "ja": "共にステージに立ち", "zh": "招募能够与我一同登台、"}, {"time": 400.0, "speaker": "车尔尼", "ja": "音楽を奏でてくださる方々を募っており", "zh": "共同奏响音乐的各位"}, {"time": 403.0, "speaker": "车尔尼", "ja": "明日にはその選考会を開催する予定です", "zh": "明天将举行选拔会"}, {"time": 408.0, "speaker": "车尔尼", "ja": "どうぞ奮ってご応募いただき", "zh": "还请各位踊跃报名"}, {"time": 411.0, "speaker": "车尔尼", "ja": "存分に音楽に対する愛を表現してください", "zh": "尽情表达你们对音乐的热爱"}, {"time": 416.0, "speaker": "车尔尼", "ja": "私はここで皆様にエールをお送りいたします", "zh": "我在此向各位致以鼓励"}, {"time": 421.0, "speaker": "车尔尼", "ja": "なお、選考会には私も審査員として参加させていただきます", "zh": "另外，我也将作为评审参加选拔会"}, {"time": 427.0, "speaker": "车尔尼", "ja": "では、これより皆様のために数曲奏でさせていただきます", "zh": "那么，接下来请允许我为各位演奏几曲"}, {"time": 434.0, "speaker": "车尔尼", "ja": "どうぞ最後までお楽しみください", "zh": "还请各位欣赏到最后"}]}, {"title": "Einsetzen", "audio": "mp3/Track02 Einsetzen.mp3", "entries": [{"time": 2.0, "speaker": "黑键", "ja": "なるほど", "zh": "原来如此"}, {"time": 4.0, "speaker": "黑键", "ja": "つまり、君のお気に入りの", "zh": "也就是说"}, {"time": 6.0, "speaker": "黑键", "ja": "感染者音楽家のコンサートに参加しろと", "zh": "你是要我去参加那位你中意的感染者音乐家的音乐会"}, {"time": 10.0, "speaker": "黑键", "ja": "わざわざそのためだけに", "zh": "你特意只是为了这件事"}, {"time": 12.0, "speaker": "黑键", "ja": "ウルティカから私を呼び寄せたのか", "zh": "把我从乌提卡叫了过来吗？"}, {"time": 15.0, "speaker": "格特鲁德", "ja": "感染者相手でも", "zh": "即使对方是感染者"}, {"time": 17.0, "speaker": "格特鲁德", "ja": "この程度の接触でしたら", "zh": "这种程度的接触"}, {"time": 19.0, "speaker": "格特鲁德", "ja": "危険はありませんわよ", "zh": "也不会有什么危险的"}, {"time": 21.0, "speaker": "黑键", "ja": "その程度は言われなくとも分かっている", "zh": "这种事不用你说我也知道"}, {"time": 23.0, "speaker": "格特鲁德", "ja": "ずっと自由の空気を吸いたいと思ってたんじゃありませんの？", "zh": "您不是一直都想呼吸自由的空气吗？"}, {"time": 29.0, "speaker": "黑键", "ja": "確かにそうだ", "zh": "确实如此"}, {"time": 36.0, "speaker": "格特鲁德", "ja": "ご心配なさらずとも", "zh": "您不必担心"}, {"time": 38.0, "speaker": "格特鲁德", "ja": "お約束通り", "zh": "我会按照约定"}, {"time": 40.0, "speaker": "格特鲁德", "ja": "それから逃れるお手伝いはいたしますわ", "zh": "帮助您摆脱那东西"}, {"time": 43.0, "speaker": "格特鲁德", "ja": "あなたの数多くの不幸の根源であり", "zh": "它是您诸多不幸的根源"}, {"time": 47.0, "speaker": "格特鲁德", "ja": "ウルティカ伯爵として封じられている", "zh": "也是您被束缚为乌提卡伯爵的"}, {"time": 50.0, "speaker": "格特鲁德", "ja": "法的根拠の一つ", "zh": "法律依据之一"}, {"time": 52.0, "speaker": "格特鲁德", "ja": "その", "zh": "那个"}, {"time": 54.0, "speaker": "格特鲁德", "ja": "塵界の……", "zh": "尘界的……"}, {"time": 55.0, "speaker": "黑键", "ja": "講釈は必要ない", "zh": "不必解释"}, {"time": 57.0, "speaker": "黑键", "ja": "塵界の音は常に私の頭の中にあり、繰り返し響いては私を苦しめているのだからな", "zh": "尘界之音一直存在于我的脑海中，反复回响，折磨着我"}, {"time": 67.0, "speaker": "黑键", "ja": "君に求めるのは、具体的にどうするかの説明だ", "zh": "我要你说明的是，具体打算怎么做"}, {"time": 72.0, "speaker": "格特鲁德", "ja": "残念ながら、まだお伝えできる段階ではなくてよ", "zh": "很遗憾，现在还不是能告诉您的阶段"}, {"time": 77.0, "speaker": "格特鲁德", "ja": "ひとまず、音を取り除きたくば", "zh": "总之，如果想除去那声音"}, {"time": 81.0, "speaker": "格特鲁德", "ja": "閣下は何をおいてもコンサートに参加してくださいまし", "zh": "阁下无论如何都请先参加音乐会"}, {"time": 86.0, "speaker": "格特鲁德", "ja": "それがならなければ、私も力にはなれませんわ", "zh": "若做不到这一点，我也帮不了您"}, {"time": 90.0, "speaker": "黑键", "ja": "あなたがパトロンなのだろう", "zh": "你不是他的赞助人吗？"}, {"time": 93.0, "speaker": "黑键", "ja": "一言言えば済む話ではないか", "zh": "只要你一句话，不就能解决了吗？"}, {"time": 95.0, "speaker": "格特鲁德", "ja": "彼は音楽に関しては非常に頑固なのです", "zh": "他在音乐方面非常固执"}, {"time": 100.0, "speaker": "格特鲁德", "ja": "特に今回は格別に思い入れがある舞台ですから", "zh": "尤其这次还是他倾注了特别感情的舞台"}, {"time": 105.0, "speaker": "格特鲁德", "ja": "自分の認めない音は、一音たりとも参加させはいたしませんわ", "zh": "凡是他不认可的声音，哪怕一个音，他也不会允许加入"}, {"time": 111.0, "speaker": "黑键", "ja": "分かった", "zh": "明白了"}, {"time": 113.0, "speaker": "格特鲁德", "ja": "車を回してありますから、使ってくださいまし", "zh": "车已经为您备好了，请用吧"}, {"time": 117.0, "speaker": "黑键", "ja": "気遣いに感謝しよう", "zh": "感谢你的体贴"}, {"time": 119.0, "speaker": "黑键", "ja": "では、また", "zh": "那么，回头见"}, {"time": 121.0, "speaker": "黑键", "ja": "ミス・ストロッロ", "zh": "斯特罗洛小姐"}, {"time": 122.0, "speaker": "格特鲁德", "ja": "お忘れですかしら？", "zh": "您忘了吗？"}, {"time": 125.0, "speaker": "格特鲁德", "ja": "私は名字より、名前で呼ばれる方が好みですのよ", "zh": "比起姓氏，我更喜欢别人叫我的名字"}, {"time": 130.0, "speaker": "黑键", "ja": "失礼したな", "zh": "失礼了"}, {"time": 132.0, "speaker": "格特鲁德", "ja": "ミス・ゲルトルーデ……また", "zh": "格特鲁德小姐……回头见"}, {"time": 139.0, "speaker": "格特鲁德", "ja": "ラハマン？伯爵がそちらに向かいましたわ", "zh": "拉赫曼？伯爵已经往你那边去了"}, {"time": 144.0, "speaker": "格特鲁德", "ja": "ええ。動きがあれば報告を……よろしくて？", "zh": "嗯。若有什么动向就向我报告……明白了吗？"}]}, {"title": "Auftakt", "audio": "mp3/Track03 Auftakt.mp3", "entries": [{"time": 2.0, "speaker": "白垩的爷爷", "ja": "クライデ、どうしても選考会に行くつもりかね", "zh": "白垩，你无论如何都打算去参加选拔会吗？"}, {"time": 7.0, "speaker": "白垩", "ja": "はい。やっぱり参加したいんです", "zh": "是的。我还是想参加"}, {"time": 10.0, "speaker": "", "ja": "だが、お前のチェロはとっくに壊れて使えないだろう", "zh": "可是，你的大提琴不是早就坏了，已经不能用了吗？"}, {"time": 14.0, "speaker": "白垩", "ja": "大丈夫ですよ。楽器は貸してくれるそうです", "zh": "没关系的。听说他们会借乐器给我"}, {"time": 19.0, "speaker": "白垩", "ja": "お爺さん、その……", "zh": "爷爷，那个……"}, {"time": 23.0, "speaker": "白垩", "ja": "怒っていますか？", "zh": "您是在生气吗？"}, {"time": 25.0, "speaker": "白垩的爷爷", "ja": "そうではない。心配なだけだ", "zh": "不是。我只是担心你"}, {"time": 27.0, "speaker": "白垩的爷爷", "ja": "申し込みを終えたら、すぐに戻ってきなさい。道草を食ってはならんぞ", "zh": "报完名之后就马上回来，不许在路上闲逛"}, {"time": 34.0, "speaker": "白垩", "ja": "はい、約束します。寄り道はしません", "zh": "好，我答应您。我不会绕路的"}, {"time": 38.0, "speaker": "白垩", "ja": "それじゃあ、行ってきます。台所にお茶があります", "zh": "那我出门了。厨房里有茶"}, {"time": 42.0, "speaker": "白垩", "ja": "冷める前にちゃんと飲んでくださいね", "zh": "请在凉掉之前好好喝掉哦"}, {"time": 45.0, "speaker": "白垩的爷爷", "ja": "ああ", "zh": "嗯"}]}, , "speaker": "车尔尼", "ja": "この手の援助には条件が付き物です", "zh": "这种援助通常都附带条件"}, {"time": 350.0, "speaker": "车尔尼", "ja": "昨年、とある音楽家が騙され、極めて不公平な契約を結ぶよう迫られた例もあります", "zh": "去年就有一位音乐家被骗，被迫签下了极其不公平的契约"}, {"time": 357.0, "speaker": "黑键", "ja": "発言に気をつけてもらおうか。私がそのような不心得者だとでも？", "zh": "请注意你的措辞。你是想说我是那种不怀好意的人吗？"}, {"time": 362.0, "speaker": "车尔尼", "ja": "クライデさん、改めて聞きますが、本当に彼と参加されますか？", "zh": "白垩先生，我再问你一次，你真的要和他一起参加吗？"}, {"time": 368.0, "speaker": "白垩", "ja": "エーベンホルツさんには入口で助けてもらいましたし、それに、おじいさんが助かるなら……", "zh": "黑键先生刚才在入口处帮了我，而且，如果能救爷爷的话……"}, {"time": 377.0, "speaker": "车尔尼", "ja": "分かりました。明日に『有名の夜明け』の再試験をします", "zh": "我明白了。明天将进行《有名的黎明》的复试"}, {"time": 383.0, "speaker": "车尔尼", "ja": "その際に最終的な合否を決定しましょう。それと", "zh": "到时再决定最终是否合格。另外"}, {"time": 389.0, "speaker": "车尔尼", "ja": "クライデさん、あなたはチェロを持っていませんね", "zh": "白垩先生，你没有自己的大提琴吧"}, {"time": 394.0, "speaker": "车尔尼", "ja": "会場の備品を持ち帰らせるわけにはいきません。ひとまず私の私物を持っていってください", "zh": "会场的备用乐器不能让你带走。你先把我的私人物品带去用吧"}, {"time": 401.0, "speaker": "白垩", "ja": "本当にいいんですか？", "zh": "真的可以吗？"}, {"time": 403.0, "speaker": "车尔尼", "ja": "もちろんです", "zh": "当然"}, {"time": 406.0, "speaker": "车尔尼", "ja": "もしも明日、私の求める水準をクリアできたなら", "zh": "如果明天你们能达到我要求的水准"}, {"time": 411.0, "speaker": "车尔尼", "ja": "チェロは差し上げます", "zh": "这把大提琴就送给你"}, {"time": 415.0, "speaker": "白垩", "ja": "ありがとうございます", "zh": "谢谢您"}, {"time": 420.0, "speaker": "安丹特", "ja": "うーん", "zh": "嗯……"}, {"time": 422.0, "speaker": "安丹特", "ja": "やっぱり厳しいコメントばっかりだね。さっきの二人の演奏なんか、すごく良かったと思うけどなあ", "zh": "果然全是很严厉的评价啊。刚才那两个人的演奏，我倒觉得非常不错呢"}, {"time": 431.0, "speaker": "芙蓉", "ja": "確かに美しい演奏でした", "zh": "确实是很美的演奏"}, {"time": 434.0, "speaker": "芙蓉", "ja": "でも、きっと", "zh": "不过，我想"}, {"time": 435.0, "speaker": "芙蓉", "ja": "ツェルニーさんは自分の音楽に正直で、厳格な方なんでしょう", "zh": "车尔尼先生大概是个忠于自己音乐、也十分严格的人吧"}, {"time": 440.0, "speaker": "安丹特", "ja": "でもなあ……", "zh": "可是啊……"}, {"time": 442.0, "speaker": "芙蓉", "ja": "ほら", "zh": "好了"}, {"time": 443.0, "speaker": "芙蓉", "ja": "そろそろ終わるようですし、声をかけに行きましょう", "zh": "看样子差不多要结束了，我们去打声招呼吧"}, {"time": 450.0, "speaker": "芙蓉", "ja": "こんにちは、ツェルニーさん", "zh": "您好，车尔尼先生"}, {"time": 452.0, "speaker": "芙蓉", "ja": "はじめまして", "zh": "初次见面"}, {"time": 454.0, "speaker": "芙蓉", "ja": "私はロドスのオペレーター", "zh": "我是罗德岛的干员"}, {"time": 456.0, "speaker": "芙蓉", "ja": "ハイビスカスです", "zh": "芙蓉"}, {"time": 460.0, "speaker": "车尔尼", "ja": "こんにちは", "zh": "你好"}, {"time": 461.0, "speaker": "车尔尼", "ja": "どうしたのですか？", "zh": "有什么事吗？"}, {"time": 462.0, "speaker": "芙蓉", "ja": "いえ、別件でクライデさんとツェルニーさんに用がありまして", "zh": "是这样的，我另有事情要找白垩先生和车尔尼先生"}, {"time": 468.0, "speaker": "安丹特", "ja": "クライデさん？", "zh": "白垩先生？"}, {"time": 469.0, "speaker": "安丹特", "ja": "おじいさんの検査結果が出たよ", "zh": "你爷爷的检查结果出来了"}, {"time": 472.0, "speaker": "安丹特", "ja": "専門家の治療が必要な段階だから", "zh": "已经到了需要专家治疗的阶段"}, {"time": 475.0, "speaker": "安丹特", "ja": "入院して静養した方がいいね", "zh": "最好住院静养"}, {"time": 478.0, "speaker": "白垩", "ja": "そんな……", "zh": "怎么会……"}, {"time": 479.0, "speaker": "安丹特", "ja": "早急に入院先を探すけど", "zh": "我会尽快寻找能住院的地方"}, {"time": 482.0, "speaker": "安丹特", "ja": "時間がかかるかもしれない", "zh": "但可能需要一些时间"}, {"time": 485.0, "speaker": "安丹特", "ja": "その間はなるべく安静にさせて", "zh": "在那之前，尽量让他保持安静"}, {"time": 488.0, "speaker": "安丹特", "ja": "気をつけてあげて", "zh": "好好照顾他"}, {"time": 490.0, "speaker": "白垩", "ja": "でも、僕は選考会に出ないと……", "zh": "可是，我还必须参加选拔会……"}, {"time": 494.0, "speaker": "芙蓉", "ja": "それなら、ロドスの事務所で静養するのはいかがでしょうか？", "zh": "这样的话，让他在罗德岛事务所静养如何？"}, {"time": 498.0, "speaker": "车尔尼", "ja": "お前たち、何を企んでいる？", "zh": "你们在打什么主意？"}, {"time": 502.0, "speaker": "车尔尼", "ja": "黙って聞いていれば、どうせ入院費をむしり取る気だろう", "zh": "我听你们说了半天，反正就是想敲诈住院费吧"}, {"time": 507.0, "speaker": "车尔尼", "ja": "ミスター・クライデ、入院先なら私が探してやる", "zh": "白垩先生，住院的地方由我来找"}, {"time": 511.0, "speaker": "芙蓉", "ja": "私たちはロドスアイランド製薬会社という、まっとうな会社です", "zh": "我们是罗德岛制药公司，是一家正当经营的公司"}, {"time": 516.0, "speaker": "芙蓉", "ja": "各地で感染者の方に人道的な支援を行っています", "zh": "我们在各地为感染者提供人道援助"}, {"time": 521.0, "speaker": "芙蓉", "ja": "決して不当な利益を目的としているわけではありません", "zh": "绝不是以牟取不正当利益为目的"}, {"time": 525.0, "speaker": "车尔尼", "ja": "製薬会社？", "zh": "制药公司？"}, {"time": 527.0, "speaker": "车尔尼", "ja": "営利会社に不当も何もあるか？", "zh": "营利公司还有什么正当不正当可言？"}, {"time": 530.0, "speaker": "白垩", "ja": "ロドスの方々には", "zh": "罗德岛的各位"}, {"time": 531.0, "speaker": "白垩", "ja": "いつも助けていただいているんです", "zh": "一直都在帮助我们"}, {"time": 534.0, "speaker": "白垩", "ja": "ひどい人たちではないと思います", "zh": "我觉得他们不是坏人"}, {"time": 536.0, "speaker": "车尔尼", "ja": "甘いな、君は", "zh": "你太天真了"}, {"time": 538.0, "speaker": "车尔尼", "ja": "受け入れ費用を安くした上で", "zh": "如果他们打算压低收治费用"}, {"time": 541.0, "speaker": "车尔尼", "ja": "利益を上げようと思うのであれば", "zh": "同时还要从中获利"}, {"time": 544.0, "speaker": "车尔尼", "ja": "おじいさんに何をされるか分かったものじゃないぞ", "zh": "谁知道他们会对你爷爷做什么"}, {"time": 548.0, "speaker": "白垩", "ja": "ありがとうございます", "zh": "谢谢您"}, {"time": 549.0, "speaker": "车尔尼", "ja": "なんだ、急に", "zh": "怎么突然谢我？"}, {"time": 551.0, "speaker": "白垩", "ja": "僕たちが騙されないか心配だから", "zh": "您是担心我们被骗"}, {"time": 554.0, "speaker": "白垩", "ja": "わざわざそう言ってくれているのでしょう", "zh": "才特意这么说的吧"}, {"time": 556.0, "speaker": "白垩", "ja": "分かってますよ", "zh": "我明白的"}, {"time": 558.0, "speaker": "白垩", "ja": "でも", "zh": "不过"}, {"time": 559.0, "speaker": "白垩", "ja": "大丈夫ですから", "zh": "没关系的"}, {"time": 561.0, "speaker": "安丹特", "ja": "えーっと", "zh": "那个……"}, {"time": 563.0, "speaker": "安丹特", "ja": "このタイミングで大変申し上げにくいんだけど", "zh": "在这个时候说有些难以启齿"}, {"time": 567.0, "speaker": "安丹特", "ja": "現状、事務所には空いてるベッドがないよ", "zh": "但目前事务所里没有空床位"}, {"time": 571.0, "speaker": "芙蓉", "ja": "ベッドは私が使用する予定だった来客用のものを使ってもらいましょう", "zh": "可以让他使用原本预定给我用的访客床位"}, {"time": 576.0, "speaker": "芙蓉", "ja": "事務所にいてもらえれば、病状の観察もできますし", "zh": "让他待在事务所的话，也方便观察病情"}, {"time": 580.0, "speaker": "芙蓉", "ja": "調査にも役立ちますよ", "zh": "也能对调查有所帮助"}, {"time": 585.0, "speaker": "芙蓉", "ja": "じゃあ、クライデさん、後でおじいさんを連れてきてもらえるかな", "zh": "那么，白垩先生，之后能把你爷爷带过来吗？"}, {"time": 589.0, "speaker": "芙蓉", "ja": "私たちがしっかりおじいさんを見ているので、安心して練習してきてください", "zh": "我们会好好照看你爷爷的，你就安心去练习吧"}, {"time": 595.0, "speaker": "白垩", "ja": "ありがとうございます", "zh": "谢谢你们"}, {"time": 597.0, "speaker": "车尔尼", "ja": "話は済みましたか？", "zh": "事情谈完了吗？"}, {"time": 599.0, "speaker": "车尔尼", "ja": "私もそろそろ帰りたいのですが", "zh": "我也差不多想回去了"}, {"time": 601.0, "speaker": "芙蓉", "ja": "ああ、お待たせして大変申し訳ございません", "zh": "啊，非常抱歉让您久等了"}, {"time": 605.0, "speaker": "芙蓉", "ja": "最近の病状の変化について教えていただきたいのですが", "zh": "我想请您告诉我最近病情变化的情况"}, {"time": 610.0, "speaker": "芙蓉", "ja": "いつがご都合よろしいでしょうか", "zh": "您什么时候方便呢？"}, {"time": 613.0, "speaker": "车尔尼", "ja": "なぜそんなことを？", "zh": "为什么要问这个？"}, {"time": 615.0, "speaker": "芙蓉", "ja": "近頃アフターグロー区で、オリパシーの症状が急に好転する感染者が多数見られていて", "zh": "最近夕照区出现了许多矿石病症状突然好转的感染者"}, {"time": 621.0, "speaker": "芙蓉", "ja": "私はその現象を調査するために来たんです", "zh": "我是为了调查这一现象才来到这里的"}, {"time": 625.0, "speaker": "芙蓉", "ja": "ツェルニーさんは著名な方ですし、全体的な状況を把握されているのではないかと思ったんです", "zh": "车尔尼先生是知名人士，我想您或许了解整体情况"}, {"time": 632.0, "speaker": "车尔尼", "ja": "申し訳ありませんが、私自身はずっと調子がよく、他の方々の病状に関しては分かりません", "zh": "抱歉，我自己身体状况一直很好，至于其他人的病情，我并不了解"}, {"time": 640.0, "speaker": "芙蓉", "ja": "ですが、フェアウェルコンサートを開催なさるご予定ですよね。一般的に考えれば……", "zh": "可是，您不是计划举办告别音乐会吗？一般来说……"}, {"time": 647.0, "speaker": "车尔尼", "ja": "申し訳ありませんが、片付けがありますので、今はお引き取りいただいてもよろしいですか？", "zh": "抱歉，我还要收拾东西，现在可以请你们先离开吗？"}, {"time": 654.0, "speaker": "芙蓉", "ja": "分かりました。では、後ほどご自宅に伺ってもよいでしょうか？", "zh": "我明白了。那么稍后我可以去您家拜访吗？"}, {"time": 659.0, "speaker": "车尔尼", "ja": "いえ、本日は作曲をする予定ですので", "zh": "不，今天我预定要作曲"}, {"time": 663.0, "speaker": "安丹特", "ja": "ツェルニーさん、ウルズラさんからよく相談されていますよ", "zh": "车尔尼先生，乌尔苏拉女士经常来找我们商量呢"}, {"time": 668.0, "speaker": "安丹特", "ja": "旦那様は放っておくと寝食を忘れて、ずーっと部屋にこもっていて心配だって", "zh": "她说您一没人管就会废寝忘食，一直把自己关在房间里，所以很担心"}, {"time": 675.0, "speaker": "安丹特", "ja": "ハイビスカスが大目に行っている姿を見せた方が、ウルズラさんも安心するんじゃないですか？", "zh": "让乌尔苏拉女士看到芙蓉有去照看您，她也会更安心吧？"}, {"time": 682.0, "speaker": "车尔尼", "ja": "分かりました", "zh": "我明白了"}, {"time": 683.0, "speaker": "芙蓉", "ja": "ご協力ありがとうございます", "zh": "感谢您的配合"}]}, {"title": "Sehnsucht", "audio": "mp3/Track05 Sehnsucht.mp3", "entries": [{"time": 2.0, "speaker": "乌尔苏拉", "ja": "はいはい、どちら様ですか？", "zh": "来了来了，请问是哪位？"}, {"time": 5.0, "speaker": "车尔尼", "ja": "ウルズラさん、戻りました", "zh": "乌尔苏拉女士，我回来了"}, {"time": 7.0, "speaker": "乌尔苏拉", "ja": "お帰りなさい、旦那様。今開けますからね", "zh": "欢迎回来，老爷。我这就给您开门"}, {"time": 12.0, "speaker": "芙蓉", "ja": "こんにちは。お邪魔します", "zh": "您好。打扰了"}, {"time": 14.0, "speaker": "芙蓉", "ja": "アンダンテの同僚のハイビスカスと申します", "zh": "我是安丹特的同事，芙蓉"}, {"time": 17.0, "speaker": "乌尔苏拉", "ja": "おやまあ、どうしてサルカズ？", "zh": "哎呀，怎么会有个萨卡兹？"}, {"time": 20.0, "speaker": "乌尔苏拉", "ja": "おっと、いけない", "zh": "哎呀，不该这么说"}, {"time": 21.0, "speaker": "乌尔苏拉", "ja": "すまないねぇ", "zh": "真是对不住啊"}, {"time": 23.0, "speaker": "乌尔苏拉", "ja": "つい口から出ちまったんだ", "zh": "我就是一时嘴快说出来了"}, {"time": 25.0, "speaker": "乌尔苏拉", "ja": "悪気はないから、気にしないでおくれ", "zh": "我没有恶意，你别放在心上"}, {"time": 28.0, "speaker": "芙蓉", "ja": "大丈夫ですよ。もう慣れていますから", "zh": "没关系的。我已经习惯了"}, {"time": 31.0, "speaker": "乌尔苏拉", "ja": "とにかく謝らせておくれ。申し訳ないねぇ", "zh": "总之还是让我道个歉吧，真对不起啊"}, {"time": 35.0, "speaker": "乌尔苏拉", "ja": "アンダンテの同僚ということは、お医者様かい？", "zh": "你是安丹特的同事，也就是说，是医生吗？"}, {"time": 39.0, "speaker": "芙蓉", "ja": "はい。本日はアンダンテに別任務があり", "zh": "是的。今天安丹特另有任务"}, {"time": 42.0, "speaker": "芙蓉", "ja": "代わりに私が診察に来ました", "zh": "所以由我代她前来诊察"}, {"time": 46.0, "speaker": "芙蓉", "ja": "えっと……", "zh": "那个……"}, {"time": 47.0, "speaker": "车尔尼", "ja": "ウルズラさんです", "zh": "这位是乌尔苏拉女士"}, {"time": 49.0, "speaker": "车尔尼", "ja": "遠い親戚で、ずっと私の世話をしてくださっています", "zh": "她是我的远亲，一直在照顾我"}, {"time": 53.0, "speaker": "芙蓉", "ja": "改めまして、お邪魔します、ウルズラさん", "zh": "再次问候，打扰您了，乌尔苏拉女士"}, {"time": 57.0, "speaker": "乌尔苏拉", "ja": "いやいや、わざわざありがとうね", "zh": "哪里哪里，还特意跑一趟，谢谢你啊"}, {"time": 60.0, "speaker": "芙蓉", "ja": "では、早速伺いたいのですが、最近ツェルニーさんの病状に変化はありませんでしたか？", "zh": "那么，我想尽快问一下，车尔尼先生最近的病情有没有什么变化？"}, {"time": 67.0, "speaker": "乌尔苏拉", "ja": "実は、旦那様はここ数日……", "zh": "其实，老爷这几天……"}, {"time": 71.0, "speaker": "车尔尼", "ja": "コンッ", "zh": "咳"}, {"time": 72.0, "speaker": "乌尔苏拉", "ja": "旦那様、この人はお医者様なんだよ？", "zh": "老爷，这位可是医生啊"}, {"time": 76.0, "speaker": "乌尔苏拉", "ja": "あんたの体を気にかけてくれてるなんて、ありがたいことじゃないか？", "zh": "人家关心你的身体，这不是很值得感谢的事吗？"}, {"time": 81.0, "speaker": "乌尔苏拉", "ja": "薬だっていつももらってるってのに……", "zh": "你平时不也一直拿人家的药吗……"}, {"time": 83.0, "speaker": "车尔尼", "ja": "別に招いたわけではありません", "zh": "我又不是特意邀请她来的"}, {"time": 86.0, "speaker": "乌尔苏拉", "ja": "何言ってんだい！おかしな話だよ！旦那様が連れてきたってのに", "zh": "你说什么呢！这话可太奇怪了！明明是老爷您自己把她带回来的"}, {"time": 91.0, "speaker": "车尔尼", "ja": "ふう……", "zh": "唉……"}, {"time": 93.0, "speaker": "乌尔苏拉", "ja": "去年から旦那様の体調はあまり良くなくてねぇ", "zh": "从去年开始，老爷的身体状况就不太好了"}, {"time": 97.0, "speaker": "乌尔苏拉", "ja": "春先までずっとこんな調子だったよ", "zh": "直到早春都一直是这种状态"}, {"time": 100.0, "speaker": "乌尔苏拉", "ja": "でなきゃ、あんなコンサートやろうとは思わないさ", "zh": "不然的话，他也不会想着要办那样一场音乐会"}, {"time": 103.0, "speaker": "乌尔苏拉", "ja": "だけど、昨日から急に調子が良くなったみたいで……", "zh": "不过，从昨天开始，他好像突然好转了……"}, {"time": 107.0, "speaker": "车尔尼", "ja": "ウルズラさん", "zh": "乌尔苏拉女士"}, {"time": 108.0, "speaker": "乌尔苏拉", "ja": "はいはい！もう何も言わないよ", "zh": "好好好！我不说了"}, {"time": 111.0, "speaker": "乌尔苏拉", "ja": "ごめんね、お嬢ちゃん", "zh": "抱歉啊，小姑娘"}, {"time": 114.0, "speaker": "车尔尼", "ja": "私は作曲するので部屋に戻ります", "zh": "我要回房间作曲了"}, {"time": 118.0, "speaker": "车尔尼", "ja": "お二人は気が済むまで、どうぞゆっくりお話をしてください", "zh": "你们两位就尽管慢慢聊，聊到满意为止吧"}, {"time": 121.0, "speaker": "车尔尼", "ja": "ただし、くれぐれも余計なことは言わないようにお願いします", "zh": "不过，请务必不要说多余的话"}, {"time": 127.0, "speaker": "乌尔苏拉", "ja": "はいはい", "zh": "好好好"}, {"time": 129.0, "speaker": "乌尔苏拉", "ja": "ご飯は食べたかい？まだ？", "zh": "你吃过饭了吗？还没？"}, {"time": 137.0, "speaker": "车尔尼", "ja": "ふん、まったく。ただでさえ旋律が浮かばないというのに", "zh": "哼，真是的。明明我本来就已经想不出旋律了"}, {"time": 144.0, "speaker": "车尔尼", "ja": "アフターグロー区も、何もかも超える音楽を作らねば", "zh": "我必须创作出超越夕照区、超越一切的音乐"}, {"time": 150.0, "speaker": "车尔尼", "ja": "もっと、多くの人の心を揺さぶる音楽", "zh": "创作出更能震撼更多人心灵的音乐"}, {"time": 158.0, "speaker": "去世的恋人", "ja": "ツェルニー、私は太陽が沈むまで、夜明けから夕べまで", "zh": "车尔尼，我会一直走下去，直到太阳沉落，从黎明走到黄昏"}, {"time": 167.0, "speaker": "去世的恋人", "ja": "ずっと歩き続けるんだ", "zh": "我会不停地走下去"}, {"time": 171.0, "speaker": "去世的恋人", "ja": "だって、もう分かってるから", "zh": "因为我已经明白了"}, {"time": 175.0, "speaker": "去世的恋人", "ja": "私も、私の音楽も", "zh": "我也好，我的音乐也好"}, {"time": 180.0, "speaker": "去世的恋人", "ja": "この小さなアフターグロー区の外に出られないんだって", "zh": "都无法离开这小小的夕照区"}, {"time": 187.0, "speaker": "去世的恋人", "ja": "約束して。あなたは私みたいにはならないって", "zh": "答应我。你不会变成像我这样"}, {"time": 197.0, "speaker": "去世的恋人", "ja": "このことで私に負けたりしないって、ね", "zh": "也不会在这件事上输给我"}, {"time": 205.0, "speaker": "车尔尼", "ja": "書かねば", "zh": "我必须写出来"}, {"time": 207.0, "speaker": "车尔尼", "ja": "私の音楽を", "zh": "写出我的音乐"}, {"time": 212.0, "speaker": "车尔尼", "ja": "私はフェアウェルコンサートを開き", "zh": "我想举办一场告别音乐会"}, {"time": 216.0, "speaker": "车尔尼", "ja": "引退をしたいと考えています", "zh": "然后就此引退"}, {"time": 219.0, "speaker": "乌尔苏拉", "ja": "珍しく弱気ですよね", "zh": "这可不像你，难得这么消沉呢"}, {"time": 223.0, "speaker": "乌尔苏拉", "ja": "あなたの音楽をまだ届けられていない場所があるわ", "zh": "还有许多地方没有听到过你的音乐"}, {"time": 228.0, "speaker": "乌尔苏拉", "ja": "諦めるというの？", "zh": "你要就这样放弃吗？"}, {"time": 229.0, "speaker": "车尔尼", "ja": "仰っても無駄です", "zh": "您再怎么说也没用"}, {"time": 233.0, "speaker": "车尔尼", "ja": "私は長くないのです", "zh": "我已经时日无多了"}, {"time": 239.0, "speaker": "车尔尼", "ja": "ですが、私の音楽は命が尽きた後も残したい", "zh": "但是，我希望我的音乐能在我生命结束后继续留下"}, {"time": 245.0, "speaker": "车尔尼", "ja": "せめてこのアフターグロー区の方々にだけでも", "zh": "至少，我想让夕照区的人们"}, {"time": 249.0, "speaker": "车尔尼", "ja": "最後に私の全霊の音を直接届けたいのです", "zh": "在最后亲耳听见我倾尽全力的声音"}, {"time": 255.0, "speaker": "车尔尼", "ja": "どうかサポートをお願いできますか？", "zh": "能否请您协助我？"}, {"time": 260.0, "speaker": "乌尔苏拉", "ja": "分かったわ", "zh": "我明白了"}, {"time": 263.0, "speaker": "车尔尼", "ja": "届けなければ", "zh": "必须传达出去"}]}, {"title": "Verklingend", "audio": "mp3/Track06 Verklingend.mp3", "entries": [{"time": 1.0, "speaker": "车尔尼", "ja": "予想以上に素晴らしい音響機材ですね", "zh": "这些音响设备比预想中还要出色呢"}, {"time": 6.0, "speaker": "工作人员", "ja": "ゲルトルーデ様にご満足いただけるものをと", "zh": "这是为了让格特鲁德大人满意而准备的"}, {"time": 10.0, "speaker": "工作人员", "ja": "これでチェックは全て完了しました", "zh": "这样检查就全部完成了"}, {"time": 12.0, "speaker": "车尔尼", "ja": "まだ休憩室は見ていませんが", "zh": "不过休息室还没有检查"}, {"time": 15.0, "speaker": "工作人员", "ja": "ああ、いいえ、休憩室は……", "zh": "啊，不，休息室就……"}, {"time": 16.0, "speaker": "车尔尼", "ja": "何か不都合でも？", "zh": "有什么不方便的吗？"}, {"time": 18.0, "speaker": "格特鲁德", "ja": "中に私がいるというだけですわ", "zh": "只是因为我在里面而已"}, {"time": 22.0, "speaker": "车尔尼", "ja": "いらしていたのね", "zh": "原来您来了啊"}, {"time": 23.0, "speaker": "车尔尼", "ja": "機材の確認は少々……", "zh": "设备的确认还需要一点……"}, {"time": 26.0, "speaker": "格特鲁德", "ja": "一体ここで何を？", "zh": "您到底来这里做什么？"}, {"time": 28.0, "speaker": "格特鲁德", "ja": "他ならぬあなたのフェアウェルコンサートですもの。私自ら会場のチェックをしに来ましたのよ", "zh": "这可是你的告别音乐会啊。我亲自来检查会场，有什么奇怪的？"}, {"time": 37.0, "speaker": "格特鲁德", "ja": "なにせ、あなたとあなたの部下のパフォーマンスが、私の評判に深く関わるんですもの", "zh": "毕竟，你和你部下们的表现，可是会深深影响我的名声"}, {"time": 44.0, "speaker": "车尔尼", "ja": "何度も言ったはずです。彼らは自らの意思でコンサートに参加する演奏者であって", "zh": "我应该已经说过很多次了。他们是凭自己的意愿参加音乐会的演奏者"}, {"time": 51.0, "speaker": "车尔尼", "ja": "私の部下ではありません", "zh": "不是我的部下"}, {"time": 53.0, "speaker": "格特鲁德", "ja": "招待客からすれば、どちらも一緒ですわ", "zh": "在受邀宾客看来，两者没有区别"}, {"time": 58.0, "speaker": "车尔尼", "ja": "好きにしてください", "zh": "随您怎么说吧"}, {"time": 60.0, "speaker": "格特鲁德", "ja": "あら、休憩室の中は見ていかれないの？", "zh": "哎呀，你不进去看看休息室吗？"}, {"time": 64.0, "speaker": "车尔尼", "ja": "必要ありません。お構いなく", "zh": "不必了。您请自便"}, {"time": 67.0, "speaker": "格特鲁德", "ja": "そう", "zh": "这样啊"}, {"time": 72.0, "speaker": "芙蓉", "ja": "アンダンテさん、お待たせしました。こちら終わりました", "zh": "安丹特小姐，让您久等了。我这边结束了"}, {"time": 77.0, "speaker": "安丹特", "ja": "うーん、お疲れさま。こっちも終わってるよ", "zh": "嗯，辛苦了。我这边也结束了"}, {"time": 81.0, "speaker": "芙蓉", "ja": "何か新しい発見はありましたか？", "zh": "有什么新的发现吗？"}, {"time": 84.0, "speaker": "安丹特", "ja": "内容としては、急に病状が回復した人がいたくらいなんだけど", "zh": "内容上来说，就是有人病情突然好转了"}, {"time": 91.0, "speaker": "安丹特", "ja": "でも今日はやたら多かった気がするんだよ。前は二十人に一人くらいだったのに", "zh": "不过今天感觉特别多。之前大概二十个人里才有一个"}, {"time": 98.0, "speaker": "安丹特", "ja": "今日は五人に一人は好転してたね", "zh": "今天却差不多五个人里就有一个好转"}, {"time": 100.0, "speaker": "芙蓉", "ja": "そんなに？", "zh": "这么多？"}, {"time": 102.0, "speaker": "芙蓉", "ja": "異常回復した方々に、何か共通点はありますか？", "zh": "这些异常恢复的人，有什么共同点吗？"}, {"time": 106.0, "speaker": "安丹特", "ja": "うん、それが……", "zh": "嗯，这个嘛……"}, {"time": 110.0, "speaker": "安丹特", "ja": "昨日アフターグローホールに行った人たちばかりだったんだよね", "zh": "他们全都是昨天去过夕照音乐厅的人"}, {"time": 115.0, "speaker": "芙蓉", "ja": "まさか……", "zh": "难道……"}, {"time": 117.0, "speaker": "芙蓉", "ja": "アンダンテさん、私の方のリストも見ていただけますか？", "zh": "安丹特小姐，也能看看我这边的名单吗？"}, {"time": 121.0, "speaker": "芙蓉", "ja": "赤いチェックが付いているのが、好転していた方です", "zh": "打了红色勾的人，就是病情好转的人"}, {"time": 125.0, "speaker": "安丹特", "ja": "どれどれ？", "zh": "我看看？"}, {"time": 127.0, "speaker": "安丹特", "ja": "スヴェンソンに、ベルノーソンに……", "zh": "斯文森，还有贝尔诺森……"}, {"time": 132.0, "speaker": "安丹特", "ja": "これ、やっぱりそうだよ！", "zh": "这果然没错！"}, {"time": 135.0, "speaker": "芙蓉", "ja": "アンダンテさん、もしかして……", "zh": "安丹特小姐，难道……"}, {"time": 138.0, "speaker": "安丹特", "ja": "うん。選考会で顔を見かけた人たちばっかり", "zh": "嗯。全都是在选拔会上见过的人"}, {"time": 143.0, "speaker": "安丹特", "ja": "ほんのちょっとしかいなかった人にも反応が出てる", "zh": "连只待了一小会儿的人也出现了反应"}, {"time": 148.0, "speaker": "安丹特", "ja": "このランデルさん、覚えてる？仕事の休みに寄ったって、私たちの後ろにたてた人", "zh": "这个兰德尔先生，你还记得吗？他说是工作休息时顺路过来，站在我们后面的那个人"}, {"time": 155.0, "speaker": "安丹特", "ja": "ほら、ちょうどクライデさんの演奏前に来て、終わったら帰ってたじゃん？", "zh": "你看，他正好是在白垩先生演奏前来的，演奏结束后就离开了吧？"}, {"time": 167.0, "speaker": "芙蓉", "ja": "そんな……もしかして、あの二人の演奏に何か関連があるのでしょうか", "zh": "怎么会……难道说，和那两个人的演奏有什么关系吗？"}, {"time": 171.0, "speaker": "篠田先生", "ja": "おい！そこの女！魔族野郎！", "zh": "喂！那边的女人！魔族混账！"}, {"time": 174.0, "speaker": "篠田先生", "ja": "親父の血を勝手に抜きやがっただろ！", "zh": "你擅自抽了我爸的血吧！"}, {"time": 176.0, "speaker": "安丹特", "ja": "行こう、ハイビス", "zh": "走吧，芙蓉"}, {"time": 178.0, "speaker": "篠田先生", "ja": "アンダンテ？", "zh": "安丹特？"}, {"time": 180.0, "speaker": "篠田先生", "ja": "ロドスのアンダンテだな！", "zh": "你就是罗德岛的安丹特吧！"}, {"time": 182.0, "speaker": "篠田先生", "ja": "さっさとお前らの上司に伝えろ！", "zh": "快去告诉你们的上司！"}, {"time": 185.0, "speaker": "篠田先生", "ja": "この魔族を送り返して", "zh": "把这个魔族送回去"}, {"time": 187.0, "speaker": "篠田先生", "ja": "二度とアフターグロー区に近づけさせるんじゃねぇ！", "zh": "不许再让她靠近夕照区！"}, {"time": 190.0, "speaker": "安丹特", "ja": "落ち着いてください、シノダさん", "zh": "请冷静，篠田先生"}, {"time": 192.0, "speaker": "篠田先生", "ja": "みんな聞いてくれよ！", "zh": "大家都听我说！"}, {"time": 195.0, "speaker": "篠田先生", "ja": "魔族野郎が親父の血を抜いたんだ！", "zh": "这个魔族混账抽了我爸的血！"}, {"time": 198.0, "speaker": "篠田先生", "ja": "お前は何をしてるんだ？", "zh": "你在做什么？"}, {"time": 199.0, "speaker": "篠田先生", "ja": "これは何を意味するか分かるか！", "zh": "你知道这意味着什么吗！"}, {"time": 203.0, "speaker": "路人甲", "ja": "それは……", "zh": "这个……"}, {"time": 205.0, "speaker": "路人甲", "ja": "具体的にはよく知らないが", "zh": "具体我也不太清楚"}, {"time": 207.0, "speaker": "路人甲", "ja": "感染者の血を使うアーツを行使する術師がいるってのは", "zh": "但我听说有些术师会使用感染者的血来施展法术"}, {"time": 211.0, "speaker": "路人甲", "ja": "聞いたことがあるな", "zh": "这种事我是听说过的"}, {"time": 213.0, "speaker": "路人乙", "ja": "感染者の血を集めてアーツを？", "zh": "收集感染者的血来施展法术？"}, {"time": 217.0, "speaker": "路人乙", "ja": "私の知る限り", "zh": "据我所知"}, {"time": 218.0, "speaker": "路人乙", "ja": "いわゆる巫王派の残党以外には今……", "zh": "除了所谓巫王派的残党以外，现在……"}, {"time": 222.0, "speaker": "路人丙", "ja": "あ、あんた！", "zh": "你、你！"}, {"time": 224.0, "speaker": "路人丙", "ja": "敬称もつけずに、かの陛下の名お口にするなんで", "zh": "连敬语都不用，直呼那个陛下的名字"}, {"time": 229.0, "speaker": "路人丙", "ja": "怖くないのか？", "zh": "你不害怕吗？"}, {"time": 231.0, "speaker": "篠田先生", "ja": "お前、予言を忘れたのか？", "zh": "你忘了那个预言吗？"}, {"time": 234.0, "speaker": "篠田先生", "ja": "この魔族はきっと感染者の血でアーツを使って、悪さをする気だ！", "zh": "这个魔族一定是想用感染者的血施展法术，做坏事！"}, {"time": 240.0, "speaker": "路人丙", "ja": "魔族？あの陛下の予言にあったのは、こいつらのことなのか？", "zh": "魔族？陛下的预言里说的，就是这种家伙吗？"}, {"time": 245.0, "speaker": "篠田先生", "ja": "ああ、きっとそうだ！あの予言は絶対に実現させちゃいけない！", "zh": "对，一定是这样！绝不能让那个预言实现！"}, {"time": 250.0, "speaker": "路人丁", "ja": "予言って何のことでしょう？知ってますか？", "zh": "他们说的预言是什么？你知道吗？"}, {"time": 255.0, "speaker": "路人戊", "ja": "最近広まってるやつだと思う", "zh": "应该是最近流传开的那个吧"}, {"time": 258.0, "speaker": "路人戊", "ja": "オカルト雑誌か何かのだと思ってた", "zh": "我还以为是神秘学杂志之类编出来的东西"}, {"time": 263.0, "speaker": "路人己", "ja": "どんどん人が集まってきてる", "zh": "人越来越多了"}, {"time": 265.0, "speaker": "篠田先生", "ja": "アフターグロー区から出ていけ！", "zh": "滚出夕照区！"}, {"time": 267.0, "speaker": "芙蓉", "ja": "そんな根拠のないデマを信じないでください", "zh": "请不要相信这种毫无根据的谣言"}, {"time": 271.0, "speaker": "篠田先生", "ja": "デマだと！予言をデマだなんて！", "zh": "你说谣言！竟敢说预言是谣言！"}, {"time": 274.0, "speaker": "篠田先生", "ja": "あんた……やっぱり何か企んでるぞ", "zh": "你……果然在打什么主意吧"}, {"time": 278.0, "speaker": "篠田先生", "ja": "こいつは俺たちの街にいさせちゃいけない！", "zh": "不能让这家伙待在我们的街上！"}, {"time": 280.0, "speaker": "篠田先生", "ja": "そうだろ、みんな！", "zh": "大家说对不对！"}, {"time": 281.0, "speaker": "群众", "ja": "そうだ！", "zh": "没错！"}, {"time": 284.0, "speaker": "群众", "ja": "そうだ！", "zh": "没错！"}, {"time": 285.0, "speaker": "篠田先生", "ja": "みんな俺に続け！", "zh": "大家跟我来！"}, {"time": 287.0, "speaker": "篠田先生", "ja": "この魔族を追い出そう！", "zh": "把这个魔族赶出去！"}]}, {"title": "熱情、あるいは悲愴", "audio": "mp3/Track07 熱情、あるいは悲愴.mp3", "entries": [{"time": 0.0, "speaker": "", "ja": "[音楽]", "zh": "[音乐]"}, {"time": 7.0, "speaker": "黑键", "ja": "って……てか……", "zh": "呃……那个……"}, {"time": 9.0, "speaker": "黑键", "ja": "もう一度だ、クライデ", "zh": "再来一遍，白垩"}, {"time": 12.0, "speaker": "白垩", "ja": "エーベンホルツさん、少し休みませんか？", "zh": "黑键先生，要不要稍微休息一下？"}, {"time": 15.0, "speaker": "黑键", "ja": "だめだ。私たちには時間がないんだぞ", "zh": "不行。我们没有时间了"}, {"time": 18.0, "speaker": "黑键", "ja": "だいたい、あの者は何様のつもりだ", "zh": "说到底，那家伙以为自己是谁？"}, {"time": 22.0, "speaker": "黑键", "ja": "ちょっとピアノが弾けて、曲が作れるだけではないか", "zh": "不就是会弹点钢琴、会写点曲子而已吗？"}, {"time": 26.0, "speaker": "白垩", "ja": "落ち着いてください", "zh": "请冷静一点"}, {"time": 27.0, "speaker": "黑键", "ja": "落ち着け？落ち着く必要などない", "zh": "冷静？我根本没有必要冷静"}, {"time": 30.0, "speaker": "黑键", "ja": "あの態度は何なんだ", "zh": "他那是什么态度？"}, {"time": 32.0, "speaker": "黑键", "ja": "称賛を言われ慣れているだと？", "zh": "说我习惯了被人称赞？"}, {"time": 35.0, "speaker": "黑键", "ja": "これまで誰が私を褒めた", "zh": "至今为止，有谁称赞过我？"}, {"time": 37.0, "speaker": "黑键", "ja": "私が誰に褒められたと言うんだ！", "zh": "你倒是说说，我被谁称赞过！"}, {"time": 40.0, "speaker": "白垩", "ja": "さっきのは誤解だと思います", "zh": "我觉得刚才那只是误会"}, {"time": 43.0, "speaker": "白垩", "ja": "ツェルニーさんも、本当はそこまで僕たちの演奏が酷かったとは思ってないかもしれません", "zh": "车尔尼先生也许并不是真的觉得我们的演奏有那么糟"}, {"time": 50.0, "speaker": "黑键", "ja": "当然、君はそこまで酷くないだろうさ", "zh": "当然，你的演奏自然没有那么糟"}, {"time": 53.0, "speaker": "黑键", "ja": "酷かったのは私一人なんだからな", "zh": "糟糕的只有我一个人而已"}, {"time": 56.0, "speaker": "黑键", "ja": "彼が何と言っていたか忘れたのか？", "zh": "你忘了他说了什么吗？"}, {"time": 59.0, "speaker": "黑键", "ja": "「クライデさんは候補に入れてもいいですが", "zh": "“白垩先生可以列入候选"}, {"time": 62.0, "speaker": "黑键", "ja": "あなたは不要です」だぞ", "zh": "但你不需要。”他说的可是这个"}, {"time": 65.0, "speaker": "白垩", "ja": "それは……きっと……何かの間違いですよ", "zh": "那一定……一定是哪里弄错了"}, {"time": 69.0, "speaker": "白垩", "ja": "僕なんて……", "zh": "像我这样的人……"}, {"time": 70.0, "speaker": "黑键", "ja": "いいや、君の演奏は素晴らしかった", "zh": "不，你的演奏很出色"}, {"time": 73.0, "speaker": "黑键", "ja": "だが、私はあいつを見返してやらねば気が済まないんだ", "zh": "但我非得让那家伙刮目相看，否则咽不下这口气"}, {"time": 77.0, "speaker": "黑键", "ja": "こけにされたままでいられるか！", "zh": "我怎么可能就这样任人羞辱！"}, {"time": 79.0, "speaker": "黑键", "ja": "うっ……！", "zh": "呃……！"}, {"time": 80.0, "speaker": "脑内的声音", "ja": "使い魔まがいの魔族め", "zh": "像使魔一样的魔族"}, {"time": 83.0, "speaker": "脑内的声音", "ja": "下賤な平民でさえ", "zh": "就连下贱的平民"}, {"time": 84.0, "speaker": "脑内的声音", "ja": "貴様の低俗な笛の音を忌み嫌うだろうな", "zh": "也会厌恶你那低俗的笛声吧"}, {"time": 88.0, "speaker": "白垩", "ja": "エーベンホルツさん、大丈夫ですか？", "zh": "黑键先生，你没事吧？"}, {"time": 90.0, "speaker": "黑键", "ja": "黙れ！", "zh": "闭嘴！"}, {"time": 93.0, "speaker": "黑键", "ja": "あ、いや、君に言ったわけではない。すまない", "zh": "啊，不，我不是在对你说。抱歉"}, {"time": 98.0, "speaker": "白垩", "ja": "やっぱり疲れているんですよ。少し休みましょう", "zh": "你果然是累了。稍微休息一下吧"}, {"time": 103.0, "speaker": "黑键", "ja": "ああ", "zh": "嗯"}, {"time": 104.0, "speaker": "白垩", "ja": "お水を入れますね", "zh": "我去倒点水"}, {"time": 107.0, "speaker": "黑键", "ja": "すまなかったな", "zh": "抱歉"}, {"time": 109.0, "speaker": "白垩", "ja": "何のことですか？", "zh": "您指什么？"}, {"time": 111.0, "speaker": "黑键", "ja": "おじいさんの件だ", "zh": "你爷爷的事"}, {"time": 113.0, "speaker": "黑键", "ja": "本当なら、そばで看病をしたかっただろうに", "zh": "你本来应该是想陪在他身边照顾他的吧"}, {"time": 117.0, "speaker": "黑键", "ja": "私の都合に君を巻き込んでしまった", "zh": "我却因为自己的缘故把你卷了进来"}, {"time": 119.0, "speaker": "白垩", "ja": "大丈夫ですよ", "zh": "没关系的"}, {"time": 121.0, "speaker": "白垩", "ja": "ロドスの事務所なら、ここよりも環境はずっといいですし", "zh": "罗德岛事务所的环境比这里好多了"}, {"time": 125.0, "speaker": "黑键", "ja": "そう言ってくれても、本来なら帰してやるのが筋だ", "zh": "就算你这么说，按理我也该让你回去"}, {"time": 130.0, "speaker": "黑键", "ja": "おじいさんも、君のことをすごく大事に思っているんだろう", "zh": "你爷爷也一定非常看重你吧"}, {"time": 136.0, "speaker": "黑键", "ja": "私のことも何か言われたのではないか", "zh": "他是不是也说了些什么关于我的事？"}, {"time": 139.0, "speaker": "白垩", "ja": "えっと……正直に言うと、少し心配をされました", "zh": "这个……老实说，他是有点担心"}, {"time": 147.0, "speaker": "白垩", "ja": "エーベンホルツさんが大金をくださったので、何か危ないことをしているのではないかと", "zh": "因为黑键先生给了我一大笔钱，所以他担心我是不是在做什么危险的事"}, {"time": 154.0, "speaker": "白垩", "ja": "でも 受伤？"}, {"time": 435.0, "speaker": "白垩", "ja": "大丈夫です。でも、チェロが……", "zh": "我没事。可是，大提琴……"}, {"time": 441.0, "speaker": "安丹特", "ja": "えどう……エーベンホルツさん、助けてくれてありがとうございます", "zh": "那个……黑键先生，谢谢你出手相助"}, {"time": 451.0, "speaker": "黑键", "ja": "気にするな。発言をして悪かった", "zh": "别在意。刚才说了失礼的话，抱歉"}, {"time": 453.0, "speaker": "黑键", "ja": "正直", "zh": "老实说"}, {"time": 455.0, "speaker": "黑键", "ja": "さっきは危なかったぞ", "zh": "刚才真的很危险"}, {"time": 457.0, "speaker": "黑键", "ja": "普通の保安官は", "zh": "普通的保安官"}, {"time": 459.0, "speaker": "黑键", "ja": "感染者地区へは駆けつけられないからな", "zh": "是不会赶到感染者地区来的"}, {"time": 462.0, "speaker": "黑键", "ja": "気をつけた方がいい", "zh": "你们最好小心一点"}, {"time": 464.0, "speaker": "安丹特", "ja": "エーベンホルツさんは最近", "zh": "黑键先生是最近"}, {"time": 466.0, "speaker": "安丹特", "ja": "ヴィセハイムに来たんですよね", "zh": "才来到维谢海姆的吧？"}, {"time": 468.0, "speaker": "黑键", "ja": "そうだが", "zh": "是这样"}, {"time": 469.0, "speaker": "黑键", "ja": "何か？", "zh": "怎么了？"}, {"time": 470.0, "speaker": "安丹特", "ja": "さっきあの人たちが話してた", "zh": "刚才那些人提到的"}, {"time": 473.0, "speaker": "安丹特", "ja": "「かの陛下」とか", "zh": "“那位陛下”之类的"}, {"time": 475.0, "speaker": "安丹特", "ja": "そういう予言を他の区で", "zh": "那种预言，您在其他城区"}, {"time": 477.0, "speaker": "安丹特", "ja": "聞いたことはありますか？", "zh": "听说过吗？"}, {"time": 480.0, "speaker": "芙蓉", "ja": "そうですね。貴族の方ならクリフィーパティオ区に住んでいらっしゃるはずですし", "zh": "是啊。贵族一般应该都住在克里菲帕提欧区吧"}, {"time": 485.0, "speaker": "黑键", "ja": "あれらと一緒にしないでくれ。それに、予言など聞いたこともない", "zh": "别把我和那些人相提并论。而且，我从没听说过什么预言"}, {"time": 491.0, "speaker": "芙蓉", "ja": "ということは、ヴィセハイムの貴族ではないのですか？", "zh": "也就是说，您不是维谢海姆的贵族吗？"}, {"time": 496.0, "speaker": "黑键", "ja": "貴族の身分をむやみに詮索するのは、あまり褒められた行為ではないな", "zh": "随意打探贵族身份，可不是什么值得称赞的行为"}, {"time": 502.0, "speaker": "芙蓉", "ja": "ツェルニーさんのコンサートに参加するためにわざわざ？あなたも感染者ですか？", "zh": "您是特意为了参加车尔尼先生的音乐会而来的吗？您也是感染者吗？"}, {"time": 509.0, "speaker": "黑键", "ja": "いいや", "zh": "不是"}, {"time": 510.0, "speaker": "黑键", "ja": "私はオリパシーには感染してはいない", "zh": "我并没有感染矿石病"}, {"time": 513.0, "speaker": "芙蓉", "ja": "でも", "zh": "可是"}, {"time": 514.0, "speaker": "芙蓉", "ja": "噂ではコンサートに参加しに来る人は", "zh": "传闻说，来参加音乐会的人"}, {"time": 517.0, "speaker": "芙蓉", "ja": "みんな感染者だと", "zh": "全都是感染者"}, {"time": 519.0, "speaker": "黑键", "ja": "悪いが", "zh": "抱歉"}, {"time": 520.0, "speaker": "黑键", "ja": "話はここまでにしてくれ", "zh": "话就到此为止吧"}, {"time": 522.0, "speaker": "芙蓉", "ja": "お急ぎなんですか？", "zh": "您赶时间吗？"}, {"time": 524.0, "speaker": "黑键", "ja": "クライデと一緒に", "zh": "我正要和白垩一起"}, {"time": 525.0, "speaker": "黑键", "ja": "ツェルニーの家へ向かう途中だったんだ", "zh": "去车尔尼家"}, {"time": 528.0, "speaker": "黑键", "ja": "まさかこんな場面に遭遇するとは思っていなかった", "zh": "没想到会碰上这种场面"}, {"time": 532.0, "speaker": "芙蓉", "ja": "それなんですが", "zh": "关于这件事"}, {"time": 534.0, "speaker": "芙蓉", "ja": "実は先ほど", "zh": "其实刚才"}, {"time": 535.0, "speaker": "芙蓉", "ja": "患者さんたちを調査していて", "zh": "我们在调查患者时"}, {"time": 537.0, "speaker": "芙蓉", "ja": "妙なことを発見したんです", "zh": "发现了一件奇怪的事"}, {"time": 539.0, "speaker": "黑键", "ja": "妙なこと？", "zh": "奇怪的事？"}, {"time": 541.0, "speaker": "芙蓉", "ja": "今回、私がアフターグロー区を訪れたのは", "zh": "这次我来到夕照区"}, {"time": 544.0, "speaker": "芙蓉", "ja": "感染者の病状が急激に好転する異常回復現象を調査するためです", "zh": "是为了调查感染者病情突然好转的异常恢复现象"}, {"time": 551.0, "speaker": "芙蓉", "ja": "そして今日の調査で", "zh": "而今天的调查显示"}, {"time": 553.0, "speaker": "芙蓉", "ja": "昨日の選考会でお二人の演奏を聞いた方", "zh": "昨天在选拔会上听过二位演奏的人"}, {"time": 556.0, "speaker": "芙蓉", "ja": "ほぼ全員が異常回復していることが分かりました", "zh": "几乎全都出现了异常恢复"}, {"time": 560.0, "speaker": "白垩", "ja": "あ、回復したのならいいことなんじゃ……", "zh": "啊，如果恢复了，那不是好事吗……"}, {"time": 564.0, "speaker": "芙蓉", "ja": "いいえ。ロドス本部の見解では、疑似回復である可能性が高いんです", "zh": "不。根据罗德岛本部的判断，这很可能是伪恢复"}, {"time": 571.0, "speaker": "芙蓉", "ja": "通常、体が損傷を受けた後の最良の結果は、元の状態に戻ることです", "zh": "通常来说，身体受损后的最佳结果，是恢复到原本的状态"}, {"time": 578.0, "speaker": "芙蓉", "ja": "しかし、それができない場合、体は損傷していない部分を過剰に働かせることで", "zh": "但是，如果做不到这一点，身体就会让未受损的部分过度运作"}, {"time": 586.0, "speaker": "芙蓉", "ja": "失われた機能を補おうとします", "zh": "试图弥补已经失去的功能"}, {"time": 590.0, "speaker": "芙蓉", "ja": "これは医学用語では、代償作用と呼びます", "zh": "在医学术语中，这被称为代偿作用"}, {"time": 594.0, "speaker": "芙蓉", "ja": "異常回復が代償作用であるとしたら、元気そうに見えても", "zh": "如果异常恢复其实是代偿作用，那么即便表面看起来很有精神"}, {"time": 599.0, "speaker": "芙蓉", "ja": "体の内部ではオリパシーが急速に進行しています", "zh": "体内的矿石病也可能正在急速恶化"}, {"time": 604.0, "speaker": "芙蓉", "ja": "そうなれば、すぐに限界が来ます", "zh": "那样的话，很快就会到达极限"}, {"time": 609.0, "speaker": "白垩", "ja": "そんな……", "zh": "怎么会……"}, {"time": 610.0, "speaker": "芙蓉", "ja": "異常回復現象は危険なんです", "zh": "异常恢复现象是危险的"}, {"time": 613.0, "speaker": "黑键", "ja": "どういう意味だ", "zh": "什么意思？"}, {"time": 615.0, "speaker": "黑键", "ja": "それが私たちの演奏と何の関係がある", "zh": "那和我们的演奏有什么关系？"}, {"time": 618.0, "speaker": "芙蓉", "ja": "分かりません", "zh": "我还不清楚"}, {"time": 620.0, "speaker": "芙蓉", "ja": "ですが、偶然では済まない一致です", "zh": "但这不是能够用偶然解释的巧合"}, {"time": 623.0, "speaker": "芙蓉", "ja": "お二人の演奏には、きっとあの現象を引き起こす原因があります", "zh": "二位的演奏中，一定存在引发那种现象的原因"}, {"time": 629.0, "speaker": "芙蓉", "ja": "どうか、コンサートへの参加は思いとどまってください", "zh": "所以，请你们务必重新考虑，不要参加音乐会"}, {"time": 633.0, "speaker": "黑键", "ja": "残念ながら、できない相談だ", "zh": "很遗憾，这件事我不能答应"}, {"time": 636.0, "speaker": "白垩", "ja": "ですが、エーベンホルツさん、もしこれが本当なのだとしたら……", "zh": "可是，黑键先生，如果这是真的……"}, {"time": 640.0, "speaker": "黑键", "ja": "ありえない。ただの音楽だぞ", "zh": "不可能。那只是音乐而已"}, {"time": 643.0, "speaker": "黑键", "ja": "それに、なぜよりによって私たちだけなんだ。馬鹿馬鹿しい", "zh": "而且为什么偏偏只有我们？荒谬"}, {"time": 648.0, "speaker": "白垩", "ja": "エーベンホルツさん、でも……", "zh": "黑键先生，可是……"}, {"time": 650.0, "speaker": "黑键", "ja": "今は何より時間が惜しい", "zh": "现在最宝贵的是时间"}, {"time": 653.0, "speaker": "黑键", "ja": "遅刻したら", "zh": "要是迟到了"}, {"time": 654.0, "speaker": "黑键", "ja": "私たちはお手々を繋いで", "zh": "我们就只能手牵着手"}, {"time": 656.0, "speaker": "黑键", "ja": "すごすご帰ることになるんだ", "zh": "灰溜溜地回去了"}, {"time": 658.0, "speaker": "黑键", "ja": "行くぞ", "zh": "走"}, {"time": 660.0, "speaker": "芙蓉", "ja": "うっ……うん……", "zh": "呃……嗯……"}, {"time": 662.0, "speaker": "芙蓉", "ja": "行っちゃった……", "zh": "他们走掉了……"}, {"time": 664.0, "speaker": "安丹特", "ja": "確かに結論を出すには", "zh": "确实，要下结论的话"}, {"time": 666.0, "speaker": "", "ja": "まだまだ参考事例が足りないよね", "zh": "参考案例还远远不够"}, {"time": 670.0, "speaker": "芙蓉", "ja": "ですが……", "zh": "可是……"}, {"time": 671.0, "speaker": "芙蓉", "ja": "どうしても嫌な予感がします", "zh": "我无论如何都有种不好的预感"}, {"time": 674.0, "speaker": "芙蓉", "ja": "調査を続けましょう", "zh": "继续调查吧"}]}, {"title": "魔彈の射手", "audio": "mp3/Track08 魔彈の射手.mp3", "entries": [{"time": 1.0, "speaker": "车尔尼", "ja": "チェロが壊れた？まさか故意に？", "zh": "大提琴坏了？难道是故意的？"}, {"time": 5.0, "speaker": "黑键", "ja": "違う、そうではなく", "zh": "不，不是那个意思"}, {"time": 7.0, "speaker": "车尔尼", "ja": "クライデさん、あなたが話してください", "zh": "白垩先生，还是你来说吧"}, {"time": 13.0, "speaker": "白垩", "ja": "ここに来る途中に", "zh": "我们来这里的路上"}, {"time": 15.0, "speaker": "白垩", "ja": "ハイビスカスさんとアンダンテさんが", "zh": "芙蓉小姐和安丹特小姐"}, {"time": 17.0, "speaker": "白垩", "ja": "大勢の人に囲まれ", "zh": "被一大群人围住了"}, {"time": 20.0, "speaker": "白垩", "ja": "魔族は出ていけとか", "zh": "他们说什么“魔族滚出去”"}, {"time": 22.0, "speaker": "白垩", "ja": "アフターグロー区に", "zh": "还说不要给夕照区"}, {"time": 23.0, "speaker": "白垩", "ja": "災いをもたらすなと言われていました", "zh": "带来灾祸"}, {"time": 27.0, "speaker": "车尔尼", "ja": "なんと救いようのない", "zh": "真是无可救药"}, {"time": 29.0, "speaker": "白垩", "ja": "止めようとしたのですが、その最中に", "zh": "我想阻止他们，可就在那时候"}, {"time": 33.0, "speaker": "白垩", "ja": "チェロを壊されてしまって", "zh": "大提琴被他们弄坏了"}, {"time": 35.0, "speaker": "车尔尼", "ja": "楽器を傷つけるなんて", "zh": "竟然伤害乐器"}, {"time": 38.0, "speaker": "车尔尼", "ja": "連中はどこまで頭のネジが飛んでいるんです", "zh": "那些家伙到底疯到什么程度了？"}, {"time": 44.0, "speaker": "车尔尼", "ja": "で、あなたがその群衆を追い払ったと", "zh": "所以，是你把那群人赶走了？"}, {"time": 48.0, "speaker": "白垩", "ja": "いえ、エーベンホルツさんが追い払ってくれました", "zh": "不，是黑键先生帮忙把他们赶走了"}, {"time": 52.0, "speaker": "车尔尼", "ja": "彼が、あなたを助けた？", "zh": "他救了你？"}, {"time": 59.0, "speaker": "白垩", "ja": "はい", "zh": "是的"}, {"time": 61.0, "speaker": "车尔尼", "ja": "そうですか、そのチェロはもう使えませんね", "zh": "原来是这样，那把大提琴已经不能用了"}, {"time": 65.0, "speaker": "白垩", "ja": "申し訳ありません", "zh": "非常抱歉"}, {"time": 66.0, "speaker": "车尔尼", "ja": "謝る必要はありません", "zh": "你不必道歉"}, {"time": 69.0, "speaker": "车尔尼", "ja": "むしろ私の方こそ、アフターグロー区を代表して", "zh": "倒不如说，我才应该代表夕照区"}, {"time": 73.0, "speaker": "车尔尼", "ja": "愚か者たちの行為について謝罪すべきでしょう", "zh": "为那些愚蠢之人的行为向你道歉"}, {"time": 78.0, "speaker": "车尔尼", "ja": "量産品ですが", "zh": "虽然只是量产品"}, {"time": 80.0, "speaker": "车尔尼", "ja": "今日はひとまずこれを使ってください", "zh": "今天就先用这把吧"}, {"time": 84.0, "speaker": "车尔尼", "ja": "それでは、練習の成果を見せていただきましょうか", "zh": "那么，让我看看你们练习的成果吧"}, {"time": 89.0, "speaker": "车尔尼", "ja": "始めてください", "zh": "请开始"}, {"time": 114.0, "speaker": "黑键", "ja": "ミスター・ツェルニー", "zh": "车尔尼先生"}, {"time": 116.0, "speaker": "黑键", "ja": "どうだった？", "zh": "怎么样？"}, {"time": 117.0, "speaker": "车尔尼", "ja": "向上が見られないわけではない", "zh": "并不是完全没有进步"}, {"time": 123.0, "speaker": "车尔尼", "ja": "それに、あなた方からすれば、一晩しか合わせていない曲です", "zh": "而且对你们来说，这首曲子也只合练了一晚"}, {"time": 130.0, "speaker": "车尔尼", "ja": "私もあまり高い要求をすべきではありません", "zh": "我也不该提出太高的要求"}, {"time": 134.0, "speaker": "车尔尼", "ja": "ですが、昨日指摘した問題は", "zh": "但是，昨天我指出的问题"}, {"time": 138.0, "speaker": "车尔尼", "ja": "何一つとして解決していませんね", "zh": "没有一个得到解决"}, {"time": 141.0, "speaker": "黑键", "ja": "何一つとして解決していない？そんな……", "zh": "没有一个得到解决？怎么会……"}, {"time": 145.0, "speaker": "车尔尼", "ja": "相手の音に反応は良くなっています", "zh": "你们对彼此声音的反应比之前好多了"}, {"time": 149.0, "speaker": "车尔尼", "ja": "ですが、自分のパートでは変わらず", "zh": "但是，你在自己的声部里没有变化"}, {"time": 153.0, "speaker": "车尔尼", "ja": "己を引き立たす弾き方で", "zh": "仍然用一种只突出自己的演奏方式"}, {"time": 157.0, "speaker": "车尔尼", "ja": "結局、クライデさん、あなたは彼に手綱を握られています", "zh": "结果，白垩先生，你是在被他牵着走"}, {"time": 161.0, "speaker": "车尔尼", "ja": "曲を己のものとして弾けないのに", "zh": "明明还不能把曲子化为自己的东西来演奏"}, {"time": 165.0, "speaker": "车尔尼", "ja": "いたずらにひけらかすでいいのですか？未熟ですか？それと、装飾音も音を出せていますが、ブレスが不安定になり、演奏全体を危うくしています", "zh": "只是徒劳地炫耀就可以了吗？是还不够成熟吗？还有，装饰音虽然发出了声音，但呼吸变得不稳定，正在危及整场演奏"}, {"time": 175.0, "speaker": "车尔尼", "ja": "それで意味があるのですか？", "zh": "那样有什么意义？"}, {"time": 178.0, "speaker": "车尔尼", "ja": "クライデさんの方は、これまで通り堅実に弾けていますよ", "zh": "白垩先生这边，依旧能稳健地演奏"}, {"time": 183.0, "speaker": "车尔尼", "ja": "問題は熟練度ですね", "zh": "问题在熟练度"}, {"time": 185.0, "speaker": "车尔尼", "ja": "もう少し練習すれば、さらに良くなるでしょう", "zh": "再多练习一些，应该会更好"}, {"time": 189.0, "speaker": "车尔尼", "ja": "ですが、『有名の夜明け』は二重奏です", "zh": "但是，《有名的黎明》是二重奏"}, {"time": 194.0, "speaker": "车尔尼", "ja": "片方が妥協して、もう一方に合わせていては、演奏は成立しません", "zh": "如果一方妥协去配合另一方，演奏就无法成立"}, {"time": 199.0, r": "车尔尼", "ja": "合格です", "zh": "合格"}, {"time": 313.0, "speaker": "白垩", "ja": "はあ……やった！", "zh": "啊……太好了！"}, {"time": 316.0, "speaker": "黑键", "ja": "ふう……", "zh": "呼……"}, {"time": 318.0, "speaker": "车尔尼", "ja": "理解されていない可能性もあるので断っておきますが", "zh": "为了避免你们误解，我先说明"}, {"time": 322.0, "speaker": "车尔尼", "ja": "この最低ラインとは、今日時点での下限です", "zh": "所谓最低标准，只是截至今天的下限"}, {"time": 327.0, "speaker": "车尔尼", "ja": "この『有名の夜明け』は、私にとって特別な曲です", "zh": "这首《有名的黎明》对我来说是特别的曲子"}, {"time": 334.0, "speaker": "车尔尼", "ja": "エーベンホルツ、今になってよくよく考えてみると", "zh": "黑键，现在仔细想来"}, {"time": 339.0, "speaker": "车尔尼", "ja": "初め、私はこの曲で自己顕示の強い弾き方をされて", "zh": "一开始，听到你用这种强烈自我表现的方式演奏这首曲子"}, {"time": 344.0, "speaker": "车尔尼", "ja": "多少なりとも不快な気持ちがあったのだと思います", "zh": "我多少感到了不快"}, {"time": 348.0, "speaker": "车尔尼", "ja": "しかし、今日", "zh": "但是今天"}, {"time": 351.0, "speaker": "车尔尼", "ja": "あなたの人となりを知ったことで", "zh": "在了解了你这个人之后"}, {"time": 355.0, "speaker": "车尔尼", "ja": "見方が多少変わりました", "zh": "我的看法多少有所改变"}, {"time": 359.0, "speaker": "黑键", "ja": "それは、ありがたくて涙が出るな", "zh": "那可真是令人感动得要落泪了"}, {"time": 362.0, "speaker": "车尔尼", "ja": "言葉にトゲが多いのも、あなたの癖ですか？", "zh": "说话带刺也是你的习惯吗？"}, {"time": 366.0, "speaker": "黑键", "ja": "そうかもしれないな", "zh": "也许吧"}, {"time": 369.0, "speaker": "车尔尼", "ja": "私に言わせれば、音楽家にとって最も重要なのは", "zh": "要我说，对音乐家而言最重要的"}, {"time": 374.0, "speaker": "车尔尼", "ja": "誠実さです", "zh": "是诚实"}, {"time": 376.0, "speaker": "车尔尼", "ja": "言葉のトゲどころか", "zh": "别说言语中的尖刺"}, {"time": 379.0, "speaker": "车尔尼", "ja": "心のすべてを塗りつぶす憎しみですら", "zh": "就连足以涂满整个心灵的憎恨"}, {"time": 382.0, "speaker": "车尔尼", "ja": "適切な技法を用いて表現できるのならば", "zh": "只要能用恰当的技法表现出来"}, {"time": 385.0, "speaker": "车尔尼", "ja": "それには意味があるのです", "zh": "它也会拥有意义"}, {"time": 387.0, "speaker": "车尔尼", "ja": "精進してください", "zh": "请继续精进"}, {"time": 392.0, "speaker": "车尔尼", "ja": "もし公演直前になってもこのレベルであれば、舞台には上がらせません", "zh": "如果到了公演前夕仍然是这个水准，我不会让你们登台"}, {"time": 397.0, "speaker": "车尔尼", "ja": "いいですね", "zh": "明白了吗？"}, {"time": 398.0, "speaker": "白垩", "ja": "分かりました", "zh": "明白了"}, {"time": 401.0, "speaker": "白垩", "ja": "それ ime": 767.0, "speaker": "白垩", "ja": "ハイビスカスさんたちが言っていたのは", "zh": "芙蓉小姐她们说的那些"}, {"time": 770.0, "speaker": "白垩", "ja": "本当なんでしょうか", "zh": "是真的吗？"}, {"time": 772.0, "speaker": "白垩", "ja": "異常回復現象の原因は", "zh": "异常恢复现象的原因"}, {"time": 774.0, "speaker": "白垩", "ja": "僕たちだって", "zh": "是我们"}, {"time": 776.0, "speaker": "黑键", "ja": "なんだ", "zh": "怎么？"}, {"time": 778.0, "speaker": "黑键", "ja": "まだ気にしてたのか", "zh": "你还在介意那件事吗？"}, {"time": 780.0, "speaker": "白垩", "ja": "その……", "zh": "那个……"}, {"time": 781.0, "speaker": "白垩", "ja": "偶然にしては", "zh": "要说是偶然"}, {"time": 783.0, "speaker": "白垩", "ja": "ちょっと出来過ぎている気がして", "zh": "总觉得太巧了"}, {"time": 785.0, "speaker": "白垩", "ja": "でも、エーベンホルツさんもコンサートに参加しないといけない事情があるんですよね", "zh": "但是，黑键先生也有必须参加音乐会的理由吧"}, {"time": 792.0, "speaker": "黑键", "ja": "ああ", "zh": "嗯"}, {"time": 793.0, "speaker": "白垩", "ja": "それなら、僕は気にしないことにします", "zh": "既然如此，我就不去在意了"}, {"time": 798.0, "speaker": "黑键", "ja": "きっとハイビスカスたちの思い違いだろう", "zh": "一定是芙蓉她们弄错了"}, {"time": 803.0, "speaker": "黑键", "ja": "むやみに疑惑を向けられるなど、たまったものではないな", "zh": "被人随随便便怀疑，真是让人受不了"}, {"time": 808.0, "speaker": "黑键", "ja": "よし、楽器も手に入ったし、帰って練習しよう", "zh": "好了，乐器也到手了，回去练习吧"}, {"time": 813.0, "speaker": "白垩", "ja": "いえ、ツェルニーさんのお宅へ向かいましょう", "zh": "不，我们去车尔尼先生家吧"}, {"time": 816.0, "speaker": "白垩", "ja": "あなたが買ってくれたチェロを試奏してみたいです", "zh": "我想试着演奏您给我买的这把大提琴"}, {"time": 820.0, "speaker": "白垩", "ja": "こんなに素晴らしいチェロなんですから", "zh": "这么棒的大提琴"}, {"time": 822.0, "speaker": "白垩", "ja": "分かってくれる聞き手がいなければ", "zh": "如果没有懂它的听众"}, {"time": 825.0, "speaker": "白垩", "ja": "宝の持ち腐れですよ", "zh": "那就是暴殄天物了"}, {"time": 827.0, "speaker": "黑键", "ja": "こんな気分がいい日に", "zh": "在这么心情愉快的日子里"}, {"time": 829.0, "speaker": "黑键", "ja": "わざわざ仏頂面を拝みに行くのか", "zh": "还特意去看那张臭脸吗？"}, {"time": 832.0, "speaker": "黑键", "ja": "どうせまた一聴きして", "zh": "反正他肯定又只听一下"}, {"time": 834.0, "speaker": "黑键", "ja": "私をこき下ろすに違いない", "zh": "就把我贬得一无是处"}, {"time": 836.0, "speaker": "白垩", "ja": "ただの誤解ですよ", "zh": "只是误会而已"}, {"time": 838.0, "speaker": "白垩", "ja": "すぐに解けますって", "zh": "很快就会解开的"}, {"time": 840.0, "speaker": "白垩", "ja": "それに昨日だって", "zh": "而且昨天"}, {"time": 842.0, "speaker": "白垩", "ja": "ツェルニーさんも見方を変えたと言ったじゃないですか", "zh": "车尔尼先生不是也说他改变了看法吗？"}, {"time": 848.0, "speaker": "黑键", "ja": "そうだな", "zh": "也是"}, {"time": 850.0, "speaker": "黑键", "ja": "君が一人で先に行ってくれ", "zh": "你一个人先过去吧"}, {"time": 853.0, "speaker": "黑键", "ja": "私は後で合流する", "zh": "我之后再与你会合"}, {"time": 856.0, "speaker": "白垩", "ja": "あ、そうですか", "zh": "啊，这样啊"}, {"time": 858.0, "speaker": "白垩", "ja": "分かりました", "zh": "我明白了"}, {"time": 860.0, "speaker": "白垩", "ja": "気をつけてくださいね", "zh": "请您小心"}]}, {"title": "驚愕", "audio": "mp3/Track09 驚愕.mp3", "entries": [{"time": 2.0, "speaker": "格特鲁德的侍从", "ja": "工作は成功しました", "zh": "行动成功了"}, {"time": 4.0, "speaker": "格特鲁德的侍从", "ja": "ウルティカ伯爵は大方期待通りに行動しています", "zh": "乌提卡伯爵大体上都按预期在行动"}, {"time": 8.0, "speaker": "格特鲁德的侍从", "ja": "ラハマンの動きを妨げるような動きもありましたが", "zh": "虽然也出现了一些妨碍拉赫曼行动的情况"}, {"time": 12.0, "speaker": "格特鲁德的侍从", "ja": "何も影響はありません", "zh": "但并没有造成任何影响"}, {"time": 14.0, "speaker": "格特鲁德", "ja": "ええ、全く問題ありませんわ", "zh": "嗯，完全没有问题"}, {"time": 17.0, "speaker": "格特鲁德", "ja": "そもそもラハマン一人で", "zh": "本来我也没有期待仅凭拉赫曼一个人"}, {"time": 20.0, "speaker": "格特鲁德", "ja": "ロドスの人間をアフターグロー区から追い出せるなんて", "zh": "就能把罗德岛的人赶出夕照区"}, {"time": 23.0, "speaker": "格特鲁德", "ja": "最初から期待していませんし", "zh": "从一开始我就没有抱这种期待"}, {"time": 26.0, "speaker": "格特鲁德的侍从", "ja": "ツェルニーは、鼻持ちならない評論家連中をコンサートに招くため、人脈をフル活用し", "zh": "车尔尼为了邀请那些令人厌烦的评论家参加音乐会，动用了自己所有的人脉"}, {"time": 33.0, "speaker": "格特鲁德的侍从", "ja": "彼が軽蔑していた貴族の局中に、しぶしぶながら推薦文を書いたという情報も、そう", "zh": "还有情报说，他甚至不情不愿地给自己一向轻蔑的某位贵族写了推荐信"}, {"time": 42.0, "speaker": "格特鲁德", "ja": "彼もここまで来れば、もう後戻りはできませんわね", "zh": "事到如今，他也已经无法回头了"}, {"time": 48.0, "speaker": "格特鲁德", "ja": "他に何もなければ下がりなさい", "zh": "如果没有别的事，就退下吧"}, {"time": 51.0, "speaker": "格特鲁德的侍从", "ja": "はい。失礼いたしました", "zh": "是。属下告退"}, {"time": 54.0, "speaker": "黑键", "ja": "取り込み中か", "zh": "你在忙吗？"}, {"time": 56.0, "speaker": "格特鲁德", "ja": "あら、ウルティカ伯爵？", "zh": "哎呀，乌提卡伯爵？"}, {"time": 60.0, "speaker": "格特鲁德", "ja": "考えなしに私を訪ねるのはおすすめしませんわ", "zh": "我可不建议您不经思考就来找我"}, {"time": 64.0, "speaker": "格特鲁德", "ja": "露見する可能性が……", "zh": "有暴露的可能……"}, {"time": 65.0, "speaker": "黑键", "ja": "今更気にするものでもないだろう", "zh": "事到如今，也没什么好在意的了吧"}, {"time": 68.0, "speaker": "黑键", "ja": "ツェルニーのコンサートに参加する運びになった", "zh": "我已经确定会参加车尔尼的音乐会"}, {"time": 71.0, "speaker": "格特鲁德", "ja": "ええ、存じておりますわ", "zh": "嗯，我已经知道了"}, {"time": 74.0, "speaker": "格特鲁德", "ja": "おめでとうございます", "zh": "恭喜您"}, {"time": 76.0, "speaker": "黑键", "ja": "それで？", "zh": "然后呢？"}, {"time": 78.0, "speaker": "格特鲁德", "ja": "さて、何でしょうか", "zh": "那么，是有什么事呢？"}, {"time": 80.0, "speaker": "黑键", "ja": "とぼけるな！塵界の音を私の頭から取り除くという話はどうなったんだ？", "zh": "别装傻！你说要把尘界之音从我脑中除去，那件事怎么样了？"}, {"time": 87.0, "speaker": "格特鲁德", "ja": "ああ、その件でしたら、このまま進めば、閣下は何もせずとも望む結果を得られるでしょう", "zh": "啊，那件事的话，只要照这样继续下去，阁下无需做什么，也能得到您想要的结果"}, {"time": 96.0, "speaker": "黑键", "ja": "どういう意味だ？", "zh": "什么意思？"}, {"time": 98.0, "speaker": "格特鲁德", "ja": "知り合ったばかりのクライデと、ツェルニーのコンサートで一緒に演奏する", "zh": "和刚认识不久的白垩，一起在车尔尼的音乐会上演奏"}, {"time": 105.0, "speaker": "格特鲁德", "ja": "それだけですわ。簡単でしょ？", "zh": "仅此而已。很简单吧？"}, {"time": 108.0, "speaker": "黑键", "ja": "善意的な解釈をし、冗談として受け取ろう", "zh": "我就姑且往好处想，把这当成一句玩笑吧"}, {"time": 113.0, "speaker": "黑键", "ja": "そうだとしても、この場にはおよそ相応しくないと思うがな", "zh": "但即便如此，我也认为这句话并不适合出现在此时此地"}, {"time": 118.0, "speaker": "黑键", "ja": "ミス・ゲルトルーデ", "zh": "格特鲁德小姐"}, {"time": 120.0, "speaker": "格特鲁德", "ja": "決して冗談なんかではありませんわ", "zh": "这可绝不是玩笑"}, {"time": 123.0, "speaker": "格特鲁德", "ja": "クライデもあなたと同様に、その身に塵界の音を宿しておりますのよ", "zh": "白垩和您一样，体内也寄宿着尘界之音"}, {"time": 129.0, "speaker": "黑键", "ja": "彼が？", "zh": "他？"}, {"time": 131.0, "speaker": "黑键", "ja": "だが、二号の女帝は確実に、私の身に残るこれだけだと言っていた", "zh": "可是，二号女帝明明说过，残留在我身上的只有这个"}, {"time": 136.0, "speaker": "黑键", "ja": "保有者は私一人きりだと", "zh": "也就是说，持有者只有我一个"}, {"time": 139.0, "speaker": "格特鲁德", "ja": "つまり、彼女たちにも知らないことがあるということです", "zh": "也就是说，也有她们不知道的事"}, {"time": 146.0, "speaker": "格特鲁德", "ja": "保有者同士が接近すると共鳴が起こり、強大なエネルギーを生み出しますわ", "zh": "持有者彼此接近时，会发生共鸣，并产生强大的能量"}, {"time": 153.0, "speaker": "格特鲁德", "ja": "特に合奏している間は、エネルギーが大幅に増加いたしますの", "zh": "尤其是在合奏期间，能量会大幅增加"}, {"time": 159.0, "speaker": "格特鲁德", "ja": "このエネルギーを利用し、うまく誘導すれば", "zh": "如果利用这股能量并加以妥善引导"}, {"time": 162.0, "speaker": "格特鲁德", "ja": "あなたの中にある塵界の音を、彼の体に移すことができますわ", "zh": "就可以把您体内的尘界之音转移到他的身体里"}, {"time": 169.0, "speaker": "黑键", "ja": "それで、クライデはどうなる？", "zh": "那白垩会怎么样？"}, {"time": 173.0, "speaker": "格特鲁德", "ja": "クライデとその他の始末は、私が処理をいたしますわ。あなたは死を偽装して身を隠してくださいまし", "zh": "白垩以及其他后续，我会处理。您只需要伪装死亡，然后隐藏起来"}, {"time": 182.0, "speaker": "格特鲁德", "ja": "ほとぼりが冷めれば、晴れて自由な平民になれますわよ", "zh": "等风头过去，您就能堂堂正正地成为自由的平民了"}, {"time": 188.0, "speaker": "黑键", "ja": "しかし……", "zh": "可是……"}, {"time": 189.0, "speaker": "黑键", "ja": "やはり理解できない。なぜツェルニーのコンサートでなくてはならないのだ", "zh": "我还是无法理解。为什么非得是车尔尼的音乐会不可？"}, {"time": 195.0, "speaker": "黑键", "ja": "例えば、クライデの家で彼と演奏するのではいけないのか", "zh": "比如，在白垩家里和他一起演奏不行吗？"}, {"time": 202.0, "speaker": "格特鲁德", "ja": "共鳴の誘導は非常に繊細な技術ですの", "zh": "引导共鸣是一项非常精密的技术"}, {"time": 205.0, "speaker": "格特鲁德", "ja": "アフターグローホールは巫王陛下が残したアーツの要塞", "zh": "夕照音乐厅是巫王陛下留下的法术要塞"}, {"time": 212.0, "speaker": "格特鲁德", "ja": "あの装置の助けを借りなければ、私もあなたの体内に宿る音を取り除くことはできませんわ", "zh": "如果没有那套装置的帮助，就连我也无法除去寄宿在您体内的声音"}, {"time": 220.0, "speaker": "黑键", "ja": "分かた。もう一つ教えろ。君の言っていた塵界の音の共鳴は", "zh": "我知道了。再告诉我一件事。你所说的尘界之音的共鸣"}, {"time": 226.0, "speaker": "黑键", "ja": "他人に影響を与えるのか？", "zh": "会影响其他人吗？"}, {"time": 229.0, "speaker": "格特鲁德", "ja": "共鳴が？", "zh": "共鸣吗？"}, {"time": 231.0, "speaker": "格特鲁德", "ja": "いいえ、故意に用いなければ、何ら影響はございませんわ", "zh": "不，如果不是有意利用，就不会造成任何影响"}, {"time": 236.0, "speaker": "黑键", "ja": "ならば、なぜロドスのオペレーターは", "zh": "那为什么罗德岛的干员会说"}, {"time": 240.0, "speaker": "黑键", "ja": "私とクライデの演奏が疑似回復現象の原因だなどと言うのだ", "zh": "我和白垩的演奏是疑似恢复现象的原因？"}, {"time": 245.0, "speaker": "格特鲁德", "ja": "ロドスがこの現象を疑似回復と言っていましたの？", "zh": "罗德岛把这个现象称为疑似恢复吗？"}, {"time": 252.0, "speaker": "格特鲁德", "ja": "さすがは専門家ですわね", "zh": "不愧是专业人士呢"}, {"time": 254.0, "speaker": "黑键", "ja": "貴殿は、やはり知っていたのか", "zh": "你果然知道"}, {"time": 259.0, "speaker": "格特鲁德", "ja": "怖い顔なさらないで。私が故意で行ったものではありませんわ", "zh": "别露出那么可怕的表情 ものか！", "zh": "你竟敢厚颜无耻地说这种话！别想骗我！"}, {"time": 615.0, "speaker": "黑键", "ja": "アフターグロー区最大の災いは、お前ではないか！", "zh": "夕照区最大的灾祸，不正是你吗！"}, {"time": 618.0, "speaker": "格特鲁德", "ja": "先ほどお伝えしたはずですが", "zh": "我刚才应该已经说过了"}, {"time": 621.0, "speaker": "格特鲁德", "ja": "全ての災いのもとは、クライデの体内にある壊れた音ですわ", "zh": "一切灾祸的根源，都是白垩体内那残破的声音"}, {"time": 628.0, "speaker": "格特鲁德", "ja": "そして共鳴による音漏れは、不可逆なものです", "zh": "而共鸣造成的声音漏出，是不可逆的"}, {"time": 633.0, "speaker": "格特鲁德", "ja": "音は、クライデのそばにいる者だけでなく、本人も蝕みます", "zh": "声音不仅会侵蚀白垩身边的人，也会侵蚀他本人"}, {"time": 640.0, "speaker": "格特鲁德", "ja": "むしろ、彼こそが共鳴の最大の被害者ですわ", "zh": "倒不如说，他才是共鸣最大的受害者"}, {"time": 644.0, "speaker": "黑键", "ja": "どういうことだ", "zh": "什么意思？"}, {"time": 646.0, "speaker": "格特鲁德", "ja": "クライデの体は本来、音に適応しているはずでしたが", "zh": "白垩的身体原本应该能适应那声音"}, {"time": 651.0, "speaker": "格特鲁德", "ja": "ここ最近の急激な漏出によって、すぐにでもバランスを崩すでしょう", "zh": "但最近急剧的漏出，会使他的身体很快失去平衡"}, {"time": 658.0, "speaker": "格特鲁德", "ja": "おそらく、二週間後に一番激しい急性症状に襲われますわよ", "zh": "恐怕两周后，他就会遭遇最严重的急性症状"}, {"time": 664.0, "speaker": "黑键", "ja": "そんな馬鹿な", "zh": "怎么可能"}, {"time": 667.0, "speaker": "格特鲁德", "ja": "彼本人のためにも、アフターグロー区のためにも", "zh": "为了他本人，也为了夕照区"}, {"time": 672.0, "speaker": "格特鲁德", "ja": "演奏した後に死ぬことこそが最良の結末ですわ。これは全員にとっていいことなのです", "zh": "在演奏结束后死去，才是最好的结局。这对所有人来说都是好事"}, {"time": 683.0, "speaker": "格特鲁德", "ja": "私はいつでも使える強力なカードを手に入れ", "zh": "我会得到一张随时可用的强大牌"}, {"time": 687.0, "speaker": "格特鲁德", "ja": "アフターグロー区は平和になり、クライデは安穏を得て", "zh": "夕照区会恢复和平，白垩会得到安宁"}, {"time": 692.0, "speaker": "格特鲁德", "ja": "ミスター・エーベンホルツ、あなたは自由を得るのです", "zh": "而黑键先生，您会得到自由"}, {"time": 700.0, "speaker": "格特鲁德", "ja": "ウルティカ伯爵、リターニアの正統継承者", "zh": "乌提卡伯爵，莱塔尼亚的正统继承者"}, {"time": 707.0, "speaker": "格特鲁德", "ja": "巫王の最後の血統", "zh": "巫王最后的血脉"}, {"time": 711.0, "speaker": "格特鲁德", "ja": "よくよく考えてくださいまし", "zh": "还请您好好考虑"}, {"time": 720.0, "speaker": "格特鲁德", "ja": "ラハマン、クライデとロドスの接触に十分な注意を払っておきなさい", "zh": "拉赫曼，密切注意克莱德与罗德岛的接触"}, {"time": 727.0, "speaker": "格特鲁德", "ja": "決して逃げ出さぬように", "zh": "绝不能让他逃走"}, {"time": 729.0, "speaker": "拉赫曼", "ja": "はい", "zh": "是"}, {"time": 730.0, "speaker": "格特鲁德", "ja": "我々の作戦は必ず成功させなければなりません", "zh": "我们的计划必须成功"}]}, {"title": "春の祭典", "audio": "mp3/Track10 春の祭典.mp3", "entries": [{"time": 2.0, "speaker": "黑键", "ja": "自由", "zh": "自由"}, {"time": 4.0, "speaker": "黑键", "ja": "物心ついた頃から", "zh": "从我懂事起"}, {"time": 6.0, "speaker": "黑键", "ja": "自由とは何かを知らない", "zh": "我就不知道自由为何物"}, {"time": 9.0, "speaker": "黑键", "ja": "記憶の始まりは五、六歳で", "zh": "我的记忆始于五六岁时"}, {"time": 12.0, "speaker": "黑键", "ja": "それ以前の記憶は一切ない", "zh": "在那之前的记忆一概没有"}, {"time": 16.0, "speaker": "黑键", "ja": "ぼんやりと覚えているのは", "zh": "我隐约记得的"}, {"time": 19.0, "speaker": "黑键", "ja": "多くの大人に囲まれ", "zh": "只有自己被许多大人围着"}, {"time": 21.0, "speaker": "黑键", "ja": "塵界の音が頭の中で響くようになり", "zh": "尘界之音开始在脑中回响"}, {"time": 25.0, "speaker": "黑键", "ja": "そのせいで命を落としかけたということだけ", "zh": "并因此险些丧命这件事"}, {"time": 30.0, "speaker": "黑键", "ja": "その後、女帝陛下の許しにより、私はウルティカの領主となった", "zh": "之后，经女帝陛下准许，我成为了乌提卡的领主"}, {"time": 36.0, "speaker": "黑键", "ja": "だが、それからの日々は、息が詰まるという言葉すら生ぬるい監視生活", "zh": "但之后的日子，是连“令人窒息”这个词都显得过于温和的监视生活"}, {"time": 44.0, "speaker": "黑键", "ja": "欲望、悪意、陰謀、値踏みする視線", "zh": "欲望、恶意、阴谋，以及估量价值般的目光"}, {"time": 51.0, "speaker": "黑键", "ja": "塵界の音による止むことのない頭痛や幻聴だけが友だった", "zh": "由尘界之音带来的无尽头痛与幻听，成了我唯一的伙伴"}, {"time": 58.0, "speaker": "黑键", "ja": "そんな中で、ゲルトルーデは私に自由をくれると言った", "zh": "就在那样的日子里，格特鲁德说她会给我自由"}, {"time": 64.0, "speaker": "黑键", "ja": "初めてのチャンス", "zh": "这是我第一次得到机会"}, {"time": 67.0, "speaker": "黑键", "ja": "それがまさか", "zh": "却没想到"}, {"time": 69.0, "speaker": "黑键", "ja": "こんなことになるとは", "zh": "事情竟会变成这样"}, {"time": 74.0, "speaker": "黑键", "ja": "ただいま", "zh": "我回来了"}, {"time": 76.0, "speaker": "白垩", "ja": "おかえりなさい", "zh": "欢迎回来"}, {"time": 78.0, "speaker": "白垩", "ja": "エーベンホルツさん、どうしたんですか？顔色が悪いですよ", "zh": "黑键先生，您怎么了？脸色很差"}, {"time": 82.0, "speaker": "黑键", "ja": "大丈夫だ", "zh": "我没事"}, {"time": 83.0, "speaker": "白垩", "ja": "いや、絶対に変です", "zh": "不，您绝对不对劲"}, {"time": 85.0, "speaker": "白垩", "ja": "ここ数日いろいろなことがありましたし、疲れたんでしょう", "zh": "这几天发生了很多事，您一定是累了吧"}, {"time": 90.0, "speaker": "白垩", "ja": "ベッドで休んでいてください", "zh": "请到床上休息一下"}, {"time": 92.0, "speaker": "黑键", "ja": "いや、本当に問題ない。心配するな", "zh": "不，我真的没事，不用担心"}, {"time": 95.0, "speaker": "白垩", "ja": "いや、無理は禁物です", "zh": "不行，不能勉强自己"}, {"time": 98.0, "speaker": "白垩", "ja": "まずは横になって、他のことは全部僕に任せてください", "zh": "请先躺下，其他事情全部交给我"}, {"time": 104.0, "speaker": "黑键", "ja": "すまない", "zh": "抱歉"}, {"time": 110.0, "speaker": "脑中的声音", "ja": "下賤な蛆虫、自らの高貴な血を捨てる", "zh": "卑贱的蛆虫，竟亲手舍弃自己高贵的血脉"}, {"time": 114.0, "speaker": "脑中的声音", "ja": "自堕落なゴミが", "zh": "堕落的垃圾"}, {"time": 116.0, "speaker": "黑键", "ja": "黙れ", "zh": "闭嘴"}, {"time": 125.0, "speaker": "黑键", "ja": "聞いたことがある", "zh": "我听过"}, {"time": 128.0, "speaker": "黑键", "ja": "どこかで聞いたことがある", "zh": "我在哪里听过"}, {"time": 132.0, "speaker": "黑键", "ja": "どこで？", "zh": "在哪里？"}, {"time": 134.0, "speaker": "黑键", "ja": "私は……", "zh": "我……"}, {"time": 140.0, "speaker": "黑键", "ja": "これは……", "zh": "这是……"}, {"time": 143.0, "speaker": "白垩", "ja": "目が覚めましたか？", "zh": "您醒了吗？"}, {"time": 145.0, "speaker": "黑键", "ja": "今のチェロは", "zh": "刚才的大提琴"}, {"time": 147.0, "speaker": "黑键", "ja": "君が弾いていたのか？", "zh": "是你在拉吗？"}, {"time": 150.0, "speaker": "白垩", "ja": "はい", "zh": "是的"}, {"time": 151.0, "speaker": "黑键", "ja": "君は", "zh": "你"}, {"time": 153.0, "speaker": "黑键", "ja": "さっきのメロディをどこで聴いたんだ？", "zh": "刚才那段旋律，是在哪里听到的？"}, {"time": 157.0, "speaker": "白垩", "ja": "よく覚えていないんです", "zh": "我记不太清了"}, {"time": 160.0, "speaker": "白垩", "ja": "幼い頃にどこかで聴いたのかもしれません", "zh": "也许是小时候在哪里听过吧"}, {"time": 164.0, "speaker": "黑键", "ja": "幼い頃……", "zh": "小时候……"}, {"time": 168.0, "speaker": "黑键", "ja": "君は、君があの……", "zh": "你，你就是那个……"}, {"time": 172.0, "speaker": "路人庚", "ja": "陛下の血を継ぐ者は", "zh": "继承陛下血脉的人"}, {"time": 174.0, "speaker": "路人庚", "ja": "もうこれしか残っていないのですか", "zh": "只剩下这几个了吗？"}, {"time": 177.0, "speaker": "路人辛", "ja": "女帝の行動が速すぎたのよ", "zh": "女帝行动得太快了"}, {"time": 179.0, "speaker": "路人辛", "ja": "陛下の遺骸を奪っただけでは飽き足らず", "zh": "她不只夺走了陛下的遗骸"}, {"time": 183.0, "speaker": "路人辛", "ja": "忌々しい", "zh": "真是可恨"}, {"time": 184.0, "speaker": "路人庚", "ja": "ですが、やはり", "zh": "但是，果然还是……"}, {"time": 186.0, "speaker": "路人庚", "ja": "陛下が残された旋律", "zh": "陛下留下的旋律"}, {"time": 188.0, "speaker": "路人庚", "ja": "塵界の音をこのように軽々しく……", "zh": "尘界之音，怎能如此草率地……"}, {"time": 190.0, "speaker": "路人辛", "ja": "陛下の一日も早い復活のため", "zh": "为了让陛下早日复活"}, {"time": 193.0, "speaker": "路人辛", "ja": "すぐにでも音をこの子たちに入れないといけないのよ", "zh": "必须立刻把声音植入这些孩子体内"}, {"time": 197.0, "speaker": "黑键", "ja": "私は一体何歳だったのだ", "zh": "那时我到底几岁？"}, {"time": 201.0, "speaker": "黑键", "ja": "二歳か三歳か", "zh": "两岁，还是三岁？"}, {"time": 204.0, "speaker": "黑键", "ja": "変な大人たちに", "zh": "我被一群奇怪的大人"}, {"time": 206.0, "speaker": "黑键", "ja": "ある人里離れた家に連れ込まれた", "zh": "带进了一座远离人烟的房子"}, {"time": 209.0, "speaker": "黑键", "ja": "子供は他にも何人かいた", "zh": "那里还有几个孩子"}, {"time": 213.0, "speaker": "黑键", "ja": "連れ込まれる際", "zh": "被带进去的时候"}, {"time": 215.0, "speaker": "黑键", "ja": "大人たちに両親は亡くなったと言われ", "zh": "那些大人告诉我，我的父母已经死了"}, {"time": 218.0, "speaker": "黑键", "ja": "同時に私たちは", "zh": "同时又告诉我们"}, {"time": 220.0, "speaker": "黑键", "ja": "偉大な計画の一部だと告げられた", "zh": "我们是伟大计划的一部分"}, {"time": 224.0, "speaker": "黑键", "ja": "分からない。何を言っているのか全く分からない", "zh": "我不明白。我完全不明白他们在说什么"}, {"time": 229.0, "speaker": "黑键", "ja": "ただ毎回、彼らに連れて行かれた子は", "zh": "我只知道，每一次被他们带走的孩子"}, {"time": 233.0, "speaker": "黑键", "ja": "二度と戻らないことだけは知っていた", "zh": "都再也没有回来"}, {"time": 237.0, "speaker": "黑键", "ja": "最後に残ったのは私と、もう一人の子だけだった", "zh": "最后只剩下我和另一个孩子"}, {"time": 242.0, "speaker": "黑键", "ja": "いつも怖がっている私を慰め、歌を歌ってくれる優しい子", "zh": "那是个温柔的孩子，总是安慰害怕的我，唱歌给我听"}, {"time": 250.0, "speaker": "黑键", "ja": "あの歌は確か……", "zh": "那首歌，我记得是……"}, {"time": 277.0, "speaker": "研究人员", "ja": "今回、私たちの技術に大きな進歩がありました", "zh": "这一次，我们的技术有了很大进展"}, {"time": 283.0, "speaker": "研究人员", "ja": "成功するかもしれません", "zh": "也许会成功"}, {"time": 287.0, "speaker": "研究人员", "ja": "今回実験を受ける人は、とってもすごい術師になるかもしれませんよ", "zh": "这次接受实验的人，说不定会成为非常厉害的术师哦"}, {"time": 292.0, "speaker": "研究人员", "ja": "さて、どちらにしましょうかね", "zh": "那么，该选哪一个呢？"}, {"time": 300.0, "speaker": "白垩", "ja": "僕が行く", "zh": "我去"}, {"time": 303.0, "speaker": "黑键", "ja": "その言葉

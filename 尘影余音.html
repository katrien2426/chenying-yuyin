: 887.0, "speaker": "白垩", "ja": "よかた、汚れていません", "zh": "太好了，没有弄脏"}, {"time": 900.0, "speaker": "黑键", "ja": "匂いはどうだ？", "zh": "气味呢？"}, {"time": 902.0, "speaker": "黑键", "ja": "臭いだろ？", "zh": "很臭吧？"}, {"time": 905.0, "speaker": "白垩", "ja": "確かに", "zh": "确实"}, {"time": 908.0, "speaker": "黑键", "ja": "大丈夫だ", "zh": "没关系"}, {"time": 909.0, "speaker": "黑键", "ja": "今一番臭いのは私だからな", "zh": "现在最臭的是我"}, {"time": 914.0, "speaker": "黑键", "ja": "何がおかしい？", "zh": "有什么好笑的？"}, {"time": 919.0, "speaker": "白垩", "ja": "助けてくれて", "zh": "谢谢你"}, {"time": 921.0, "speaker": "白垩", "ja": "ありがとうございます", "zh": "救了我"}, {"time": 923.0, "speaker": "黑键", "ja": "いや、私こそ", "zh": "不，该道谢的是我"}, {"time": 929.0, "speaker": "黑键", "ja": "本当に……すまない", "zh": "真的……对不起"}, {"time": 934.0, "speaker": "黑键", "ja": "申し訳ない", "zh": "对不起"}, {"time": 936.0, "speaker": "黑键", "ja": "もしあの時、もう少し勇気があれば", "zh": "如果那时我能再勇敢一点"}, {"time": 940.0, "speaker": "黑键", "ja": "あの時、私が、立ち上がることができていれば", "zh": "如果那时我能够站起来"}, {"time": 946.0, "speaker": "黑键", "ja": "君は……", "zh": "你就……"}, {"time": 950.0, "speaker": "黑键", "ja": "本当にすまない", "zh": "真的对不起"}, {"time": 952.0, "speaker": "白垩", "ja": "謝らなくていいんです", "zh": "不用道歉"}, {"time": 955.0, "speaker": "白垩", "ja": "本当に悪いのは", "zh": "真正有错的"}, {"time": 957.0, "speaker": "白垩", "ja": "この音を作った人と", "zh": "是制造出这声音的人"}, {"time": 959.0, "speaker": "白垩", "ja": "それを利用しようとしている人なんです", "zh": "以及试图利用它的人"}, {"time": 963.0, "speaker": "白垩", "ja": "僕は", "zh": "我只是"}, {"time": 965.0, "speaker": "白垩", "ja": "自分の信念に従って", "zh": "遵从自己的信念"}, {"time": 968.0, "speaker": "白垩", "ja": "あなたを守りました", "zh": "保护了你"}, {"time": 970.0, "speaker": "白垩", "ja": "あなたが今", "zh": "就像现在的你"}, {"time": 972.0, "speaker": "白垩", "ja": "自分の信念に従って", "zh": "也遵从自己的信念"}, {"time": 975.0, "speaker": "白垩", "ja": "僕を守ろうとしているように", "zh": "试图保护我一样"}, {"time": 981.0, "speaker": "黑键", "ja": "そうだな", "zh": "是啊"}, {"time": 983.0, "speaker": "黑键", "ja": "ロドスのところに行こう", "zh": "去罗德岛那里吧"}, {"time": 986.0, "speaker": "黑键", "ja": "解決策ならきっとある", "zh": "一定会有解决办法"}, {"time": 988.0, "speaker": "黑键", "ja": "必ずあるはずだ", "zh": "一定会有的"}, {"time": 991.0, "speaker": "黑键", "ja": "行こう", "zh": "走吧"}, {"time": 995.0, "speaker": "黑键", "ja": "クライデ！", "zh": "白垩！"}, {"time": 996.0, "speaker": "黑键", "ja": "起きろ！クライデ！", "zh": "醒醒！白垩！"}]}, {"title": "Drängend", "audio": "mp3/Track12 Drängend.mp3", "entries": [{"time": 1.0, "speaker": "芙蓉", "ja": "クライデさんの状態は基本的に安定しています", "zh": "白垩先生的状态基本稳定"}, {"time": 6.0, "speaker": "芙蓉", "ja": "気絶の原因は中毒と断定して問題ないでしょう", "zh": "昏迷的原因可以断定为中毒，应该没有问题"}, {"time": 11.0, "speaker": "芙蓉", "ja": "ですが、クライデさんの今後については", "zh": "但是，关于白垩先生今后的情况"}, {"time": 16.0, "speaker": "芙蓉", "ja": "あの伯爵の言葉に恐らく嘘はありません", "zh": "那位伯爵的话恐怕并非谎言"}, {"time": 21.0, "speaker": "芙蓉", "ja": "総合的な状況から判断すると", "zh": "从综合情况判断"}, {"time": 23.0, "speaker": "芙蓉", "ja": "確かに彼は危機に瀕しています", "zh": "他的确正处在危机之中"}, {"time": 26.0, "speaker": "黑键", "ja": "それで、私たちに力を貸してくれるのだろう", "zh": "所以，你们会帮我们吧"}, {"time": 31.0, "speaker": "芙蓉", "ja": "私も心からあなたたちを信じたいです", "zh": "我也真心想相信你们"}, {"time": 36.0, "speaker": "芙蓉", "ja": "でも、証拠が欲しいんです", "zh": "但是，我需要证据"}, {"time": 39.0, "speaker": "芙蓉", "ja": "状況証拠だって構いません", "zh": "哪怕是间接证据也可以"}, {"time": 42.0, "speaker": "芙蓉", "ja": "私は客観的事実が欲しいんです", "zh": "我需要客观事实"}, {"time": 45.0, "speaker": "芙蓉", "ja": "塵界の音が憶測などではなく", "zh": "证明尘界之音并非单纯的臆测"}, {"time": 49.0, "speaker": "芙蓉", "ja": "差し迫る陰謀の一部であるという", "zh": "而是迫在眉睫的阴谋的一部分"}, {"time": 52.0, "speaker": "白垩的爷爷", "ja": "憶測？", "zh": "臆测？"}, {"time": 53.0, "speaker": "白垩的爷爷", "ja": "じゃあ、あんたの話は百パーセント真実だと断言できるのか", "zh": "那你能断言你说的话百分之百真实吗？"}, {"time": 58.0, "speaker": "芙蓉", "ja": "おじいさん？", "zh": "爷爷？"}, {"time": 59.0, "speaker": "白垩的爷爷", "ja": "クライデは", "zh": "白垩他"}, {"time": 60.0, "speaker": "白垩的爷爷", "ja": "あんたが話したことのせいで", "zh": "就是因为你说的那些话"}, {"time": 63.0, "speaker": "白垩的爷爷", "ja": "オリジムシに身を投じるところだったんだぞ", "zh": "才差点把自己送进源石虫群里啊"}, {"time": 65.0, "speaker": "芙蓉", "ja": "エーベンホルツさん……", "zh": "黑键先生……"}, {"time": 67.0, "speaker": "芙蓉", "ja": "クライデさんは本当に……", "zh": "白垩先生真的……"}, {"time": 69.0, "speaker": "黑键", "ja": "ああ", "zh": "嗯"}, {"time": 70.0, "speaker": "白垩的爷爷", "ja": "教えてやるわ", "zh": "我告诉你们吧"}, {"time": 72.0, "speaker": "白垩的爷爷", "ja": "塵界の音は本当に存在する", "zh": "尘界之音确实存在"}, {"time": 75.0, "speaker": "白垩的爷爷", "ja": "わしのこの命を懸けて証明する", "zh": "我愿用这条命来证明"}, {"time": 77.0, "speaker": "芙蓉", "ja": "どういう意味ですか？", "zh": "这是什么意思？"}, {"time": 79.0, "speaker": "白垩的爷爷", "ja": "コンサートホールに行けば", "zh": "去音乐厅的话"}, {"time": 81.0, "speaker": "白垩的爷爷", "ja": "すべてが分かる", "zh": "一切都会明白"}, {"time": 84.0, "speaker": "黑键", "ja": "そうだ、コンサートホール……ゲルトルーデが言っていた", "zh": "哦对，音乐厅……格特鲁德说过"}, {"time": 88.0, "speaker": "黑键", "ja": "共鳴の誘導はアフターグローホールの助けが絶対必要だと", "zh": "引导共鸣绝对需要夕照音乐厅的帮助"}, {"time": 94.0, "speaker": "黑键", "ja": "ホールに細工しているかもしれない", "zh": "她可能在音乐厅里动了手脚"}, {"time": 96.0, "speaker": "芙蓉", "ja": "分かりました、すぐに行きましょう", "zh": "我明白了，我们马上去"}, {"time": 99.0, "speaker": "白垩的爷爷", "ja": "それと、ツェルニー。彼も呼びなさい", "zh": "还有车尔尼，也把他叫来"}, {"time": 103.0, "speaker": "白垩的爷爷", "ja": "あんたら二人がどちらも相手を説得できない事態が起こった時のために", "zh": "以防你们两人谁也说服不了对方"}, {"time": 108.0, "speaker": "白垩的爷爷", "ja": "私はもう行く", "zh": "我先走了"}, {"time": 110.0, "speaker": "芙蓉", "ja": "おじいさん！あなた！", "zh": "爷爷！等等！"}, {"time": 116.0, "speaker": "黑键", "ja": "いない？", "zh": "不在？"}, {"time": 117.0, "speaker": "乌尔苏拉", "ja": "旦那様は中毒になった感染者を治療してもらうために", "zh": "老爷为了给中毒的感染者争取治疗"}, {"time": 121.0, "speaker": "乌尔苏拉", "ja": "区外の病院に交渉しに行ったよ", "zh": "去和区外的医院交涉了"}, {"time": 125.0, "speaker": "车尔尼", "ja": "ただいま", "zh": "我回来了"}, {"time": 127.0, "speaker": "乌尔苏拉", "ja": "ああ、旦那様、おかえり", "zh": "啊，老爷，欢迎回来"}, {"time": 129.0, "speaker": "乌尔苏拉", "ja": "病院はどうだったんだい？", "zh": "医院那边怎么样？"}, {"time": 130.0, "speaker": "车尔尼", "ja": "なんとか二つの大きい病院を説得し", "zh": "勉强说服了两家大型医院"}, {"time": 133.0, "speaker": "车尔尼", "ja": "契約にこぎつけましたが", "zh": "总算签下了协议"}, {"time": 136.0, "speaker": "车尔尼", "ja": "他はだめでした", "zh": "但其他医院不行"}, {"time": 138.0, "speaker": "芙蓉", "ja": "ロドスは病院と協定を結んでいます", "zh": "罗德岛和医院之间有协议"}, {"time": 142.0, "speaker": "车尔尼", "ja": "あなたもいたのですか？", "zh": "你也在吗？"}, {"time": 145.0, "speaker": "车尔尼", "ja": "ロドスと病院との協定は", "zh": "罗德岛与医院的协议"}, {"time": 147.0, "speaker": "车尔尼", "ja": "オリパシーが引き起こす症状に限られます", "zh": "仅限于矿石病引发的症状"}, {"time": 150.0, "speaker": "车尔尼", "ja": "中毒症状の感染者を受け入れなくてはならない理由は", "zh": "他们并没有必须接收中毒感染者的理由"}, {"time": 154.0, "speaker": "车尔尼", "ja": "彼らにはありません", "zh": "对他们来说没有这个义务"}, {"time": 156.0, "speaker": "乌尔苏拉", "ja": "だけど", "zh": "可是"}, {"time": 157.0, "speaker": "乌尔苏拉", "ja": "二つの病院を説得できたなら", "zh": "既然说服了两家医院"}, {"time": 159.0, "speaker": "乌尔苏拉", "ja": "足りるんじゃないのかい？", "zh": "那不就够了吗？"}, {"time": 162.0, "speaker": "车尔尼", "ja": "足りるでしょう", "zh": "应该够了"}, {"time": 164.0, "speaker": "车尔尼", "ja": "足りないはずがない", "zh": "不可能不够"}, {"time": 166.0, "speaker": "车尔尼", "ja": "私の著作権すべてを担保にしたのです", "zh": "我可是把自己所有的著作权都拿去做了担保"}, {"time": 169.0, "speaker": "车尔尼", "ja": "きっと笑いが止まらないことでしょうね", "zh": "他们现在一定笑得停不下来吧"}, {"time": 172.0, "speaker": "芙蓉", "ja": "まさか、著作権をその財団に譲渡したんですか？", "zh": "难道您把著作权转让给了那个财团吗？"}, {"time": 177.0, "speaker": "车尔尼", "ja": "そうです", "zh": "没错"}, {"time": 178.0, "speaker": "车尔尼", "ja": "これまでの著作権だけでなく", "zh": "不仅是至今为止的著作权"}, {"time": 181.0, "speaker": "车尔尼", "ja": "明日のコンサートの録音の版権も彼らに売り渡しました", "zh": "连明天音乐会录音的版权也卖给了他们"}, {"time": 185.0, "speaker": "车尔尼", "ja": "これで、またゼロからのスタートです", "zh": "这样一来，又要从零开始了"}, {"time": 190.0, "speaker": "乌尔苏拉", "ja": "旦那様！旦那様！", "zh": "老爷！老爷！"}, {"time": 196.0, "speaker": "乌尔苏拉", "ja": "旦那様は大丈夫かい？", "zh": "老爷没事吧？"}, {"time": 198.0, "speaker": "芙蓉", "ja": "大事はありません", "zh": "没有大碍"}, {"time": 200.0, "speaker": "芙蓉", "ja": "ここ数日の疲労が限界に達したのでしょう", "zh": "大概是这几天的疲劳达到极限了"}, {"time": 205.0, "speaker": "芙蓉", "ja": "しかし、著作権を全部譲渡するなんて……", "zh": "可是，竟然把所有著作权都转让出去……"}, {"time": 210.0, "speaker": "芙蓉", "ja": "どうしてツェルニーさんはここまでできるんですか", "zh": "为什么车尔尼先生能做到这种地步？"}, {"time": 215.0, "speaker": "乌尔苏拉", "ja": "アフターグロー区の名前の由来は知っているかい？", "zh": "你知道夕照区这个名字的由来吗？"}, {"time": 219.0, "speaker": "芙蓉", "ja": "いいえ、知りません", "zh": "不，我不知道"}, {"time": 222.0, "speaker": "乌尔苏拉", "ja": "旦那様が以前こう言ったことがあるんだ", "zh": "老爷以前曾经这样说过"}, {"time": 226.0, "speaker": "乌尔苏拉", "ja": "空が暗くなるからこそ、夕日はより尊く映る", "zh": "正因为天空将暗，夕阳才显得更加珍贵"}, {"time": 232.0, "speaker": "乌尔苏拉", "ja": "もしも夜が永遠に終わらないなら、暖かな夕暮れの光以上に", "zh": "如果黑夜永远不会结束，那么还有什么能比温暖的暮光"}, {"time": 238.0, "speaker": "乌尔苏拉", "ja": "人々の目を奪い、心を揺さぶるものなどあるだろうか、ってね", "zh": "更夺人目光，更震撼人心呢——他是这样说的"}, {"time": 245.0, "speaker": "芙蓉", "ja": "素晴らしい言葉ですね", "zh": "真是很美的话"}, {"time": 248.0, "speaker": "乌尔苏拉", "ja": "このアフターグロー区は、もともとは感染者居住区なんかじゃなく", "zh": "这个夕照区，原本并不是什么感染者居住区"}, {"time": 254.0, "speaker": "乌尔苏拉", "ja": "数あるヴィセハイムの工業区画の一つだったんだよ", "zh": "只是维谢海姆众多工业区之一"}, {"time": 259.0, "speaker": "乌尔苏拉", "ja": "ある年、かの陛下の一声で、今のアフターグローホールが建てられた", "zh": "某一年，因为那位陛下的一句话，如今的夕照音乐厅建了起来"}, {"time": 266.0, "speaker": "芙蓉", "ja": "かの陛下って、どの陛下ですか？", "zh": "“那位陛下”是指哪位陛下？"}, {"time": 271.0, "speaker": "乌尔苏拉", "ja": "他にいないだろう。これくらい察しておくれ", "zh": "还能有谁呢？这种事你就自己意会吧"}, {"time": 276.0, "speaker": "芙蓉", "ja": "わ、分かりました", "zh": "我、我明白了"}, {"time": 281.0, "speaker": "乌尔苏拉", "ja": "だが、陛下はホールを建てた後亡くなり", "zh": "但是，陛下在建成音乐厅后就死去了"}, {"time": 284.0, "speaker": "乌尔苏拉", "ja": "ヴィセハイムを引き継いだストロッロの伯爵は", "zh": "而继承维谢海姆的斯特罗洛伯爵"}, {"time": 287.0, "speaker": "乌尔苏拉", "ja": "このホールをひどく嫌ったんだ", "zh": "非常厌恶这座音乐厅"}, {"time": 291.0, "speaker": "乌尔苏拉", "ja": "数年が経って", "zh": "几年之后"}, {"time": 293.0, "speaker": "乌尔苏拉", "ja": "感染者の待遇を引き上げるようにお上が言ってね", "zh": "上面要求提高感染者的待遇"}, {"time": 297.0, "speaker": "乌尔苏拉", "ja": "当時の伯爵は", "zh": "当时的伯爵"}, {"time": 299.0, "speaker": "乌尔苏拉", "ja": "例のホールを工業区画ごと", "zh": "就把那座音乐厅连同整个工业区"}, {"time": 301.0, "speaker": "乌尔苏拉", "ja": "感染者居住区に組み込んだんだ", "zh": "一起并入了感染者居住区"}, {"time": 305.0, "speaker": "芙蓉", "ja": "当時の伯爵は今のゲルトルーデさんではなかったんですか？", "zh": "当时的伯爵不是现在的格特鲁德女士吗？"}, {"time": 311.0, "speaker": "乌尔苏拉", "ja": "はて、彼女の父親、それとも兄だったかいね", "zh": "这个嘛，是她父亲，还是哥哥来着"}, {"time": 317.0, "speaker": "乌尔苏拉", "ja": "とにかく、当時の伯爵はこの区画を感染者居住区にしたが", "zh": "总之，当时的伯爵把这个区划成了感染者居住区"}, {"time": 323.0, "speaker": "乌尔苏拉", "ja": "区画内の工業施設を全部取り壊しちまった", "zh": "却把区内的工业设施全都拆掉了"}, {"time": 327.0, "speaker": "乌尔苏拉", "ja": "お上への報告のために形だけ作って", "zh": "只是为了向上面报告而做做样子"}, {"time": 331.0, "speaker": "乌尔苏拉", "ja": "私たちの生き死になんか知らんぷりさ", "zh": "至于我们的死活，他们根本不管"}, {"time": 334.0, "speaker": "乌尔苏拉", "ja": "それからこの場所は貴族たちが言うアフターグロー区になった", "zh": "从那之后，这里就成了贵族口中的夕照区"}, {"time": 340.0, "speaker": "乌尔苏拉", "ja": "アフターグローは夕暮れの太陽みたいに", "zh": "所谓夕照，就像夕阳的余晖一样"}, {"time": 344.0, "speaker": "乌尔苏拉", "ja": "もうすぐ沈んで消えるってことを揶揄してるのさ", "zh": "是在讥讽我们很快就会沉没、消失"}, {"time": 349.0, "speaker": "芙蓉", "ja": "そんなの、ひどすぎます", "zh": "这也太过分了"}, {"time": 352.0, "speaker": "乌尔苏拉", "ja": "当時のアフターグロー区の住民からしてみれば", "zh": "不过在当时夕照区居民看来"}, {"time": 355.0, "speaker": "乌尔苏拉", "ja": "あながち間違っちゃいなかったよ", "zh": "这种说法也不算完全错误"}, {"time": 358.0, "speaker": "乌尔苏拉", "ja": "太陽を地平線上にもう少し留まらせたくて", "zh": "大家都想让太阳在地平线上再停留一会儿"}, {"time": 362.0, "speaker": "乌尔苏拉", "ja": "みんな必死に生きた", "zh": "于是拼命地活着"}, {"time": 366.0, "speaker": "乌尔苏拉", "ja": "そんな時、ツェルニーさんが立ち上がったんだ", "zh": "就在那时，车尔尼先生站了出来"}, {"time": 369.0, "speaker": "芙蓉", "ja": "立ち上がった？", "zh": "站了出来？"}, {"time": 371.0, "speaker": "乌尔苏拉", "ja": "ツェルニーさんは最初、そこまで有名じゃなかった", "zh": "车尔尼先生一开始并没有那么有名"}, {"time": 375.0, "speaker": "乌尔苏拉", "ja": "何曲か出していたが、感染者という身分だったから", "zh": "虽然发表过几首曲子，但因为感染者的身份"}, {"time": 379.0, "speaker": "乌尔苏拉", "ja": "どれも匿名での発表だったんだ", "zh": "每一首都是匿名发表的"}, {"time": 384.0, "speaker": "乌尔苏拉", "ja": "旦那様にピアノを教えた先生には", "zh": "曾经教老爷钢琴的老师"}, {"time": 386.0, "speaker": "乌尔苏拉", "ja": "娘がいてね", "zh": "有一个女儿"}, {"time": 388.0, "speaker": "乌尔苏拉", "ja": "彼女と旦那様は恋人で、よきライバルだった", "zh": "她和老爷既是恋人，也是很好的竞争对手"}, {"time": 395.0, "speaker": "乌尔苏拉", "ja": "でも旦那様が二十歳の時、その子は亡くなってしまったんだよ", "zh": "可是，在老爷二十岁的时候，那个女孩去世了"}, {"time": 401.0, "speaker": "芙蓉", "ja": "そんな……", "zh": "怎么会……"}, {"time": 403.0, "speaker": "乌尔苏拉", "ja": "旦那様は大きなショックを受け", "zh": "老爷受到了极大的打击"}, {"time": 406.0, "speaker": "乌尔苏拉", "ja": "口数も減り、日に日に痩せ細っていった", "zh": "话越来越少，身体也一天天消瘦下去"}, {"time": 410.0, "speaker": "乌尔苏拉", "ja": "だけどある日突然", "zh": "可是有一天"}, {"time": 412.0, "speaker": "乌尔苏拉", "ja": "楽譜の束を見せてきて", "zh": "他突然拿出一沓乐谱"}, {"time": 415.0, "speaker": "乌尔苏拉", "ja": "新曲を作った", "zh": "说自己写了一首新曲"}, {"time": 417.0, "speaker": "  "乌尔苏拉", "ja": "口では一度も言ってなかったけど", "zh": "虽然老爷从没亲口说过"}, {"time": 511.0, "speaker": "乌尔苏拉", "ja": "旦那様はこのアフターグロー区を", "zh": "但老爷对这个夕照区"}, {"time": 513.0, "speaker": "乌尔苏拉", "ja": "誰よりも大事にしているんだよ", "zh": "比任何人都要珍视"}, {"time": 516.0, "speaker": "车尔尼", "ja": "ウルズラ", "zh": "乌尔苏拉"}, {"time": 518.0, "speaker": "车尔尼", "ja": "余計なことは言わないでくれと言いましたよね", "zh": "我应该说过，请不要说多余的话吧"}, {"time": 521.0, "speaker": "乌尔苏拉", "ja": "あれ？まあ、旦那様", "zh": "哎呀？老爷"}, {"time": 522.0, "speaker": "乌尔苏拉", "ja": "起きて大丈夫なのかい？", "zh": "您醒了，没事吗？"}, {"time": 524.0, "speaker": "芙蓉", "ja": "ツェルニーさん", "zh": "车尔尼先生"}, {"time": 526.0, "speaker": "芙蓉", "ja": "今後またこんなことがあったら", "zh": "以后如果再发生这种事"}, {"time": 528.0, "speaker": "芙蓉", "ja": "せめて防護措置は取ってください", "zh": "至少也请做好防护措施"}, {"time": 530.0, "speaker": "车尔尼", "ja": "今後？", "zh": "以后？"}, {"time": 532.0, "speaker": "车尔尼", "ja": "つまり", "zh": "也就是说"}, {"time": 534.0, "speaker": "车尔尼", "ja": "私にはまだ余命があると", "zh": "我还有剩余的寿命"}, {"time": 537.0, "speaker": "芙蓉", "ja": "私がいますから", "zh": "因为有我在"}, {"time": 541.0, "speaker": "车尔尼", "ja": "体を壊してみてようやく", "zh": "等身体垮掉之后"}, {"time": 544.0, "speaker": "车尔尼", "ja": "お医者さんのことをありがたいと感じますね", "zh": "才终于觉得医生很值得感激呢"}, {"time": 547.0, "speaker": "车尔尼", "ja": "感謝します", "zh": "谢谢你"}, {"time": 549.0, "speaker": "芙蓉", "ja": "医師として当然です", "zh": "这是医生应做的"}, {"time": 553.0, "speaker": "车尔尼", "ja": "それで、どうしてミスター・エーベンホルツがここに？", "zh": "所以，为什么黑键先生会在这里？"}, {"time": 557.0, "speaker": "车尔尼", "ja": "まさか、アフターグロー区があまりに危険だから", "zh": "难道是因为夕照区太危险"}, {"time": 561.0, "speaker": "车尔尼", "ja": "コンサートの辞退を申し出に来たんですか？", "zh": "所以您是来提出退出音乐会的吗？"}, {"time": 565.0, "speaker": "黑键", "ja": "実は……", "zh": "其实……"}, {"time": 572.0, "speaker": "芙蓉", "ja": "ツェルニーさん、水？", "zh": "车尔尼先生，要水吗？"}, {"time": 574.0, "speaker": "车尔尼", "ja": "ゲルトルーデめ……", "zh": "格特鲁德那家伙……"}, {"time": 576.0, "speaker": "车尔尼", "ja": "くそっ！", "zh": "可恶！"}, {"time": 577.0, "speaker": "车尔尼", "ja": "お水を飲んでください", "zh": "请先喝点水"}, {"time": 578.0, "speaker": "车尔尼", "ja": "あなたもです", "zh": "您也是"}, {"time": 579.0, "speaker": "车尔 ば、貴殿のところへは来ていない", "zh": "否则，我也不会来找你"}, {"time": 648.0, "speaker": "车尔尼", "ja": "コンサートホールに行きましょう", "zh": "去音乐厅吧"}, {"time": 650.0, "speaker": "车尔尼", "ja": "先日、音響機材の確認をしたのですが", "zh": "前几天我去确认过音响设备"}, {"time": 654.0, "speaker": "车尔尼", "ja": "その際にゲルトルーデは", "zh": "当时格特鲁德"}, {"time": 656.0, "speaker": "车尔尼", "ja": "私をうまくホールの休憩室から遠ざけました", "zh": "巧妙地把我从音乐厅的休息室支开了"}, {"time": 660.0, "speaker": "车尔尼", "ja": "きっとあそこに何かあるはずです", "zh": "那里一定有什么东西"}, {"time": 663.0, "speaker": "比格勒", "ja": "その必要はありません", "zh": "没有那个必要"}, {"time": 665.0, "speaker": "黑键", "ja": "この声は？", "zh": "这个声音是？"}, {"time": 666.0, "speaker": "比格勒", "ja": "こんばんは", "zh": "晚上好"}, {"time": 667.0, "speaker": "比格勒", "ja": "ビーグラー特製コーヒーのデリバリーです", "zh": "比格勒特制咖啡外送到了"}, {"time": 670.0, "speaker": "芙蓉", "ja": "あなたは喫茶店の店長！", "zh": "你是咖啡店的店长"}, {"time": 672.0, "speaker": "黑键", "ja": "三白眼の密偵だろう", "zh": "那个三白眼密探吧"}, {"time": 674.0, "speaker": "乌尔苏拉", "ja": "やけに驚くね", "zh": "你们好像很惊讶呢"}, {"time": 676.0, "speaker": "乌尔苏拉", "ja": "誰がコーヒーを頼んだんだい？", "zh": "是谁点了咖啡？"}, {"time": 678.0, "speaker": "比格勒", "ja": "お邪魔します、ウルズラさん", "zh": "打扰了，乌尔苏拉女士"}, {"time": 680.0, "speaker": "比格勒", "ja": "コーヒーをどうぞ", "zh": "请用咖啡"}, {"time": 681.0, "speaker": "芙蓉", "ja": "三白眼の密偵？", "zh": "三白眼密探？"}, {"time": 684.0, "speaker": "芙蓉", "ja": "どういうことですか？", "zh": "这是怎么回事？"}, {"time": 685.0, "speaker": "比格勒", "ja": "本当は機密ですが、仕方ありません", "zh": "本来这是机密，但没办法"}, {"time": 689.0, "speaker": "比格勒", "ja": "簡単に言うと、私は今ストロッロ伯爵", "zh": "简单来说，我现在正在调查斯特罗洛伯爵"}, {"time": 693.0, "speaker": "比格勒", "ja": "つまりゲルトルーデを調査中の密偵です", "zh": "也就是格特鲁德"}, {"time": 696.0, "speaker": "黑键", "ja": "必要はないとはどういうことだ？", "zh": "你说没有必要，是什么意思？"}, {"time": 699.0, "speaker": "比格勒", "ja": "先日あなたとストロッロ伯爵の密談内容を聞いた後", "zh": "前几天听到你和斯特罗洛伯爵的密谈内容后"}, {"time": 703.0, "speaker": "比格勒", "ja": "アフターグローホールのことがずっと気がかりでした", "zh": "我就一直很在意夕照音乐厅"}, {"time": 707.0, "speaker": "比格勒", "ja": "そして昨晩発見した塵界の音の研究ノートでさらに確信を得ました", "zh": "而昨晚发现的尘界之音研究笔记，让我更加确信"}, {"time": 713.0, "speaker": "比格勒", "ja": "アフターグローホールには絶対何かが仕掛けてあります", "zh": "夕照音乐厅里一定被动了手脚"}, {"time": 718.0, "speaker": "黑键", "ja": "密偵殿のことだ、裏は取ってあるのだろう", "zh": "既然是密探先生，应该已经查证过了吧"}, {"time": 721.0, "speaker": "比格勒", "ja": "ええ。一番警備されている休憩室に潜入してみたら", "zh": "是的。我潜入了警备最严密的休息室"}, {"time": 726.0, "speaker": "比格勒", "ja": "増幅器が多く設置されていましたよ", "zh": "发现里面设置了许多增幅器"}, {"time": 729.0, "speaker": "比格勒", "ja": "それもかなりお粗末な状態で", "zh": "而且状态相当粗糙"}, {"time": 731.0, "speaker": "车尔尼", "ja": "あの女は一体何を企んで……", "zh": "那个女人到底在打什么主意……"}, {"time": 736.0, "speaker": "比格勒", "ja": "明白ではありませんか", "zh": "这不是很明显吗？"}, {"time": 739.0, "speaker": "比格勒", "ja": "アーツの要塞でもあるアフターグローホールを", "zh": "她把本就是法术要塞的夕照音乐厅"}, {"time": 742.0, "speaker": "比格勒", "ja": "巨大な増幅器兼アーツ増幅装置にしたんです", "zh": "变成了巨大的增幅器兼法术增幅装置"}, {"time": 746.0, "speaker": "比格勒", "ja": "ひとたび誰かがステージ上で音楽アーツを放てば", "zh": "一旦有人在舞台上释放音乐法术"}, {"time": 749.0, "speaker": "比格勒", "ja": "アーツのエネルギーは指数関数的に増幅し", "zh": "法术能量就会呈指数级增幅"}, {"time": 752.0, "speaker": "比格勒", "ja": "音楽とともにアフターグローホールの外まで広がる", "zh": "并随着音乐扩散到夕照音乐厅之外"}, {"time": 757.0, "speaker": "比格勒", "ja": "塵界の音の漏出と共鳴も例外ではありません", "zh": "尘界之音的漏出与共鸣也不例外"}, {"time": 761.0, "speaker": "黑键", "ja": "つまり、音が届くエリアのオリジニウムが強制的に活性化すると", "zh": "也就是说，声音所到之处的源石都会被强制活化"}, {"time": 767.0, "speaker": "芙蓉", "ja": "感染者の病状は進行し、彼らが死ぬと", "zh": "感染者的病情会恶化，而当他们死亡时"}, {"time": 775.0, "speaker": "芙蓉", "ja": "塵界の音粒子が発生します。パンデミックです", "zh": "就会产生尘界之音粒子。也就是一场大流行"}, {"time": 780.0, "speaker": "比格勒", "ja": "ええ。事によってはリターニアを揺るがす事件になります", "zh": "是的。视情况而定，这会成为撼动莱塔尼亚的事件"}, {"time": 785.0, "speaker": "比格勒", "ja": "さすがに看過できません。増幅器はもうすべて取り外しました", "zh": "这实在不能坐视不管。增幅器已经全部拆除了"}, {"time": 791.0, "speaker": "芙蓉", "ja": "ああ、良かった", "zh": "啊，太好了"}, {"time": 793.0, "speaker": "比格勒", "ja": "ここに来たのはご報告と伝言のためです", "zh": "我来这里是为了报告，并传达消息"}, {"time": 797.0, "speaker": "比格勒", "ja": "ミスター・ツェルニー、ストロッロ伯爵はこれから我々の管理下に入ります", "zh": "车尔尼先生，斯特罗洛伯爵接下来会被纳入我们的管控之下"}, {"time": 803.0, "speaker": "比格勒", "ja": "もう危険はありません", "zh": "已经没有危险了"}, {"time": 806.0, "speaker": "比格勒", "ja": "とはいえ", "zh": "话虽如此"}, {"time": 807.0, "speaker": "比格勒", "ja": "このコンサートは取りやめることをお勧めしますがね", "zh": "我还是建议取消这场音乐会"}, {"time": 811.0, "speaker": "车尔尼", "ja": "明日のコンサートは", "zh": "明天的音乐会"}, {"time": 813.0, "speaker": "车尔尼", "ja": "既に禁止されたものかと思っていました", "zh": "我还以为已经被禁止了"}, {"time": 816.0, "speaker": "比格勒", "ja": "理由なく権利を制限することはいたしません", "zh": "我们不会无理由限制他人的权利"}, {"time": 819.0, "speaker": "比格勒", "ja": "開催するか否かはあなた次第です", "zh": "是否举办，由您决定"}, {"time": 823.0, "speaker": "比格勒", "ja": "では", "zh": "那么，告辞"}, {"time": 826.0, "speaker": "芙蓉", "ja": "これで助かったと言えるでしょうか", "zh": "这样就能说是得救了吗？"}, {"time": 831.0, "speaker": "黑键", "ja": "クライデが心配だ", "zh": "我担心白垩"}, {"time": 833.0, "speaker": "黑键", "ja": "事務所に戻ろう", "zh": "回事务所吧"}]}, {"title": "Mit ganzer Kraft", "audio": "mp3/Track13 Mit ganzer Kraft.mp3", "entries": [{"time": 3.0, "speaker": "黑键", "ja": "クライデはまだ目覚めていない", "zh": "白垩还没有醒来"}, {"time": 6.0, "speaker": "黑键", "ja": "やはり", "zh": "果然"}, {"time": 7.0, "speaker": "黑键", "ja": "音を取り除かないといけないようだ", "zh": "必须把声音除去才行"}, {"time": 9.0, "speaker": "芙蓉", "ja": "合奏することで音を取り除く方法を", "zh": "通过合奏除去声音的方法"}, {"time": 13.0, "speaker": "芙蓉", "ja": "まだ信じているんですか？", "zh": "你还相信吗？"}, {"time": 15.0, "speaker": "黑键", "ja": "信じるほかない", "zh": "只能相信"}, {"time": 17.0, "speaker": "芙蓉", "ja": "そんな……", "zh": "怎么会……"}, {"time": 18.0, "speaker": "芙蓉", "ja": "だって", "zh": "可是"}, {"time": 19.0, "speaker": "芙蓉", "ja": "可能だとしても", "zh": "就算真的能做到"}, {"time": 20.0, "speaker": "芙蓉", "ja": "あなたが犠牲になるんですよ", "zh": "牺牲的也会是你啊"}, {"time": 22.0, "speaker": "黑键", "ja": "できるのであれば", "zh": "如果能做到"}, {"time": 24.0, "speaker": "黑键", "ja": "なぜしない", "zh": "为什么不做？"}, {"time": 29.0, "speaker": "芙蓉", "ja": "分かりました", "zh": "我明白了"}, {"time": 29.0, "speaker": "芙蓉", "ja": "協力します。ですが、私の音に対する知識は", "zh": "我会协助你们。但是，我对“声音”的知识"}, {"time": 35.0, "speaker": "芙蓉", "ja": "ごくわずかで、しかもすべてあの伯爵の口から", "zh": "非常有限，而且全都是从那位伯爵口中"}, {"time": 39.0, "speaker": "芙蓉", "ja": "聞いたものです。真偽のほどは分かりません", "zh": "听来的。真假我也无法判断"}, {"time": 44.0, "speaker": "白垩的爷爷", "ja": "間に合ったようだ", "zh": "看来赶上了"}, {"time": 46.0, "speaker": "芙蓉", "ja": "おじいさん", "zh": "爷爷"}, {"time": 47.0, "speaker": "白垩的爷爷", "ja": "もしも塵界の音についての情報が必要なのじゃったら、ここに計画書もあるぞ", "zh": "如果你们需要关于尘界之音的情报，这里还有计划书"}, {"time": 52.0, "speaker": "黑键", "ja": "まさか、あなたでもビーグラーと同じ……", "zh": "难道连您也和比格勒一样……"}, {"time": 57.0, "speaker": "白垩的爷爷", "ja": "そうだ。あんたらも知っての通り、クライデは当時の計画の生き残りだ", "zh": "没错。如你们所知，白垩是当年那项计划的幸存者"}, {"time": 63.0, "speaker": "白垩的爷爷", "ja": "女帝陛下が、そんな不安要素を野放しにすると思うか？", "zh": "你们觉得女帝陛下会放任这样的不安因素不管吗？"}, {"time": 68.0, "speaker": "白垩的爷爷", "ja": "かわいそうな子だ。こんな老いぼれと共に十数年もさすらった", "zh": "可怜的孩子，和我这个老朽一起漂泊了十几年"}, {"time": 75.0, "speaker": "白垩的爷爷", "ja": "あの子は、わしにとって、本当の孫のようなものなんだ", "zh": "那孩子对我来说，就像真正的孙子一样"}, {"time": 80.0, "speaker": "白垩的爷爷", "ja": "クライデを救えるのであれば、こんなクソみたいな計画なんぞ", "zh": "如果能救白垩，这种狗屁计划"}, {"time": 84.0, "speaker": "白垩的爷爷", "ja": "人に見せたところでどうってことはない", "zh": "给别人看也没什么大不了的"}, {"time": 88.0, "speaker": "芙蓉", "ja": "興奮なさらないでください", "zh": "请不要激动"}, {"time": 91.0, "speaker": "芙蓉", "ja": "まだ体が弱っていますから", "zh": "您的身体还很虚弱"}, {"time": 94.0, "speaker": "芙蓉", "ja": "エーベンホルツさん", "zh": "黑键先生"}, {"time": 96.0, "speaker": "芙蓉", "ja": "この計画書をツェルニーさんに届けてくれませんか？", "zh": "能请你把这份计划书交给车尔尼先生吗？"}, {"time": 101.0, "speaker": "芙蓉", "ja": "私よりきっとツェルニーさんの方が", "zh": "比起我，车尔尼先生一定"}, {"time": 104.0, "speaker": "芙蓉", "ja": "この計画書を理解できるはずです", "zh": "更能理解这份计划书"}, {"time": 107.0, "speaker": "黑键", "ja": "分かった", "zh": "明白了"}, {"time": 109.0, "speaker": "黑键", "ja": "行ってくる", "zh": "我去一趟"}, {"time": 112.0, "speaker": "芙蓉", "ja": "おじいさん、クライデさんは知っているんですか？", "zh": "老先生，白垩先生知道这件事吗？"}, {"time": 117.0, "speaker": "白垩的爷爷", "ja": "話してはおらん。だが、きっと薄々感づいておるだろう", "zh": "我没告诉他。但他想必多少已经察觉到了"}, {"time": 124.0, "speaker": "芙蓉", "ja": "こんなのは、彼にとってあまりにも残酷すぎます", "zh": "这对他来说太残酷了"}, {"time": 129.0, "speaker": "白垩的爷爷", "ja": "残酷か", "zh": "残酷吗"}, {"time": 136.0, "speaker": "车尔尼", "ja": "旋律……この旋律を……", "zh": "旋律……这段旋律……"}, {"time": 140.0, "speaker": "车尔尼", "ja": "塵界の音は巫王が残したものだったのですか", "zh": "尘界之音，是巫王留下的东西吗？"}, {"time": 146.0, "speaker": "车尔尼", "ja": "そういうことだったのか", "zh": "原来是这么回事"}, {"time": 148.0, "speaker": "车尔尼", "ja": "いや、そうとしか考えられない", "zh": "不，只能这样解释"}, {"time": 152.0, "speaker": "车尔尼", "ja": "巫王はリターニアで最も偉大な術師であるというだけでなく", "zh": "巫王不仅是莱塔尼亚最伟大的术师"}, {"time": 157.0, "speaker": "车尔尼", "ja": "最も恐ろしい音楽家でもあります", "zh": "也是最可怕的音乐家"}, {"time": 162.0, "speaker": "车尔尼", "ja": "この計画書が真実なら", "zh": "如果这份计划书属实"}, {"time": 165.0, "speaker": "车尔尼", "ja": "あなた方は彼の作品の延長ということになります", "zh": "你们就相当于他的作品的延伸"}, {"time": 170.0, "speaker": "黑键", "ja": "私たちはあいつの作品などではない", "zh": "我们不是那家伙的作品"}, {"time": 174.0, "speaker": "车尔尼", "ja": "否定する必要はありませんよ", "zh": "没有必要否定"}, {"time": 176.0, "speaker": "车尔尼", "ja": "それに", "zh": "而且"}, {"time": 178.0, "speaker": "车尔尼", "ja": "もしそうだとすれば", "zh": "如果真是这样"}, {"time": 180.0, "speaker": "黑键", "ja": "方法があるのか", "zh": "就有办法了吗？"}, {"time": 182.0, "speaker": "车尔尼", "ja": "オリジムシを追い払った時の再現をしてもらいたいです", "zh": "我希望你们重现驱散源石虫时的情况"}, {"time": 186.0, "speaker": "车尔尼", "ja": "その時に", "zh": "在那个时候"}, {"time": 187.0, "speaker": "车尔尼", "ja": "ご自身の塵界の音を理解した", "zh": "你们理解了自己体内的尘界之音"}, {"time": 191.0, "speaker": "车尔尼", "ja": "そうですね", "zh": "没错吧"}, {"time": 192.0, "speaker": "黑键", "ja": "再現？", "zh": "重现？"}, {"time": 194.0, "speaker": "黑键", "ja": "今か？", "zh": "现在？"}, {"time": 195.0, "speaker": "黑键", "ja": "今がどんな状況か", "zh": "你知道现在"}, {"time": 197.0, "speaker": "黑键", "ja": "分かっているのか", "zh": "是什么状况吗？"}, {"time": 200.0, "speaker": "车尔尼", "ja": "分かっています、あなたよりははっきりと", "zh": "我当然知道，至少比你更清楚"}, {"time": 202.0, "speaker": "黑键", "ja": "しかし……", "zh": "但是……"}, {"time": 204.0, "speaker": "白垩", "ja": "エーベンホルツさん", "zh": "黑键先生"}, {"time": 206.0, "speaker": "白垩", "ja": "ツェルニーさんの言う通りにしましょう", "zh": "就照车尔尼先生说的做吧"}, {"time": 208.0, "speaker": "黑键", "ja": "クライデ？", "zh": "白垩？"}, {"time": 209.0, "speaker": "黑键", "ja": "起きたのか？", "zh": "你醒了吗？"}, {"time": 211.0, "speaker": "黑键", "ja": "一人でここに来たのか？", "zh": "你一个人来这里的吗？"}, {"time": 213.0, "speaker": "白垩", "ja": "ハイビスカスさんに話を聞いて", "zh": "我听芙蓉小姐说了情况"}, {"time": 216.0, "speaker": "白垩", "ja": "ついてきてもらいました", "zh": "让她陪我一起来了"}, {"time": 218.0, "speaker": "黑键", "ja": "合奏には賛成できない er": "车尔尼", "ja": "自らの運命に抗うことか", "zh": "反抗自己的命运吗？"}, {"time": 498.0, "speaker": "车尔尼", "ja": "違う", "zh": "不"}, {"time": 500.0, "speaker": "车尔尼", "ja": "音楽は足掻き", "zh": "音乐是挣扎"}, {"time": 503.0, "speaker": "车尔尼", "ja": "音楽は怒号", "zh": "音乐是怒吼"}, {"time": 505.0, "speaker": "车尔尼", "ja": "音楽は", "zh": "音乐是"}, {"time": 506.0, "speaker": "车尔尼", "ja": "高らかな歌声だ", "zh": "高亢的歌声"}, {"time": 510.0, "speaker": "芙蓉", "ja": "ツェルニーさん、まだ違う", "zh": "车尔尼先生，还不对"}, {"time": 514.0, "speaker": "芙蓉", "ja": "聞こえていない……", "zh": "他听不见（我说话）……"}, {"time": 516.0, "speaker": "白垩", "ja": "僕たちは休みましょう", "zh": "我们休息吧"}, {"time": 518.0, "speaker": "白垩", "ja": "エーベンホルツさん", "zh": "黑键先生"}, {"time": 519.0, "speaker": "", "ja": "だが……", "zh": "但是……"}, {"time": 520.0, "speaker": "白垩", "ja": "ここにはもう僕たちは必要ありません", "zh": "这里已经不需要我们了"}, {"time": 523.0, "speaker": "白垩", "ja": "僕たちがすべきなのは", "zh": "我们现在该做的"}, {"time": 525.0, "speaker": "白垩", "ja": "体力を養いつつ", "zh": "是保存体力"}, {"time": 527.0, "speaker": "白垩", "ja": "ツェルニーさんが新曲を書き上げるのを待つことです", "zh": "等待车尔尼先生完成新曲"}, {"time": 532.0, "speaker": "黑键", "ja": "ハイビスカス", "zh": "芙蓉"}, {"time": 534.0, "speaker": "黑键", "ja": "彼のことを頼む", "zh": "他就拜托你了"}, {"time": 538.0, "speaker": "芙蓉", "ja": "絶対に私より先に倒れさせはしません", "zh": "我绝不会让他倒在我前面"}, {"time": 541.0, "speaker": "芙蓉", "ja": "行ってください", "zh": "请去吧"}, {"time": 543.0, "speaker": "车尔尼", "ja": "持っていけ！", "zh": "拿走吧！"}, {"time": 545.0, "speaker": "车尔尼", "ja": "すべて持っていくのだ！", "zh": "把一切都拿走吧！"}, {"time": 549.0, "speaker": "车尔尼", "ja": "彼のすべてを持ち去る！", "zh": "将他的全部都带走！"}, {"time": 552.0, "speaker": "车尔尼", "ja": "今日こそ、ツェルニーの命日だ！", "zh": "今天，正是车尔尼的忌日！"}, {"time": 557.0, "speaker": "车尔尼", "ja": "だが、ツェルニーの音楽は", "zh": "但是，车尔尼的音乐"}, {"time": 560.0, "speaker": "车尔尼", "ja": "永遠に死ぬことはない！", "zh": "永远不会死去！"}, {"time": 565.0, "speaker": "车尔尼", "ja": "夜が……明けてゆく", "zh": "夜……正在破晓"}, {"time": 576.0, "speaker": "车尔尼", "ja": "できた", "zh": "完成了"}, {"time": 578.0, "speaker": "车尔尼", "ja": "やりましたね、ツェルニーさん！", "zh": "你成功了，车尔尼先生！"}]}, {"title": "Zum Tempo", "audio": "mp3/Track14 Zum Tempo.mp3", "entries": [{"time": 1.0, "speaker": "工作人员", "ja": "皆様、先にご入場ください", "zh": "各位，请先入场"}, {"time": 3.0, "speaker": "工作人员", "ja": "ツェルニーさんは後ほど到着します", "zh": "车尔尼先生稍后会到"}, {"time": 6.0, "speaker": "观众", "ja": "嘘ではないでしょうね", "zh": "你们没有说谎吧？"}, {"time": 8.0, "speaker": "观众", "ja": "私たちがホールに入るなり扉を閉めて", "zh": "不会等我们一进音乐厅就关上大门"}, {"time": 12.0, "speaker": "观众", "ja": "それからツェルニー氏が来られなくなったと発表したりは……", "zh": "然后再宣布车尔尼先生无法到场吧……"}, {"time": 16.0, "speaker": "工作人员", "ja": "ご安心を", "zh": "请放心"}, {"time": 17.0, "speaker": "工作人员", "ja": "そのような事態は絶対に起こりません", "zh": "绝不会发生那种情况"}, {"time": 20.0, "speaker": "工作人员", "ja": "ツェルニーさんはまもなくこのアフターグローホールに到着します", "zh": "车尔尼先生很快就会抵达夕照音乐厅"}, {"time": 31.0, "speaker": "黑键", "ja": "どうだ？", "zh": "怎么样？"}, {"time": 32.0, "speaker": "白垩", "ja": "息はぴったりだったと思います", "zh": "我觉得我们配合得很默契"}, {"time": 35.0, "speaker": "白垩", "ja": "この楽曲は僕たちのために作られたものですが", "zh": "这首曲子是为我们创作的"}, {"time": 39.0, "speaker": "白垩", "ja": "ツェルニーさんのスタイルもとても色濃くて", "zh": "但其中也有很浓厚的车尔尼先生的风格"}, {"time": 41.0, "speaker": "白垩", "ja": "『夕べの夜明け』に少しも劣らないと思います", "zh": "我觉得丝毫不逊于《夕暮的黎明》"}, {"time": 45.0, "speaker": "黑键", "ja": "たった一晩で……", "zh": "只用了一晚……"}, {"time": 47.0, "speaker": "黑键", "ja": "彼はすごい人だ", "zh": "他真是了不起的人"}, {"time": 51.0, "speaker": "白垩", "ja": "どうした？", "zh": "怎么了？"}, {"time": 52.0, "speaker": "黑键", "ja": "あなたが人を褒めるなんて、珍しいなって", "zh": "只是觉得你会夸人，真少见"}, {"time": 56.0, "speaker": "黑键", "ja": "私は彼の音楽に対する造詣を過小評価したことは一度もないぞ", "zh": "我可从未低估过他对音乐的造诣"}, {"time": 62.0, "speaker": "黑键", "ja": "今は彼が演奏に間に合うことを望むだけだ", "zh": "现在只希望他能赶上演奏"}, {"time": 66.0, "speaker": "白垩", "ja": "来ますよ", "zh": "他会来的"}, {"time": 67.0, "speaker": "白垩", "ja": "楽譜を実際の音楽に変えてこそ、この曲が本当に完成したと言えますから", "zh": "只有把乐谱变成真正的音乐，这首曲子才算真正完成"}, {"time": 74.0, "speaker": "白垩", "ja": "フィナーレの曲目が変更になったという情報は既に出ています", "zh": "终曲曲目变更的消息已经发布了"}, {"time": 78.0, "speaker": "白垩", "ja": "彼は諦めませんよ", "zh": "他不会放弃的"}, {"time": 80.0, "speaker": "黑键", "ja": "そうであればいいな", "zh": "但愿如此"}, {"time": 83.0, "speaker": "白垩", "ja": "そうだ！エーベンホルツさん", "zh": "对了！黑键先生"}, {"time": 85.0, "speaker": "白垩", "ja": "僕の衣装は似合っていますか？", "zh": "我的衣服合适吗？"}, {"time": 88.0, "speaker": "白垩", "ja": "こんな高価な服を着たことがないので", "zh": "我从没穿过这么昂贵的衣服"}, {"time": 91.0, "speaker": "白垩", "ja": "どこか変じゃないですか？", "zh": "会不会哪里很奇怪？"}, {"time": 94.0, "speaker": "黑键", "ja": "よく似合っている", "zh": "很适合你"}, {"time": 95.0, "speaker": "白垩", "ja": "ならよかったです", "zh": "那就好"}, {"time": 98.0, "speaker": "白垩", "ja": "そうだ！エーベンホルツさん", "zh": "对了！黑键先生"}, {"time": 100.0, "speaker": "白垩", "ja": "もう一つ", "zh": "还有一件事"}, {"time": 102.0, "speaker": "黑键", "ja": "今日はいつにも増してよく喋るな", "zh": "你今天比平时还要健谈"}, {"time": 105.0, "speaker": "白垩", "ja": "普段もお喋りだと言いたいんですか？", "zh": "你是想说我平时也很啰嗦吗？"}, {"time": 108.0, "speaker": "黑键", "ja": "少しな", "zh": "有一点"}, {"time": 109.0, "speaker": "白垩", "ja": "我慢してください。これが一緒に演奏する最後の機会かもしれないんですからね", "zh": "请忍耐一下吧。毕竟这也许是我们最后一次一起演奏了"}, {"time": 116.0, "speaker": "黑键", "ja": "そんなことはない", "zh": "不会的"}, {"time": 118.0, "speaker": "白垩", "ja": "どうしてないと思うんです？", "zh": "你为什么觉得不会呢？"}, {"time": 121.0, "speaker": "白垩", "ja": "これが終われば、あなたはウルティカ伯爵に戻り", "zh": "等这一切结束后，你会回去做乌提卡伯爵"}, {"time": 126.0, "speaker": "白垩", "ja": "僕は恐らく、またいろんな場所を渡り歩く日々を続けるでしょう", "zh": "而我大概会继续四处漂泊的日子吧"}, {"time": 132.0, "speaker": "白垩", "ja": "僕たちの出会いはあの女性伯爵の目論みでもありましたが", "zh": "我们的相遇虽然也出于那位女伯爵的谋划"}, {"time": 137.0, "speaker": "白垩", "ja": "一番最初はただの偶然です", "zh": "但最初只是偶然"}, {"time": 141.0, "speaker": "白垩", "ja": "違いますか？", "zh": "不是吗？"}, {"time": 143.0, "speaker": "黑键", "ja": "だが……", "zh": "可是……"}, {"time": 144.0, "speaker": "白垩", "ja": "だが、僕たちはもう友人だ", "zh": "可是，我们已经是朋友了"}, {"time": 147.0, "speaker": "白垩", "ja": "そう言いたいんですよね", "zh": "你是想这么说，对吧？"}, {"time": 150.0, "speaker": "黑键", "ja": "ああ", "zh": "嗯"}, {"time": 151.0, "speaker": "白垩", "ja": "友人にも別れはあります", "zh": "朋友之间也会分别"}, {"time": 155.0, "speaker": "白垩", "ja": "それに、今回の別れは、とてもとても長くなるかもしれません", "zh": "而且这一次分别，也许会非常、非常漫长"}, {"time": 163.0, "speaker": "白垩", "ja": "僕が言ったことを覚えていますか？", "zh": "你还记得我说过的话吗？"}, {"time": 167.0, "speaker": "白垩", "ja": "お互いを忘れないために記念品を送り合いましょう", "zh": "为了不忘记彼此，我们互赠纪念品吧"}, {"time": 171.0, "speaker": "白垩", "ja": "僕には、前に言ったように、コインに穴を開けたもので十分です", "zh": "给我的话，就像之前说的那样，一枚打孔的硬币就足够了"}, {"time": 177.0, "speaker": "黑键", "ja": "では、君は、私に何をくれる？", "zh": "那么，你要送我什么？"}, {"time": 183.0, "speaker": "白垩", "ja": "まだ考え中です", "zh": "我还在想"}, {"time": 188.0, "speaker": "黑键", "ja": "ゆっくり考えるといい", "zh": "慢慢想就好"}, {"time": 190.0, "speaker": "黑键", "ja": "今日を乗り越えれば、時間はまだある", "zh": "只要度过今天，我们还有时间"}, {"time": 195.0, "speaker": "白垩", "ja": "そうですね", "zh": "是啊"}, {"time": 197.0, "speaker": "白垩", "ja": "まだ時間があります", "zh": "还有时间"}, {"time": 202.0, "speaker": "芙蓉", "ja": "結論から言うと", "zh": "先说结论"}, {"time": 204.0, "speaker": "芙蓉", "ja": "あなたの体は現在とても悪い状態にあります", "zh": "你现在的身体状况非常糟糕"}, {"time": 209.0, "speaker": "芙蓉", "ja": "医者として", "zh": "作为医生"}, {"time": 210.0, "speaker": "芙蓉", "ja": "コンサートホールで演奏することを止めるべきです", "zh": "我应该阻止你在音乐厅演奏"}, {"time": 213.0, "speaker": "车尔尼", "ja": "止めようとしているようには見えませんが", "zh": "但你看起来并不打算阻止我"}, {"time": 217.0, "speaker": "芙蓉", "ja": "あなたが命を燃やして創作した楽曲が", "zh": "我不希望你燃烧生命创作出的乐曲"}, {"time": 221.0, "speaker": "芙蓉", "ja": "お蔵入りになってほしくはないんです", "zh": "就这样被束之高阁"}, {"time": 225.0, "speaker": "车尔尼", "ja": "どうやら", "zh": "看来"}, {"time": 227.0, "speaker": "车尔尼", "ja": "少しは融通が利くようになったみたいですね", "zh": "你似乎也稍微学会变通了"}, {"time": 231.0, "speaker": "芙蓉", "ja": "正しいことでも", "zh": "我只是明白了"}, {"time": 233.0, "speaker": "芙蓉", "ja": "時には優先順位が存在するということが分かっただけです", "zh": "即便是正确的事，有时也存在优先顺序"}, {"time": 238.0, "speaker": "车尔尼", "ja": "そうですか", "zh": "是吗"}, {"time": 243.0, "speaker": "车尔尼", "ja": "では", "zh": "那么"}, {"time": 243.0, "speaker": "车尔尼", "ja": "アフターグローホールまで肩を貸してくれませんか", "zh": "能扶我到夕照音乐厅吗？"}, {"time": 249.0, "speaker": "芙蓉", "ja": "もちろんです。私は医者ですから", "zh": "当然。我是医生"}, {"time": 253.0, "speaker": "芙蓉", "ja": "あなたの健康だけでなく、心も蔑ろにはしません", "zh": "不只你的健康，你的心意我也不会轻视"}, {"time": 262.0, "speaker": "乌尔苏拉", "ja": "あれをご覧なさいな、密偵さん", "zh": "请看那边，密探先生"}, {"time": 266.0, "speaker": "乌尔苏拉", "ja": "アフターグロー区の大英雄、我らが大音楽家", "zh": "夕照区的大英雄，我们的大音乐家"}, {"time": 272.0, "speaker": "乌尔苏拉", "ja": "ツェルニー氏の登場ですわ", "zh": "车尔尼先生登场了"}, {"time": 275.0, "speaker": "乌尔苏拉", "ja": "誰かに支えられて", "zh": "他被人搀扶着"}, {"time": 278.0, "speaker": "乌尔苏拉", "ja": "ようやく歩けている様子", "zh": "看起来好不容易才能走动"}, {"time": 283.0, "speaker": "乌尔苏拉", "ja": "さすが", "zh": "不愧是他"}, {"time": 285.0, "speaker": "乌尔苏拉", "ja": "彼らしいですわね", "zh": "很有他的风格呢"}, {"time": 288.0, "speaker": "比格勒", "ja": "ここからこんなにはっきりと", "zh": "没想到从这里竟能如此清楚地"}, {"time": 290.0, "speaker": "比格勒", "ja": "アフターグローホールを監視できるとは", "zh": "监视夕照音乐厅"}, {"time": 294.0, "speaker": "乌尔苏拉", "ja": "そのために", "zh": "正是为此"}, {"time": 295.0, "speaker": "乌尔苏拉", "ja": "わざわざ買い上げたものですもの", "zh": "我才特意买下了这里"}, {"time": 298.0, "speaker": "乌尔苏拉", "ja": "ここはアフターグロー区の外ではありますが、コンサートホールの演奏をはっきりと聞くことができるのですわ", "zh": "这里虽然在夕照区之外，却能清楚听见音乐厅里的演奏"}, {"time": 309.0, "speaker": "乌尔苏拉", "ja": "私はここでコンサートを聞くのを好んでおります", "zh": "我喜欢在这里听音乐会"}, {"time": 313.0, "speaker": "乌尔苏拉", "ja": "そうすれば彼が私を見ることはないし、私も彼に会わなくて済みますもの", "zh": "这样一来，他不会看见我，我也不用见到他"}, {"time": 324.0, "speaker": "乌尔苏拉", "ja": "密偵さん", "zh": "密探先生"}, {"time": 327.0, "speaker": "乌尔苏拉", "ja": "ツェルニーはお好き？", "zh": "你喜欢车尔尼吗？"}, {"time": 329.0, "speaker": "比格勒", "ja": "尊敬しています", "zh": "我尊敬他"}, {"time": 331.0, "speaker": "比格勒", "ja": "このような年に", "zh": "在这样的年纪"}, {"time": 333.0, "speaker": "比格勒", "ja": "彼のような傑出した音楽家が現れるとは", "zh": "还能出现像他这样杰出的音乐家"}, {"time": 336.0, "speaker": "比格勒", "ja": "実に驚きです", "zh": "实在令人惊讶"}, {"time": 338.0, "speaker": "乌尔苏拉", "ja": "そうですわよね", "zh": "是啊"}, {"time": 341.0, "speaker": "乌尔苏拉", "ja": "当然そう", "zh": "当然是这样"}, {"time": 343.0, "speaker": "乌尔苏拉", "ja": "純粋な音楽家が嫌いな人などいませんもの", "zh": "没有人会讨厌纯粹的音乐家"}, {"time": 348.0, "speaker": "乌尔苏拉", "ja": "私でさえ", "zh": "就连我"}, {"time": 350.0, "speaker": "乌尔苏拉", "ja": "ずっと彼のことが好きでしたもの", "zh": "也一直喜欢着他"}, {"time": 355.0, "speaker": "乌尔苏拉", "ja": "そういう意味ではありませんわ", "zh": "当然，不是那种意思"}, {"time": 357.0, "speaker": "乌尔苏拉", "ja": "それに、もしそうだったとしても", "zh": "而且，就算真是那种意思"}, {"time": 362.0, "speaker": "乌尔苏拉", "ja": "私にはチャンスなんてありませんもの", "zh": "我也没有任何机会"}, {"time": 364.0, "speaker": "比格勒", "ja": "それであなたは、感染者地区から生まれた感染者大音楽家", "zh": "所以你才把他包装成“出身感染者地区的感染者大音乐家”"}, {"time": 370.0, "speaker": "比格勒", "ja": "などという大文句で彼を貴族の前に押し出してピエロにしたと", "zh": "用这种夸张名号把他推到贵族面前，让他成了小丑"}, {"time": 377.0, "speaker": "比格勒", "ja": "随分とひねくれた愛情表現ですね", "zh": "还真是扭曲的爱意表达呢"}, {"time": 381.0, "speaker": "乌尔苏拉", "ja": "どうやらあなたは、この都市に愛着をお持ちでいらっしゃるようですわね", "zh": "看来你对这座城市很有感情呢"}, {"time": 386.0, "speaker": "乌尔苏拉", "ja": "密偵さん", "zh": "密探先生"}, {"time": 389.0, "speaker": "比格勒", "ja": "あなたは先ほどからずっと話題を逸らしていますね", "zh": "你从刚才开始就一直在转移话题"}, {"time": 394.0, "speaker": "乌尔苏拉", "ja": "あら、私ったら", "zh": "哎呀，你看我"}, {"time": 397.0, "speaker": "乌尔苏拉", "ja": "ツェルニーの話になると、つい止まらなくなってしまいますわ", "zh": "一说到车尔尼，我就总是停不下来"}, {"time": 403.0, "speaker": "乌尔苏拉", "ja": "どこまでお話ししたかしら", "zh": "我说到哪里了来着？"}, {"time": 406.0, "speaker": "乌尔苏拉", "ja": "そうそう。我が一族が落ちぶれ", "zh": "对了。说到我的家族没落"}, {"time": 411.0, "speaker": "乌尔苏拉", "ja": "父は巫王派の残党と夢に耽って死に", "zh": "父亲沉溺于与巫王派残党的妄想，最终死去"}, {"time": 415.0, "speaker": "乌尔苏拉", "ja": "その後を継いだ私の兄", "zh": "继承他位置的我的兄长"}, {"time": 418.0, "speaker": "乌尔苏拉", "ja": "彼の死因をあなた方はまだ特定できていなかった", "zh": "而你们到现在还没查明他的死因"}, {"time": 423.0, "speaker": "乌尔苏拉", "ja": "でしたか", "zh": "是这样吧"}, {"time": 426.0, "speaker": "乌尔苏拉", "ja": "無理もないわ", "zh": "那也难怪"}, {"time": 428.0, "speaker": "乌尔苏拉", "ja": "だって、私が兄を殺したんですもの", "zh": "因为是我杀了兄长"}, {"time": 431.0, "speaker": "比格勒", "ja": "兄を殺した？", "zh": "你杀了自己的兄长？"}, {"time": 435.0, "speaker": "乌尔苏拉", "ja": "ええ", "zh": "是啊"}, {"time": 436.0, "speaker": "乌尔苏拉", "ja": "無能で愚か、背後にいる者の情報すら漏らすところだった兄", "zh": "那个无能又愚蠢、甚至差点泄露幕后之人情报的兄长"}, {"time": 443.0, "speaker": "乌尔苏拉", "ja": "いずれ処分されるのなら、私が幕を下ろすのはむしろ慈悲ですわ", "zh": "既然他迟早都会被处理，那么由我为他落幕，反倒算是慈悲"}, {"time": 452.0, "speaker": "比格勒", "ja": "その背後にいる者とは一体誰なんです", "zh": "那个幕后之人究竟是谁？"}, {"time": 458.0, "speaker": "乌尔苏拉", "ja": "あらあら、密偵さん、ご存知かしら？", "zh": "哎呀呀，密探先生，你知道吗？"}, {"time": 462.0, "speaker": "乌尔苏拉", "ja": "私の方が、あなたよりもずっとその答えを知りたいと思っていますのよ？", "zh": "我比你更想知道那个答案呢"}, {"time": 470.0, "speaker": "乌尔苏拉", "ja": "何にせよ、我々の運命も、私の運命も", "zh": "无论如何，我们的命运也好，我的命运也好"}, {"time": 477.0, "speaker": "乌尔苏拉", "ja": "勝手に書き換えられる方々ですわ", "zh": "都是会被那些人随意改写的"}, {"time": 481.0, "speaker": "乌尔苏拉", "ja": "私、ずっと支配されて、怯えることしかできないまま", "zh": "我一直被支配，只能恐惧"}, {"time": 487.0, "speaker": "乌尔苏拉", "ja": "十五年も耐え忍んできましたの。十五年も", "zh": "就这样忍耐了十五年。整整十五年"}, {"time": 493.0, "speaker": "比格勒", "ja": "とぼけて時間稼ぎをするつもりですか、ストロッロ伯爵", "zh": "你是打算装傻拖延时间吗，斯特罗洛伯爵？"}, {"time": 499.0, "speaker": "乌尔苏拉", "ja": "ねえ、ツェルニーの演奏はまだなのかしら", "zh": "我说，车尔尼的演奏还没开始吗？"}, {"time": 507.0, "speaker": "白垩", "ja": "ツェルニーさん、もう大丈夫ですか？", "zh": "车尔尼先生，已经没问题了吗？"}, {"time": 511.0, "speaker": "车尔尼", "ja": "大丈夫と言ったら嘘になりますが、演奏はできます", "zh": "说没问题就是撒谎了，但我还能演奏"}, {"time": 516.0, "speaker": "车尔尼", "ja": "それよりも、練習は進んでますか", "zh": "比起这个，你们练习得怎么样？"}, {"time": 519.0, "speaker": "黑键", "ja": "当然だ", "zh": "当然"}, {"time": 520.0, "speaker": "车尔尼", "ja": "よろしい", "zh": "很好"}, {"time": 522.0, "speaker": "车尔尼", "ja": "求めるレベルに達していないなら", "zh": "如果你们达不到我要求的水准"}, {"time": 524.0, "speaker": "车尔尼", "ja": "容赦なく振り落としていきますよ", "zh": "我会毫不留情地把你们甩下去"}, {"time": 527.0, "speaker": "黑键", "ja": "貴殿こそ", "zh": "你才是"}, {"time": 528.0, "speaker": "黑键", "ja": "遅れを取って体調を言い訳にしないことだ", "zh": "可别落后了还拿身体状况当借口"}, {"time": 531.0, "speaker": "白垩", "ja": "ほらほら", "zh": "好了好了"}, {"time": 532.0, "speaker": "白垩", "ja": "舞台へ上がる準備をしましょう", "zh": "准备上台吧"}, {"time": 535.0, "speaker": "白垩", "ja": "僕たち自身のために", "zh": "为了我们自己"}, {"time": 537.0, "speaker": "白垩", "ja": "聴衆のために", "zh": "也为了听众"}, {"time": 538.0, "speaker": "黑键", "ja": "今日は最高のパフォーマンスをしなければなりません", "zh": "今天必须献上最好的演出"}, {"time": 541.0, "speaker": "黑键", "ja": "クライデ", "zh": "白垩"}, {"time": 543.0, "speaker": "黑键", "ja": "やはり君は今日、やけに興奮していないか", "zh": "你今天果然异常兴奋吧"}, {"time": 546.0, "speaker": "白垩", "ja": "そうでしょうか", "zh": "是吗？"}, {"time": 549.0, "speaker": "白垩", "ja": "もしかしたら、初めて生きている価値というものを感じたからかもしれません", "zh": "也许是因为，我第一次感受到了活着的价值吧"}, {"time": 557.0, "speaker": "工作人员", "ja": "ツェルニーさん、出番です", "zh": "车尔尼先生，到您出场了"}, {"time": 559.0, "speaker": "黑键", "ja": "そうだ、ミスター・ツェルニー", "zh": "对了，车尔尼先生"}, {"time": 562.0, "speaker": "黑键", "ja": "この曲の名は、まだ聞いていない", "zh": "这首曲子的名字，我还没听说"}, {"time": 565.0, "speaker": "车尔尼", "ja": "ご心配なく、来る途中で決めましたよ", "zh": "不用担心，我在来的路上已经决定了"}, {"time": 571.0, "speaker": "车尔尼", "ja": "曲の名は……", "zh": "曲名是……"}, {"time": 574.0, "speaker": "车尔尼", "ja": "光栄", "zh": "光荣"}]}, {"title": "運命", "audio": "mp3/Track15 運命.mp3", "entries": [{"time": 1.0, "speaker": "工作人员", "ja": "続きまして、ツェルニー、エーベンホルツ、クライデによる本日最後の曲です", "zh": "接下来，是由车尔尼、黑键、克莱德带来的今日最后一曲"}, {"time": 9.0, "speaker": "工作人员", "ja": "皆様もご存知の通り、この曲はツェルニー氏の最新作であり、このステージが初披露となります", "zh": "正如各位所知，这首曲子是车尔尼先生的最新作品，也将在这个舞台上首次演出"}, {"time": 18.0, "speaker": "工作人员", "ja": "曲名は、変ロ短調、フルート、チェロ、ピアノ三重奏、『光栄』", "zh": "曲名为，降B小调，长笛、大提琴与钢琴三重奏，《光荣》"}, {"time": 37.0, "speaker": "格特鲁德", "ja": "彼らの演奏が始まりましたわね", "zh": "他们的演奏开始了呢"}, {"time": 41.0, "speaker": "格特鲁德", "ja": "分かっていましたわ", "zh": "我早就知道"}, {"time": 43.0, "speaker": "格特鲁德", "ja": "あなたは絶対に彼らを助ける方法を見つけ出すと", "zh": "你一定会找到拯救他们的方法"}, {"time": 48.0, "speaker": "格特鲁德", "ja": "そう、そんなこと、とっくに", "zh": "是啊，这种事，我早就知道了"}, {"time": 53.0, "speaker": "格特鲁德", "ja": "この新曲のインスピレーションが巫王によってもたらされたなんて、あの聴衆たちに想像できるかしら", "zh": "这首新曲的灵感竟是由巫王带来的，那些听众能想象得到吗？"}, {"time": 64.0, "speaker": "格特鲁德", "ja": "分かるわけありませんわね", "zh": "他们当然不可能知道"}, {"time": 67.0, "speaker": "格特鲁德", "ja": "だってツェルニー、これはもうあなたの曲ですもの", "zh": "毕竟，车尔尼，这已经是你的曲子了"}, {"time": 74.0, "speaker": "格特鲁德", "ja": "そう", "zh": "没错"}, {"time": 75.0, "speaker": "格特鲁德", "ja": "二つの塵界の音を引っ張り出そうというのね", "zh": "你是打算把两道尘界之音都引出来吧"}, {"time": 80.0, "speaker": "格特鲁德", "ja": "素晴らしく勇敢ですこと", "zh": "真是勇敢得令人赞叹"}, {"time": 83.0, "speaker": "格特鲁德", "ja": "ですが、引っ張り出した後はどうなさるおつもりですの？", "zh": "可是，把它们引出来之后，你打算怎么办呢？"}, {"time": 88.0, "speaker": "格特鲁德", "ja": "まさかご自分をその器にするとでも？", "zh": "难道你打算让自己成为那个容器吗？"}, {"time": 92.0, "speaker": "比格勒", "ja": "そろそろ私も我慢の限界ですよ、ストロッロ伯爵", "zh": "斯特罗洛伯爵，我也差不多忍到极限了"}, {"time": 98.0, "speaker": "格特鲁德", "ja": "ツェルニーは私を憎んでおりますの", "zh": "车尔尼憎恨我"}, {"time": 102.0, "speaker": "格特鲁德", "ja": "不純な私を", "zh": "憎恨这个不纯粹的我"}, {"time": 105.0, "speaker": "格特鲁德", "ja": "彼が愛するものを道具としてしまう私のことを", "zh": "憎恨这个把他所爱之物当成工具的我"}, {"time": 109.0, "speaker": "格特鲁德", "ja": "彼は憎悪しておりますの", "zh": "他对我怀有憎恶"}, {"time": 114.0, "speaker": "格特鲁德", "ja": "肉親を殺めた人間が", "zh": "一个杀害血亲的人"}, {"time": 117.0, "speaker": "格特鲁德", "ja": "自分を十年以上支配してきたクズどもへの復讐心に満ちた人間が", "zh": "一个对支配自己十多年的垃圾满怀复仇之心的人"}, {"time": 124.0, "speaker": "格特鲁德", "ja": "どうすれば純粋になんて", "zh": "又怎么可能变得纯粹呢？"}, {"time": 127.0, "speaker": "格特鲁德", "ja": "なれるのかしら", "zh": "怎么可能呢"}, {"time": 128.0, "speaker": "比格勒", "ja": "今、復讐と言いましたか", "zh": "你刚才说了复仇吗？"}, {"time": 130.0, "speaker": "格特鲁德", "ja": "あらゆる手を使って", "zh": "我动用了所有手段"}, {"time": 132.0, "speaker": "格特鲁德", "ja": "できる限り", "zh": "尽可能地"}, {"time": 134.0, "speaker": "格特鲁德", "ja": "あのホールに集めましたわ。法も女帝も恐れぬ罪深き者たち", "zh": "把那些不畏法律、不畏女帝的罪人们，尽量聚集到了那座音乐厅里"}, {"time": 140.0, "speaker": "格特鲁德", "ja": "余罪もたっぷりあるでしょう。感謝をしてくださいな", "zh": "他们想必还有不少余罪。你该感谢我才是"}, {"time": 145.0, "speaker": "格特鲁德", "ja": "塵界の音は、私が私の人生の支配者に抵抗するための唯一のナイフですわ", "zh": "尘界之音，是我反抗那些支配我人生之人的唯一刀刃"}, {"time": 154.0, "speaker": "格特鲁德", "ja": "彼らが興味を持ちそうなものを、父の遺産からようやく掘り出した", "zh": "我终于从父亲的遗产里，挖出了那些人会感兴趣的东西"}, {"time": 161.0, "speaker": "格特鲁德", "ja": "けれど、私はもう限界ですのよ", "zh": "可是，我已经到极限了"}, {"time": 166.0, "speaker": "格特鲁德", "ja": "増幅器を取り外したところで", "zh": "就算拆除了增幅器"}, {"time": 169.0, "speaker": "格特鲁德", "ja": "ホール内へ施した増幅の改造は依然そのまま", "zh": "音乐厅内部被施加的增幅改造依旧存在"}, {"time": 173.0, "speaker": "格特鲁德", "ja": "聴衆へは影響が及びますわ", "zh": "影响依然会波及听众"}, {"time": 177.0, "speaker": "格特鲁德", "ja": "そして、一度塵界の音を引き出せば", "zh": "而一旦引出尘界之音"}, {"time": 180.0, "speaker": "格特鲁德", "ja": "それが手に負えないことが分かるでしょう", "zh": "他们就会明白那根本无法控制"}, {"time": 184.0, "speaker": "格特鲁德", "ja": "ツェルニーたちは今頃、演奏をやめたくても", "zh": "现在的车尔尼他们，就算想停止演奏"}, {"time": 187.0, "speaker": "格特鲁德", "ja": "やめられない状態でしょうね", "zh": "也已经停不下来了吧"}, {"time": 189.0, "speaker": "比格勒", "ja": "まさか、それが真の目的……", "zh": "难道说，这才是真正的目的……"}, {"time": 192.0, "speaker": "比格勒", "ja": "ラハマンも各所の仕掛けも目くらましで", "zh": "拉赫曼也好，各处的机关也好，都只是障眼法"}, {"time": 194.0, "speaker": "比格勒", "ja": "わざと私たちに見つけさせたのですか", "zh": "是你故意让我们发现的吗？"}, {"time": 196.0, "speaker": "格特鲁德", "ja": "塵界の音の旋律と共鳴は", "zh": "尘界之音的旋律与共鸣"}, {"time": 200.0, "speaker": "格特鲁德", "ja": "私が拡張いたしました", "zh": "已经被我扩张了"}, {"time": 203.0, "speaker": "格特鲁德", "ja": "その器になるため自らを差し出そうとする者が誰であろうと", "zh": "无论是谁想献出自己成为容器"}, {"time": 208.0, "speaker": "格特鲁德", "ja": "通常の数百倍の混乱と無秩序に直面しなければなりません", "zh": "都必须面对通常数百倍的混乱与无序"}, {"time": 214.0, "speaker": "格特鲁德", "ja": "器を見つけられない塵界の音は", "zh": "找不到容器的尘界之音"}, {"time": 217.0, "speaker": "格特鲁德", "ja": "巫王が建造したコンサートホール内の", "zh": "会在巫王建造的音乐厅内"}, {"time": 220.0, "speaker": "格特鲁德", "ja": "あらゆるものを飲み込む穴となり", "zh": "化作吞噬一切的空洞"}, {"time": 222.0, "speaker": "格特鲁德", "ja": "ホール内にいる者たちは例外なく", "zh": "而音乐厅里的所有人"}, {"time": 226.0, "speaker": "格特鲁德", "ja": "その中に落ちるでしょう", "zh": "都会无一例外地坠入其中"}, {"time": 233.0, "speaker": "车尔尼", "ja": "エーベンホルツさん！", "zh": "黑键先生！"}, {"time": 235.0, "speaker": "车尔尼", "ja": "馬鹿な真似はやめなさい！", "zh": "不要做傻事！"}, {"time": 237.0, "speaker": "车尔尼", "ja": "強引に流れをねじ曲げて", "zh": "强行扭转那股流向"}, {"time": 238.0, "speaker": "车尔尼", "ja": "自分の中に収めるのは危険です！", "zh": "把它收进自己体内太危险了！"}, {"time": 241.0, "speaker": "车尔尼", "ja": "やめなさい！", "zh": "快停下！"}, {"time": 242.0, "speaker": "黑键", "ja": "ほんの少し", "zh": "只要一点点"}, {"time": 243.0, "speaker": "黑键", "ja": "二人のために時間を稼ぐだけで構わない", "zh": "只要为他们争取一点时间就够了"}, {"time": 245.0, "speaker": "白垩", "ja": "エーベンホルツさん……", "zh": "黑键先生……"}, {"time": 252.0, "speaker": "白垩", "ja": "自分の人生とは何なんだと思ったこともある", "zh": "我也曾想过，自己的人生到底算什么"}, {"time": 257.0, "speaker": "白垩", "ja": "何かに追われるように各地を転々としてばかりで", "zh": "像是被什么追赶一样，只能辗转各地"}, {"time": 260.0, "speaker": "白垩", "ja": "おじいさんのそば以外のところにも", "zh": "除了爷爷身边"}, {"time": 263.0, "speaker": "白垩", "ja": "僕の居場所はなかった", "zh": "我没有任何容身之处"}, {"time": 266.0, "speaker": "白垩", "ja": "どれだけ気持ちを差し出し", "zh": "无论我付出多少心意"}, {"time": 268.0, "speaker": "白垩", "ja": "丁寧に言葉を尽くしても", "zh": "无论我多么认真地组织语言"}, {"time": 270.0, "speaker": "白垩", "ja": "僕には得られないものがあった", "zh": "都有些东西是我得不到的"}, {"time": 275.0, "speaker": "白垩", : "必须要做"}, {"time": 1019.0, "speaker": "白垩", "ja": "それは", "zh": "那就是"}, {"time": 1021.0, "speaker": "白垩", "ja": "あらゆる手段を用いて", "zh": "用尽一切手段"}, {"time": 1024.0, "speaker": "白垩", "ja": "僕を止めること", "zh": "阻止我"}, {"time": 1027.0, "speaker": "白垩", "ja": "僕に", "zh": "不要让我"}, {"time": 1029.0, "speaker": "白垩", "ja": "この都市を破壊させないで", "zh": "毁掉这座城市"}, {"time": 1032.0, "speaker": "白垩", "ja": "いいですか", "zh": "可以吗？"}, {"time": 1034.0, "speaker": "黑键", "ja": "分かった", "zh": "我明白了"}, {"time": 1038.0, "speaker": "白垩", "ja": "その眼差し", "zh": "你的眼神"}, {"time": 1041.0, "speaker": "白垩", "ja": "見違えるようです", "zh": "已经焕然一新了"}, {"time": 1046.0, "speaker": "白垩", "ja": "間もなく最後の時が訪れる", "zh": "最后的时刻即将到来"}, {"time": 1051.0, "speaker": "白垩", "ja": "敬愛すべき貴族閣下", "zh": "可敬的贵族阁下"}, {"time": 1054.0, "speaker": "白垩", "ja": "親愛なる感染者の兄弟たちよ", "zh": "亲爱的感染者兄弟们"}, {"time": 1059.0, "speaker": "白垩", "ja": "そして", "zh": "还有"}, {"time": 1059.0, "speaker": "白垩", "ja": "エーベンホルツ", "zh": "黑键"}, {"time": 1062.0, "speaker": "白垩", "ja": "聞くがよい", "zh": "听好了"}, {"time": 1064.0, "speaker": "白垩", "ja": "我が最後の演奏", "zh": "这是我最后的演奏"}, {"time": 1068.0, "speaker": "白垩", "ja": "我がために失意を", "zh": "为我献上失意"}, {"time": 1069.0, "speaker": "白垩", "ja": "喝采を", "zh": "献上喝彩"}, {"time": 1070.0, "speaker": "白垩", "ja": "悲嘆を", "zh": "献上悲叹"}, {"time": 1070.0, "speaker": "白垩", "ja": "陶酔を、喝采を！", "zh": "献上陶醉与喝彩！"}, {"time": 1074.0, "speaker": "白垩", "ja": "なぜなら今日、我は死に", "zh": "因为今日，我将死去"}, {"time": 1078.0, "speaker": "白垩", "ja": "そして貴様は", "zh": "而你"}, {"time": 1080.0, "speaker": "白垩", "ja": "生まれ変わるのだ！", "zh": "将获得新生！"}, {"time": 1087.0, "speaker": "白垩的爷爷", "ja": "この馬鹿者", "zh": "你这个傻孩子"}, {"time": 1089.0, "speaker": "白垩的爷爷", "ja": "大馬鹿者め", "zh": "大傻瓜"}, {"time": 1092.0, "speaker": "白垩的爷爷", "ja": "こんなことをする必要などなかったのに", "zh": "你根本没必要做到这种地步"}, {"time": 1096.0, "speaker": "白垩的爷爷", "ja": "この大地はお前にあんなにも残酷だったんだ", "zh": "这片大地对你如此残酷"}, {"time": 1100.0, "speaker": "白垩的爷爷", "ja": "なのになぜ、ここまでする必要がある？", "zh": "可你为什么还要做到这种地步？"}, {"time": 1104.0, "speaker": "芙蓉", "ja": "おじいさん！すぐに離れてください！", "zh": "爷爷！请立刻离开！"}, {"time": 1107.0, "speaker": "芙蓉", "ja": "ここにあるオリジニウムは活性化し続けています！", "zh": "这里的源石还在持续活化！"}, {"time": 1111.0, "speaker": "白垩的爷爷", "ja": "クライデ、わしはここにおるぞ！", "zh": "白垩，我就在这里！"}, {"time": 1115.0, "speaker": "白垩的爷爷", "ja": "もし恨みがあるのなら、わしにぶつけるがいい！", "zh": "如果你心中有怨，就冲我来吧！"}, {"time": 1120.0, "speaker": "白垩的爷爷", "ja": "もう一度、二人で旅をしよう！", "zh": "我们再一起踏上旅途吧！"}, {"time": 1124.0, "speaker": "白垩的爷爷", "ja": "我が愛する孫よ！", "zh": "我亲爱的孙子啊！"}, {"time": 1128.0, "speaker": "黑键", "ja": "おじいさん！", "zh": "爷爷！"}, {"time": 1129.0, "speaker": "芙蓉", "ja": "だめです！", "zh": "不行！"}, {"time": 1130.0, "speaker": "白垩的爷爷", "ja": "おじょうさん、なぜ？", "zh": "小姐，为什么？"}, {"time": 1132.0, "speaker": "芙蓉", "ja": "私が盾になります！", "zh": "我来当盾！"}, {"time": 1134.0, "speaker": "芙蓉", "ja": "エーベンホルツさん！", "zh": "黑键先生！"}, {"time": 1136.0, "speaker": "芙蓉", "ja": "今です！", "zh": "就是现在！"}, {"time": 1151.0, "speaker": "黑键", "ja": "クライデ！", "zh": "白垩！"}, {"time": 1152.0, "speaker": "芙蓉", "ja": "待ってください！", "zh": "请等一下！"}, {"time": 1154.0, "speaker": "芙蓉", "ja": "彼は今、危険な状態です", "zh": "他现在处于危险状态"}, {"time": 1157.0, "speaker": "芙蓉", "ja": "私たちがすべきことは、末期感染者搬送所に知らせることです", "zh": "我们现在应该通知末期感染者转运机构"}, {"time": 1163.0, "speaker": "黑键", "ja": "なんてことを言うんだ！クライデは死なない！", "zh": "你在说什么！白垩不会死！"}, {"time": 1172.0, "speaker": "黑键", "ja": "クライデ、目が覚めたか！ほら見ろ！クライデは助かるぞ！", "zh": "白垩，你醒了吗！看吧！白垩会得救的！"}, {"time": 1178.0, "speaker": "白垩", "ja": "エーベンホルツ……", "zh": "黑键……"}, {"time": 1180.0, "speaker": "黑键", "ja": "ここだ、私はここにいるぞ！", "zh": "我在这里，我就在这里！"}, {"time": 1183.0, "speaker": "白垩", "ja": "無駄なことはしないでください", "zh": "请不要做无用功了"}, {"time": 1189.0, "speaker": "白垩", "ja": "僕は", "zh": "我"}, {"time": 1192.0, "speaker": "黑键", "ja": "クライデ……", "zh": "白垩……"}, {"time": 1196.0, "speaker": "白垩", "ja": "今", "zh": "现在"}, {"time": 1198.0, "speaker": "白垩", "ja": "体が", "zh": "身体"}, {"time": 1200.0, "speaker": "白垩", "ja": "とても軽いんです", "zh": "非常轻"}, {"time": 1204.0, "speaker": "白垩", "ja": "さっきまでずっと痛かったんですけど", "zh": "刚才还一直很痛"}, {"time": 1208.0, "speaker": "白垩 var audio=document.getElementById('audio');
var playBtn=document.getElementById('play-btn');
var seek=document.getElementById('seek');
var vol=document.getElementById('vol');
var ct=document.getElementById('ct');
var dt=document.getElementById('dt');
var subList=document.getElementById('sub-list');
var noSub=document.getElementById('no-sub');
var trackList=document.getElementById('track-list');
var curSpk=document.getElementById('cur-spk');
var curJa=document.getElementById('cur-ja');
var curZh=document.getElementById('cur-zh');
var cur=-1,showJa=true,showZh=true,autoScroll=true,subEls=[],lastIdx=-1;

function fmt(s){var m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec}

function buildList(){
  TRACKS.forEach(function(t,i){
    var d=document.createElement('div');
    d.className='ti';
    var num=i<10?'0'+i:''+i;
    var badge=t.entries.length>0?'<span class="ti-badge">字幕</span>':'';
    d.innerHTML='<span class="ti-num">'+num+'</span><span class="ti-title">'+t.title+'</span>'+badge;
    d.addEventListener('click',(function(idx){return function(){loadTrack(idx)}})(i));
    trackList.appendChild(d);
  });
}

function loadTrack(idx){
  cur=idx;
  var t=TRACKS[idx];
  document.querySelectorAll('.ti').forEach(function(el,i){el.classList.toggle('active',i===idx)});
  var active=trackList.querySelector('.ti.active');
  if(active)active.scrollIntoView({block:'nearest'});
  document.getElementById('np-title').textContent=t.title;
  document.getElementById('np-sub').textContent='Track '+String(idx).padStart(2,'0');
  audio.src=encodeURIComponent(t.audio).replace(/%2F/g,'/');
  audio.load();
  audio.play().catch(function(){});
  subEls=[];subList.innerHTML='';lastIdx=-1;
  if(t.entries.length===0){
    noSub.style.display='block';subList.style.display='none';
    curSpk.textContent='';curJa.textContent='此曲目暂无字幕（汉化进行中）';curJa.style.color='var(--dim)';curZh.textContent='';
    return;
  }
  noSub.style.display='none';subList.style.display='block';
  t.entries.forEach(function(e,i){
    var d=document.createElement('div');
    d.className='se';
    var spk=e.speaker?'<div class="se-spk">'+e.speaker+'</div>':'';
    var ja=e.ja?'<div class="se-ja">'+e.ja+'</div>':'';
    var zh=e.zh?'<div class="se-zh">'+e.zh+'</div>':'';
    d.innerHTML='<span class="se-t">'+fmt(e.time)+'</span><div class="se-body">'+spk+ja+zh+'</div>';
    d.addEventListener('click',(function(time){return function(){isSeeking=true;audio.currentTime=time;updateSubs(time);audio.play().catch(function(){})}})(e.time));
    subList.appendChild(d);
    subEls.push(d);
  });
  applyVis();
}

function applyVis(){
  subEls.forEach(function(el){
    var ja=el.querySelector('.se-ja'),zh=el.querySelector('.se-zh');
    if(ja)ja.style.display=showJa?'':'none';
    if(zh)zh.style.display=showZh?'':'none';
  });
}

function updateSubs(time){
  if(cur<0)return;
  var entries=TRACKS[cur].entries;
  if(!entries||!entries.length)return;
  var lo=0,hi=entries.length-1,best=-1;
  while(lo<=hi){var mid=(lo+hi)>>1;if(entries[mid].time<=time){best=mid;lo=mid+1}else hi=mid-1}
  if(best===lastIdx)return;
  lastIdx=best;
  subEls.forEach(function(el,i){el.classList.toggle('active',i===best)});
  if(best>=0){
    var e=entries[best];
    curSpk.textContent=e.speaker||'';
    curJa.textContent=e.ja||'';curJa.style.color='';
    curZh.textContent=e.zh||'';
    if(autoScroll&&subEls[best])subEls[best].scrollIntoView({behavior:'smooth',block:'center'});
  }
}

var isSeeking=false;
audio.addEventListener('seeked',function(){isSeeking=false});
audio.addEventListener('timeupdate',function(){
  var t=audio.currentTime,d=audio.duration||0;
  ct.textContent=fmt(t);if(d)seek.value=(t/d)*100;
  if(!isSeeking)updateSubs(t);
});
audio.addEventListener('loadedmetadata',function(){dt.textContent=fmt(audio.duration);seek.value=0;lastIdx=-1});
audio.addEventListener('ended',function(){playBtn.innerHTML='&#9654;';if(cur<TRACKS.length-1)loadTrack(cur+1)});
audio.addEventListener('play',function(){playBtn.innerHTML='&#9646;&#9646;'});
audio.addEventListener('pause',function(){playBtn.innerHTML='&#9654;'});
playBtn.addEventListener('click',function(){if(cur<0){loadTrack(0);return}audio.paused?audio.play():audio.pause()});
seek.addEventListener('input',function(){if(audio.duration)audio.currentTime=(seek.value/100)*audio.duration});
vol.addEventListener('input',function(){audio.volume=vol.value});
document.getElementById('prev-btn').addEventListener('click',function(){if(cur>0)loadTrack(cur-1)});
var menuBtn=document.getElementById('menu-btn');
var sidebar=document.getElementById('sidebar');
var overlay=document.getElementById('overlay');
function openMenu(){sidebar.classList.add('open');overlay.classList.add('show')}
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('show')}
menuBtn.addEventListener('click',openMenu);
overlay.addEventListener('click',closeMenu);
// close sidebar on track select (mobile)
trackList.addEventListener('click',function(){if(window.innerWidth<=640)closeMenu()});
document.getElementById('speed-select').addEventListener('change',function(){audio.playbackRate=parseFloat(this.value)});
document.getElementById('next-btn').addEventListener('click',function(){if(cur<TRACKS.length-1)loadTrack(cur+1)});
document.getElementById('tog-ja').addEventListener('click',function(){showJa=!showJa;this.classList.toggle('on',showJa);applyVis()});
document.getElementById('tog-zh').addEventListener('click',function(){showZh=!showZh;this.classList.toggle('on',showZh);applyVis()});
document.getElementById('auto-tog').addEventListener('click',function(){autoScroll=!autoScroll;this.classList.toggle('on',autoScroll)});
document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();playBtn.click()}
  if(e.code==='ArrowRight')audio.currentTime=Math.min(audio.duration,audio.currentTime+5);
  if(e.code==='ArrowLeft')audio.currentTime=Math.max(0,audio.currentTime-5);
  if(e.code==='ArrowUp'){e.preventDefault();if(cur>0)loadTrack(cur-1)}
  if(e.code==='ArrowDown'){e.preventDefault();if(cur<TRACKS.length-1)loadTrack(cur+1)}
});
buildList();
document.getElementById('em').textContent=['katrienwang','gmail.com'].join('@');

// 移动端背景左右滑动
(function(){
  var bg=document.getElementById('bg-layer');
  var startX,startY,startPos,dragging=false;
  var pos=20; // 初始位置 %

  function getPos(){return pos}

  document.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    startPos=pos;
    dragging=false;
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(e.touches.length!==1)return;
    var dx=e.touches[0].clientX-startX;
    var dy=e.touches[0].clientY-startY;
    // 只有横向滑动幅度大于纵向时才移动背景
    if(!dragging&&Math.abs(dx)<Math.abs(dy))return;
    dragging=true;
    // 屏幕宽度对应约 60% 的范围（图比屏宽很多）
    var pct=startPos - (dx/window.innerWidth)*60;
    pos=Math.max(0,Math.min(100,pct));
    bg.style.backgroundPosition=pos+'% center';
  },{passive:true});

  document.addEventListener('touchend',function(){dragging=false});
})();
</script>
